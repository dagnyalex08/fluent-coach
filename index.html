 <div class="card"><h3>🔐 Tus claves</h3><p class="small">Se guardan <b>solo en este dispositivo</b> (localStorage del navegador) y se envían únicamente a Azure y al proveedor de IA que elijas. No hay servidor intermedio. Es adecuado para uso personal; no compartas este teléfono desbloqueado ni publiques la app con tus claves dentro. Puedes borrarlas cuando quieras. Exportar el progreso <b>no</b> incluye las claves.</p></div>
 <div class="card"><h3>🎯 Azure AI Speech (evaluación de fonemas + voz neural)</h3>
  <label>Clave (Key 1)<div class="row" style="flex-wrap:nowrap;margin:0"><input type="password" id="azKey" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(KEYS.azKey)}" placeholder="pega tu clave de Azure"><button class="sm" data-eye="azKey">👁️</button></div></label>
  <label>Región<select id="azRegion">${REGIONS.map(r=>`<option ${r===KEYS.azRegion?'selected':''}>${r}</option>`).join('')}${REGIONS.includes(KEYS.azRegion)?'':`<option selected>${esc(KEYS.azRegion)}</option>`}</select></label>
  <div class="row"><button class="pri" id="azTest">🔌 Probar conexión</button><span id="azRes" class="small"></span></div>
  <label>Voz del coach en inglés (Azure)<select id="azVoiceEn">${enV.length?voiceOpts(enV,st.azVoiceEn):`<option>${esc(st.azVoiceEn)}</option>`}</select></label>
  <label>Voz del coach en español (Azure)<select id="azVoiceEs">${esV.length?voiceOpts(esV,st.azVoiceEs):`<option>${esc(st.azVoiceEs)}</option>`}</select></label>
  <label><input type="checkbox" id="azTts" ${st.azTts!==false?'checked':''}> Usar la voz neural de Azure (si falla, uso la voz del sistema)</label>
  <details><summary>📘 Cómo conseguir tu clave de Azure (gratis, paso a paso)</summary><ol class="small">
   <li>Entra a <a href="https://azure.microsoft.com/free" target="_blank" rel="noopener">azure.microsoft.com/free</a> y crea una cuenta de Microsoft/Azure (puede pedir una tarjeta solo para verificar identidad).</li>
   <li>Abre <a href="https://portal.azure.com" target="_blank" rel="noopener">portal.azure.com</a> → <b>Crear un recurso</b> → busca <b>"Speech"</b> (Servicios de Voz de Azure AI) → <b>Crear</b>.</li>
   <li>Grupo de recursos: crea uno nuevo (ej. <i>ingles</i>). <b>Región: East US</b> (eastus). Nombre: el que quieras. <b>Plan de tarifa: Free F0</b>.</li>
   <li><b>Revisar y crear</b> → <b>Crear</b>. Cuando termine: <b>Ir al recurso</b> → <b>Claves y punto de conexión</b>.</li>
   <li>Copia <b>CLAVE 1</b> y la <b>Ubicación/Región</b> (ej. <i>eastus</i>). Pégalas arriba y toca <b>Probar conexión</b>.</li></ol>
   <p class="small">El plan <b>gratis F0</b> incluye cada mes <b>5 horas de voz a texto</b> (la evaluación de pronunciación se cobra como voz a texto estándar) y <b>0.5 millones de caracteres de voz neural</b>. Con F0 solo se permite <b>1 reconocimiento a la vez</b>. Fuente: <a href="https://azure.microsoft.com/en-us/pricing/details/cognitive-services/speech-services/" target="_blank" rel="noopener">precios de Azure Speech</a> · <a href="https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-services-quotas-and-limits" target="_blank" rel="noopener">límites</a>. 15 min diarios de práctica ≈ 7.5 h/mes de tu voz, pero solo cuenta el audio mientras el 🎤 está abierto (normalmente bastante menos).</p></details></div>
 <div class="card"><h3>🤖 Tutor de IA (conversación libre)</h3>
  <label>Proveedor<select id="aiPreset">${Object.entries(AI_PRESETS).map(([k,v])=>`<option value="${k}" ${k===KEYS.aiPreset?'selected':''}>${v.name}</option>`).join('')}</select></label>
  <label>URL base<input type="url" id="aiBase" value="${esc(KEYS.aiBase)}" autocapitalize="off" spellcheck="false"></label>
  <label>Modelo<input type="text" id="aiModel" list="aiModels" value="${esc(KEYS.aiModel)}" autocapitalize="off" spellcheck="false"><datalist id="aiModels">${p.models.map(m=>`<option value="${m}">`).join('')}</datalist></label>
  <div class="small mut">${KEYS.aiPreset==='xai'?'grok-4.20-0309-non-reasoning = rápido y barato (recomendado para conversar). grok-4.7 = más inteligente, un poco más lento.':KEYS.aiPreset==='openai'?'gpt-6-luna = rápido y muy barato (recomendado). gpt-6.1-sol = más potente y más caro.':''}</div>
  <label>Clave API<div class="row" style="flex-wrap:nowrap;margin:0"><input type="password" id="aiKey" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(KEYS.aiKey)}" placeholder="xai-… o sk-…"><button class="sm" data-eye="aiKey">👁️</button></div></label>
  <div class="row"><button class="pri" id="aiTestB">🔌 Probar conexión</button><span id="aiRes" class="small"></span></div>
  <details><summary>📘 Cómo conseguir una clave de xAI (Grok)</summary><ol class="small"><li>Entra a <a href="https://console.x.ai" target="_blank" rel="noopener">console.x.ai</a> e inicia sesión o crea tu cuenta.</li><li>Carga créditos (prepago) en la sección de facturación.</li><li>Ve a <b>API Keys</b> → <b>Create API Key</b>. Dale permiso al endpoint de chat y a los modelos (o a todos).</li><li>Copia la clave (solo se muestra una vez) y pégala aquí. Proveedor: xAI.</li></ol><p class="small">Costo aproximado con grok-4.20-0309-non-reasoning ($1.25 entrada / $2.50 salida por millón de tokens): ~0.3 centavos de dólar por turno. Fuente: <a href="https://docs.x.ai/docs/models" target="_blank" rel="noopener">docs.x.ai/docs/models</a></p></details>
  <details><summary>📘 Cómo conseguir una clave de OpenAI</summary><ol class="small"><li>Entra a <a href="https://platform.openai.com" target="_blank" rel="noopener">platform.openai.com</a> y crea tu cuenta.</li><li>En <b>Billing</b> agrega crédito.</li><li>Ve a <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">API keys</a> → <b>Create new secret key</b>, cópiala y pégala aquí. Proveedor: OpenAI.</li></ol><p class="small">gpt-6-luna cuesta $0.10 entrada / $0.50 salida por millón de tokens (~0.04 centavos por turno). Fuente: <a href="https://developers.openai.com/api/docs/models/gpt-6-luna" target="_blank" rel="noopener">documentación de OpenAI</a></p></details></div>
 <div class="card"><h3>🔁 Práctica de pronunciación</h3>
  <label>Meta de precisión para "suena bien": <b id="thV">${st.threshold}</b><input type="range" id="thr" min="60" max="95" step="5" value="${st.threshold}"></label>
  <label>Intentos máximos por palabra<input type="number" id="maxW" min="1" max="10" value="${st.maxWord}"></label>
  <label>Rondas máximas de la frase<input type="number" id="maxP" min="1" max="6" value="${st.maxPhrase}"></label>
  <label><input type="checkbox" id="autoLoop" ${st.autoLoop?'checked':''}> Entrar automáticamente al modo "repetir hasta que suene bien"</label>
  <label><input type="checkbox" id="autoListen" ${st.autoListen?'checked':''}> Escuchar automáticamente después de que el coach modele la palabra (sin tocar 🎤)</label>
  <label>Tutor IA: enviar mi mensaje automáticamente tras un silencio de<select id="tuSil">${[[0,'No, yo toco ⏹'],[2500,'2.5 s'],[4000,'4 s']].map(([v,l])=>`<option value="${v}" ${+st.tuSilence===v?'selected':''}>${l}</option>`).join('')}</select></label>
  <label><input type="checkbox" id="tuSpeakCor" ${st.tuSpeakCor?'checked':''}> Tutor IA: leer en voz alta la primera corrección (en español)</label></div>
 <div class="card"><h3>🔊 Voz y pantalla</h3>
  <p><label>Voz del sistema en inglés (respaldo): <select id="selEn"></select></label></p><p><label>Voz del sistema en español (respaldo): <select id="selEs"></select></label></p>
  <p><label>Velocidad normal: <span id="rateV">${st.rate}x</span><input type="range" id="rate" min="0.5" max="1.3" step="0.05" value="${st.rate}"></label></p>
  <label><input type="checkbox" id="optIpa" ${st.ipa?'checked':''}> Mostrar IPA (alfabeto fonético)</label>
  <label><input type="checkbox" id="optEs" ${st.es?'checked':''}> Mostrar traducción al español</label>
  <label><input type="checkbox" id="optCoachEs" ${st.coachEs?'checked':''}> El coach me explica en voz alta en español</label>
  <label>Meta diaria (minutos)<input type="number" id="goal" min="5" max="180" step="5" value="${st.goal}"></label></div>
 <div class="card"><h3>📱 Instalar en iPhone</h3><ol class="small"><li>Abre la dirección <b>https://</b> de la app en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> (cuadro con flecha ↑) → <b>Agregar a pantalla de inicio</b> → <b>Agregar</b>.</li><li>Abre "Fluent Coach" desde el ícono. La primera vez que toques 🎤, permite el micrófono.</li><li>Si no oyes al coach: sube el volumen y desactiva el modo silencio.</li></ol><p class="small mut">Estado: ${isStandalone()?'✅ instalada como app':'en el navegador'} · ${window.isSecureContext?'🔒 conexión segura':'⚠️ sin https: el micrófono no funcionará'} · ${'serviceWorker' in navigator?'modo sin conexión disponible':'sin modo offline'}</p></div>
 <div class="card"><h3>💾 Datos</h3><div class="row"><button id="btnExport">⬇️ Exportar progreso</button><label class="small">Importar: <input type="file" id="fileImport" accept=".json"></label></div>
  <div class="row"><button id="btnDelKeys">🔑 Borrar mis claves</button><button id="btnReset" class="danger">🗑️ Borrar todo el progreso</button></div><p class="small mut">Tu progreso se guarda solo en este dispositivo. Exporta un respaldo de vez en cuando.</p></div>`;
 fillVoiceSelects();
 $$('[data-eye]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.eye);i.type=i.type==='password'?'text':'password'});
 const k=(id,f)=>{$('#'+id).onchange=$('#'+id).oninput=e=>{KEYS[f]=e.target.value.trim();saveKeys()}};k('azKey','azKey');k('azRegion','azRegion');k('aiBase','aiBase');k('aiModel','aiModel');k('aiKey','aiKey');
 $('#aiPreset').onchange=e=>{KEYS.aiPreset=e.target.value;const p=AI_PRESETS[KEYS.aiPreset];if(p.base){KEYS.aiBase=p.base;KEYS.aiModel=p.models[0]}saveKeys();renderSettings()};
 $('#azTest').onclick=async()=>{const o=$('#azRes');if(!AZ.cfg()){o.textContent='Pega la clave primero.';return}o.textContent='Probando…';
  try{const v=await AZ.testKey();if(v.length){S.azVoices=v.filter(x=>/Neural/.test(x.VoiceType||x.ShortName)&&/^(en-US|es-)/.test(x.Locale)).map(x=>({ShortName:x.ShortName,Locale:x.Locale,Gender:x.Gender}));
    if(!S.azVoices.some(x=>x.ShortName===st.azVoiceEn)){const d=S.azVoices.find(x=>x.Locale==='en-US');if(d)st.azVoiceEn=d.ShortName}if(!S.azVoices.some(x=>x.ShortName===st.azVoiceEs)){const d=S.azVoices.find(x=>/^es-(MX|US)/.test(x.Locale));if(d)st.azVoiceEs=d.ShortName}save()}
   o.innerHTML='✅ Conectado a Azure ('+esc(KEYS.azRegion)+')'+(v.length?` · ${S.azVoices.length} voces`:'');renderSettings();$('#azRes').innerHTML='✅ Conectado a Azure ('+esc(KEYS.azRegion)+')';AZ.load().catch(()=>{});speak('Hi Yonathan! Your Azure voice is ready.')}catch(e){o.textContent='❌ '+(e.message||e)}};
 $('#aiTestB').onclick=async()=>{const o=$('#aiRes');if(!aiCfg()){o.textContent='Completa URL, modelo y clave.';return}o.textContent='Probando…';try{const j=await aiChat([{role:'system',content:'Reply only with JSON {"ok":true,"say":"a 3-word greeting"}'},{role:'user',content:'test'}],{maxTokens:200});o.innerHTML='✅ Funciona: "'+esc(j.say||j.reply||JSON.stringify(j).slice(0,60))+'"'}catch(e){o.textContent='❌ '+(e.message||e)}};
 $('#azVoiceEn').onchange=e=>{st.azVoiceEn=e.target.value;save();speak('Hi! This is my voice.')};$('#azVoiceEs').onchange=e=>{st.azVoiceEs=e.target.value;save();speak('¡Hola! Esta es mi voz.',{lang:'es'})};
 $('#azTts').onchange=e=>{st.azTts=e.target.checked;save()};
 $('#thr').oninput=e=>{st.threshold=+e.target.value;$('#thV').textContent=st.threshold;save()};
 $('#maxW').onchange=e=>{st.maxWord=Math.max(1,Math.min(10,+e.target.value||5));save()};$('#maxP').onchange=e=>{st.maxPhrase=Math.max(1,Math.min(6,+e.target.value||3));save()};
 $('#autoLoop').onchange=e=>{st.autoLoop=e.target.checked;save()};$('#autoListen').onchange=e=>{st.autoListen=e.target.checked;save()};$('#tuSil').onchange=e=>{st.tuSilence=+e.target.value;save()};$('#tuSpeakCor').onchange=e=>{st.tuSpeakCor=e.target.checked;save()};
 $('#rate').oninput=e=>{st.rate=+e.target.value;$('#rateV').textContent=st.rate+'x';save()};$('#rate').onchange=()=>speak('This is the new speed.');
 $('#optIpa').onchange=e=>{st.ipa=e.target.checked;save()};$('#optEs').onchange=e=>{st.es=e.target.checked;save()};$('#optCoachEs').onchange=e=>{st.coachEs=e.target.checked;save()};$('#goal').onchange=e=>{st.goal=Math.max(5,+e.target.value||15);save()};
 $('#btnExport').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='fluent-coach-progreso-'+todayKey()+'.json';a.click()};
 $('#fileImport').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.days)throw 0;localStorage.setItem(KEY,t);load();updateHeader();alert('Progreso importado.')}catch(x){alert('Archivo no válido.')}})};
 $('#btnDelKeys').onclick=()=>{if(confirm('¿Borrar las claves de Azure y de IA de este dispositivo?')){KEYS.azKey='';KEYS.aiKey='';saveKeys();renderSettings()}};
 $('#btnReset').onclick=()=>{if(confirm('¿Seguro? Se borrará todo tu progreso (las claves se conservan).')){localStorage.removeItem(KEY);load();updateHeader();show('home')}}}

banner();initSettings();updateHeader();{const h=location.hash.slice(1);show(document.getElementById('v-'+h)?h:'home')}
if(TTS)setTimeout(loadVoices,500);
/* PWA: service worker (offline shell) */
if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e)))}
window.addEventListener('pagehide',()=>{try{MIC.release()}catch(e){}});
$('#pmClose').onclick=()=>{if(LOOP){LOOP.stop=true}AZ.stop();stopAudio();$('#pmodal').classList.remove('show')};
if(AZ.cfg())setTimeout(()=>AZ.load().catch(()=>{}),1500);

</script></body></html>
