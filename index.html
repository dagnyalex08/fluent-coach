 $$('#guQuiz .opt').forEach(b=>b.onclick=()=>{const right=+b.dataset.j===q[2];$$('#guQuiz .opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('right')});if(!right)b.classList.add('wrong');

/* ---------- Real-time word correction inside the AI conversation ---------- */
function tuDrillTargets(pa,cor,j){const T=S.settings.threshold||80;
 const bad=pa&&pa.words?pa.words.filter(w=>w.err!=='Insertion'&&w.w&&w.w.replace(/[^a-z]/gi,'').length>1&&((w.acc!=null&&w.acc<T)||w.err==='Omission')).sort((a,b)=>(a.acc||0)-(b.acc||0)).slice(0,3):[];
 const mis=(cor||[]).filter(c=>c&&c.corrected&&c.corrected.split(/\s+/).length<=10).slice(0,2);return{bad,mis}}
async function tuDrill(pa,cor,j){if(S.settings.tuDrill===false||!AZ.cfg()||!MIC.supported())return null;
 const {bad,mis}=tuDrillTargets(pa,cor,j);if(!bad.length&&!mis.length)return null;
 const T=S.settings.threshold||80,maxW=S.settings.maxWord||5,maxP=S.settings.maxPhrase||3,auto=S.settings.autoListen;
 const log=$('#tuLog');log.insertAdjacentHTML('beforeend','<div class="msg sam drill"><div class="small"><b>🛠️ Corrección en tiempo real</b></div><div class="dbox"></div></div>');const box=log.lastElementChild.querySelector('.dbox');
 LOOP={};TU.drilling=true;const res=[];const stop=()=>!LOOP||LOOP.stop||!TU||TU.stopSpeak;
 const micBtn=l=>`<div class="row"><button class="mic big pri" data-loop="go">🎤 ${l}</button></div>`;
 const names=bad.map(w=>w.w);
 await coachSay(`Antes de seguir, corrijamos ${names.length?`la pronunciación de <b>${names.map(esc).join(', ')}</b>`:''}${names.length&&mis.length?' y ':''}${mis.length?`${mis.length===1?'una palabra o frase mal usada':'unas palabras mal usadas'}`:''}.`,{es:`Antes de seguir, vamos a corregir ${names.length?(names.length===1?'una palabra que no sonó bien':'unas palabras que no sonaron bien'):''}${names.length&&mis.length?', y ':''}${mis.length?(mis.length===1?'una palabra mal usada':'unas palabras mal usadas'):''}.`});
 for(const w0 of bad){if(stop())break;LOOP.skip=false;let w=w0,tries=0,ok=false;const tip=(j.pron_tips||[]).find(p=>p&&p.word&&p.word.toLowerCase()===w0.w.toLowerCase());
  while(!stop()&&!LOOP.skip&&tries<maxW){
   loopUI(box,`<div class="small mut">Pronunciación (${tries+1}/${maxW}) · meta ${T}</div>${wordDetail(w)}${tip&&tip.tip_es?`<div class="small">👄 ${esc(tip.tip_es)}</div>`:''}${micBtn('Decir "'+esc(w0.w)+'"')}`);
   if(tries===0){const d0=(w0.phon||[]).map(phDiag).sort((a,b)=>a.acc-b.acc)[0];await speak(w0.err==='Omission'?`La palabra "${w0.w}" casi no se escuchó.`:(d0?friendlyTip(w0,d0):`Cuida la palabra "${w0.w}".`),{lang:'es'});if(tip&&tip.tip_es&&!stop()&&!LOOP.skip)await speak(tip.tip_es,{lang:'es'})}
   if(stop()||LOOP.skip)break;await modelWord(w,false);if(stop()||LOOP.skip)break;await speak(say('you'),{lang:'es'});if(stop()||LOOP.skip)break;
   await waitGo(auto);if(stop()||LOOP.skip)break;
   box.querySelector('.loopcard').insertAdjacentHTML('beforeend','<div class="small mut">🎧 Escuchando…</div>');
   let wr;try{wr=await AZ.assess(w0.w,{maxMs:6000})}catch(e){micFail(e);LOOP.stop=true;break}
   tries++;if(wr.error){await coachSay(azErr(wr),{mood:'concern'});continue}
   const ww=wr.words.find(x=>x.err!=='Insertion')||wr.words[0];if(!ww||ww.acc==null){await coachSay('No te escuché. Otra vez.');continue}
   phStat([ww]);sessAdd({en:w0.w,es:'Palabra corregida en conversación'},ww.acc);w=ww;
   if(ww.acc>=T){ok=true;addXP(3);mood('happy');loopUI(box,`<div class="big" style="color:var(--ok)">✅ ${esc(w0.w)}: ${ww.acc}</div>${ww.phon&&ww.phon.length?phChips(ww):""}`);await speak(say('good'),{lang:'es'})}
   else{const d=(ww.phon||[]).map(phDiag).sort((a,b)=>a.acc-b.acc)[0];await coachSay(`<b>${esc(w0.w)}: ${ww.acc}/100.</b> ${d&&d.heard?`Sonó como /${esc(d.heard)}/ en vez de /${esc(d.exp)}/.`:'Casi.'} Otra vez.`,{es:`${ww.acc} de 100. `+(d?friendlyTip(ww,d):say('almost')),mood:'concern'})}
   if(ok)break}
  res.push([w0.w,w.acc,ok]);if(!ok)srsAdd({id:'w_'+w0.w.toLowerCase(),en:w0.w,pr:phRespell(w0.phon||[]),es:'Palabra difícil (pronunciación)',ipa:'/'+(w0.phon||[]).map(x=>x.p).join('')+'/'},true)}

 <b>✅ Lo que aprendiste</b>${li(r.aprendido)}<b>🔧 Lo que falta mejorar</b>${li(r.mejorar)}<b>📌 Tareas para mañana</b>${li(r.tareas)}`}

/* ---------- Start screen (iOS needs a tap before audio) ---------- */
function startScreen(){const t=dailyToday();const ov=$('#startOv');
 $('#startMsg').innerHTML=t&&t.done?'Ya hiciste tu lección de hoy. ¿Seguimos practicando?':'Tu <b>lección del día</b> está lista: una frase nueva, cómo se dice y una mini conversación.';
 $('#startGo').textContent=t&&t.done?'▶ Empezar a practicar':'▶ Empezar';ov.classList.add('show');
 $('#startGo').onclick=async()=>{ov.classList.remove('show');AUD.unlock();SESSION.t0=Date.now();
  if(t&&t.done){show('home');await coachSay('¡Qué bueno verte otra vez, Yonathan! Ya hiciste la lección de hoy. Puedes hablar con el tutor, pronunciar o hacer tu repaso.',{mood:'happy'})}else runDaily()};
 $('#startSkip').onclick=()=>{ov.classList.remove('show')}}

function homeDailyHTML(){const t=dailyToday();const it=itemOf(t);
 return `<div class="card daily-hero"><div class="row" style="justify-content:space-between;margin:0"><b>📅 Lección del día</b>${t&&t.done?'<span>✅ hecha</span>':''}</div>${it?`<div class="en">${esc(it.en)}</div><div class="es">${esc(it.es)}</div>`:''}<div class="row"><button class="pri big" onclick="runDaily(${t&&t.done?'true':''})">${t&&t.done?'➕ Otra frase':'▶ Empezar lección'}</button>${Object.keys(SESSION.items).length||SESSION.cors.length?`<button onclick="endSession('#v-home')">🏁 Terminar sesión</button>`:''}</div></div>`}

banner();initSettings();updateHeader();{const h=location.hash.slice(1);show(document.getElementById('v-'+h)&&h!=='daily'?h:'home')}
startScreen();
if(TTS)setTimeout(loadVoices,500);

window.addEventListener('pagehide',()=>{try{MIC.release()}catch(e){}});

if(AZ.cfg())setTimeout(()=>AZ.load().catch(()=>{}),1500);
