<style>:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--tx:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--ok:#22c55e;--bad:#ef4444;--mid:#f59e0b;--pur:#a78bfa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
a{color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.55em .9em;background:var(--card2);color:var(--tx)}
button:hover{filter:brightness(1.15)}
button.pri{background:var(--acc);color:#04233a;font-weight:600}
button.mic{background:#ef4444;color:#fff;font-weight:600}
button.mic.on{animation:pulse 1s infinite}
button.sm{padding:.3em .6em;font-size:.85em}
button:disabled{opacity:.5;cursor:default}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ef444488}50%{box-shadow:0 0 0 10px #ef444400}}
header.top{display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;background:#0b1222;position:sticky;top:0;z-index:20;border-bottom:1px solid #1f2a44}
.brand{font-weight:800;font-size:1.1rem}
.hstats{margin-left:auto;display:flex;gap:.7rem;font-size:.9rem;color:var(--mut)}
.hstats b{color:var(--tx)}
#banner .warn{background:#7c2d12;color:#ffedd5;padding:.6rem .9rem;font-size:.9rem}
#coachBar{display:flex;gap:.8rem;align-items:center;padding:.6rem .8rem;background:linear-gradient(90deg,#13203b,#1a1f3d);position:sticky;top:44px;z-index:15;border-bottom:1px solid #1f2a44}
#avatar{width:92px;height:92px;flex:none;cursor:pointer}

.tile{background:var(--card);border-radius:14px;padding:.8rem;cursor:pointer;border:1px solid transparent}

.mut{color:var(--mut)}.small{font-size:.85rem}

.es{color:var(--mut);font-size:.92rem}
.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.45rem}
.res{margin-top:.5rem;display:none}

.words .w{display:inline-block;padding:.05em .3em;margin:.1em;border-radius:6px}
.w.ok{background:#14532d;color:#bbf7d0}.w.bad{background:#7f1d1d;color:#fecaca}.w.mid{background:#78350f;color:#fde68a}.w.extra{background:#334155;color:#cbd5e1;text-decoration:line-through}
.score{font-size:1.5rem;font-weight:800}
.fb{font-size:.92rem;margin-top:.3rem}

.line{border-left:4px solid var(--card2);padding-left:.7rem}
.line.A{border-color:#60a5fa}.line.B{border-color:#f472b6}

.spk{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--mut)}
.bar{height:10px;background:#0b1222;border-radius:6px;overflow:hidden}

.kpi{font-size:1.6rem;font-weight:800}
.chips span{display:inline-block;background:var(--card2);padding:.15em .55em;border-radius:20px;margin:.15em;font-size:.85rem}
input[type=range]{width:160px}
select,input[type=number],input[type=text]{background:var(--card2);color:var(--tx);border:1px solid #334155;border-radius:8px;padding:.35em .5em;font:inherit}
.timer{font-size:3.2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.big{font-size:2rem;font-weight:800}

.modal.show{display:flex}
.modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}
table{border-collapse:collapse;width:100%}td,th{padding:.35rem;border-bottom:1px solid #334155;text-align:left;font-size:.9rem}
.opt{display:block;width:100%;text-align:left;margin:.3rem 0}
.opt.right{background:#14532d}.opt.wrong{background:#7f1d1d}
.hide{display:none!important}
/* avatar */
#avatar .mouth{transform-origin:60px 84px;transition:transform .08s}
#avatar.talking .mouth{animation:talk .22s infinite alternate}
@keyframes talk{0%{transform:scaleY(.25)}100%{transform:scaleY(1.15)}}
#avatar .mouth{transform:scaleY(.3)}
#avatar .eye{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#avatar .ring{opacity:0}
#avatar.listening .ring{animation:ring 1.2s infinite}
@keyframes ring{0%{opacity:.8;transform:scale(.85)}100%{opacity:0;transform:scale(1.25)}}
#avatar .ring{transform-origin:60px 60px}
#avatar .smile{opacity:0;transition:opacity .3s}
#avatar.happy .smile{opacity:1}#avatar.happy .mouth{opacity:0}
#avatar .brow{transition:transform .3s}
#avatar.concern .brow.l{transform:rotate(12deg) translateY(2px);transform-origin:44px 40px}
#avatar.concern .brow.r{transform:rotate(-12deg) translateY(2px);transform-origin:76px 40px}
#avatar.listening .ear{fill:#38bdf8}
@media (max-width:600px){#avatar{width:64px;height:64px}#bubble{font-size:.88rem}.en{font-size:1.05rem}main{padding:.5rem}#coachBar{top:42px}}

.fbx{background:var(--card2);border-radius:10px;padding:.45rem .6rem;margin:.4rem 0;font-size:.92rem}
.cor{margin:.3rem 0}.cor s{color:#fca5a5}
#tuLog{padding-bottom:7.5rem}
#tuBar{position:fixed;left:0;right:0;bottom:0;background:#0b1222;border-top:1px solid #1f2a44;padding:.5rem .7rem calc(.5rem + env(safe-area-inset-bottom));z-index:30}
#tuBar input{margin:0}#tuBar .mic{border-radius:50%;width:60px;height:60px;flex:none;font-size:1.5rem;padding:0}

.modal{padding:calc(1rem + env(safe-area-inset-top)) .6rem calc(1rem + env(safe-area-inset-bottom))}
@media (max-width:600px){#coachBar{padding:.4rem .6rem}#coachBar{top:calc(42px + env(safe-area-inset-top))}.hero{grid-template-columns:1fr}.msg{max-width:100%}}

.big2{font-size:1.6rem;font-weight:800}.daily-hero{border:2px solid var(--acc)}.sp-es{margin:.3rem 0;font-size:1.02rem}.seg-en{background:#0f172a;border-radius:10px;padding:.45rem .6rem;margin:.35rem 0}.fbx.practice{border:2px solid var(--pur)}.recap ul{margin:.2rem 0 .5rem;padding-left:1.2rem}.modal.start{z-index:60;background:#0f172af2}.modal.start .card{max-width:420px}

.chk{display:flex;gap:.5rem;align-items:center;margin:.35rem 0}.chk input{width:auto}
.msg.drill{border-left:4px solid var(--acc)}

</style></head><body>

<script>
'use strict';
const DATA={"dialogues": [{"id": "cafe", "title": "En la cafetería", "icon": "☕", "level": "A2", "roles": ["Barista", "Cliente"], "lines": [{"id": "d_cafe_0", "s": "A", "en": "Hi there! What can I get for you?", "pr": "jái dhér! uát ken ai guét fer yu?", "es": "¡Hola! ¿Qué te sirvo?", "ipa": "/haɪ ðɛr! wət kən aɪ gɪt fər ju?/"}, {"id": "d_cafe_1", "s": "B", "en": "Can I get a medium iced latte with oat milk?", "pr": "ken ai guéda mídiam áist láatei uidh óut milk?", "es": "¿Me das un latte helado mediano con leche de avena?", "ipa": "/kən aɪ gɪt ə ˈmidiəm aɪst ˈlɑˌteɪ wɪθ oʊt mɪlk?/"}, {"id": "d_cafe_2", "s": "A", "en": "Sure. Anything else?", "pr": "shur. énithing éls?", "es": "Claro. ¿Algo más?", "ipa": "/ʃʊr. ˈɛniˌθɪŋ ɛls?/"}, {"id": "d_cafe_3", "s": "B", "en": "Yeah, I'll also take a blueberry muffin.", "pr": "yéa, ail ólsou téik a blúberi máfin.", "es": "Sí, también me llevo un muffin de arándanos.", "ipa": "/jæ, aɪl ˈɔlsoʊ teɪk ə ˈbluˌbɛri ˈməfən./"}, {"id": "d_cafe_4", "s": "A", "en": "Do you want that warmed up?", "pr": "du ya uánt dhat uórmd áp?", "es": "¿Lo quieres calentado?", "ipa": "/du ju wɔnt ðət wɔrmd əp?/"}, {"id": "d_cafe_5", "s": "B", "en": "No, I'm good, thanks.", "pr": "nóu, aim gúd, thénks.", "es": "No, así está bien, gracias.", "ipa": "/noʊ, əm gʊd, θæŋks./"}, {"id": "d_cafe_6", "s": "A", "en": "For here or to go?", "pr": "fer jír or tu góu?", "es": "¿Para tomar aquí o para llevar?", "ipa": "/fər hir ər tɪ goʊ?/"}, {"id": "d_cafe_7", "s": "B", "en": "To go, please.", "pr": "tu góu, plíiz.", "es": "Para llevar, por favor.", "ipa": "/tɪ goʊ, pliz./"}, {"id": "d_cafe_8", "s": "A", "en": "That'll be seven fifty. You can tap your card right there.", "pr": "dhádl bi séven fífti. yu ken táp yor kárd ráit dhér.", "es": "Son siete cincuenta. Puedes acercar tu tarjeta ahí.", "ipa": "/ˈðætəl bi ˈsɛvən ˈfɪfti. ju kən tæp jʊr kɑrd raɪt ðɛr./"}, {"id": "d_cafe_9", "s": "B", "en": "Perfect. Thanks so much!", "pr": "pérfekt. thénks sóu mách!", "es": "Perfecto. ¡Muchas gracias!", "ipa": "/ˈpərˌfɪkt. θæŋks soʊ məʧ!/"}, {"id": "d_cafe_10", "s": "A", "en": "You got it. Have a good one!", "pr": "yu gádit. jáva gúd uan!", "es": "Con gusto. ¡Que te vaya bien!", "ipa": "/ju gɑt ɪt. hæv ə gʊd wən!/"}]}, {"id": "interview", "title": "Entrevista de trabajo", "icon": "💼", "level": "B1", "roles": ["Entrevistadora", "Candidato"], "lines": [{"id": "d_interview_0", "s": "A", "en": "Thanks for coming in today. So, tell me a little about yourself.", "pr": "thénks fer kámin in tudéi. sóu, tél mi a lírel abáut yorsélf.", "es": "Gracias por venir hoy. Cuéntame un poco sobre ti.", "ipa": "/θæŋks fər ˈkəmɪŋ ɪn təˈdeɪ. soʊ, tɛl mi ə ˈlɪtəl əˈbaʊt ˈjɔrsɛlf./"}, {"id": "d_interview_1", "s": "B", "en": "Sure. I've been working in customer service for about five years.", "pr": "shur. aiv bin uérkin in kástamer sérvis fer abáut fáiv yírz.", "es": "Claro. Llevo unos cinco años trabajando en servicio al cliente.", "ipa": "/ʃʊr. aɪv bɪn ˈwərkɪŋ ɪn ˈkəstəmər ˈsərvɪs fər əˈbaʊt faɪv jɪrz./"}, {"id": "d_interview_2", "s": "A", "en": "What would you say is your biggest strength?", "pr": "uát uúdyu séi iz yor bíguest strénkth?", "es": "¿Cuál dirías que es tu mayor fortaleza?", "ipa": "/wət wʊd ju seɪ ɪz jʊr ˈbɪgəst strɛŋθ?/"}, {"id": "d_interview_3", "s": "B", "en": "I'm a fast learner, and I'm really good at solving problems under pressure.", "pr": "aim a fást lérner, en aim ríli gúdet sálvin prábelemz ánder présher.", "es": "Aprendo rápido y soy muy bueno resolviendo problemas bajo presión.", "ipa": "/əm ə fæst ˈlərnər, ənd əm ˈrɪli gʊd æt ˈsɑlvɪŋ ˈprɑbləmz ˈəndər ˈprɛʃər./"}, {"id": "d_interview_4", "s": "A", "en": "Can you give me an example?", "pr": "ken yu guív mi en igzámpel?", "es": "¿Me puedes dar un ejemplo?", "ipa": "/kən ju gɪv mi ən ɪgˈzæmpəl?/"}, {"id": "d_interview_5", "s": "B", "en": "Last year, our system crashed during a holiday sale, and I helped the team keep customers happy.", "pr": "lást yír, áur sístem krásht dúrin a jálidei séil, en ai jélpt dha tíim kíip kástamerz jápi.", "es": "El año pasado el sistema falló durante una venta de temporada y ayudé al equipo a mantener contentos a los clientes.", "ipa": "/læst jɪr, ɑr ˈsɪstəm kræʃt ˈdʊrɪŋ ə ˈhɑlɪˌdeɪ seɪl, ənd aɪ hɛlpt ðə tim kip ˈkəstəmərz ˈhæpi./"}, {"id": "d_interview_6", "s": "A", "en": "Where do you see yourself in five years?", "pr": "uér du yu síi yorsélf in fáiv yírz?", "es": "¿Dónde te ves en cinco años?", "ipa": "/wɛr du ju si ˈjɔrsɛlf ɪn faɪv jɪrz?/"}, {"id": "d_interview_7", "s": "B", "en": "I'd like to grow into a team lead role.", "pr": "aid láik tu gróu íntu a tíim líid róul.", "es": "Me gustaría crecer hasta un puesto de líder de equipo.", "ipa": "/aɪd laɪk tɪ groʊ ˈɪntu ə tim lɛd roʊl./"}, {"id": "d_interview_8", "s": "A", "en": "Great. Do you have any questions for me?", "pr": "gréit. du yu jáv éni kuéschenz fer mi?", "es": "Genial. ¿Tienes alguna pregunta para mí?", "ipa": "/greɪt. du ju hæv ˈɛni kˈwɛsʧənz fər mi?/"}, {"id": "d_interview_9", "s": "B", "en": "Yes. What does a typical day look like here?", "pr": "yés. uát daz a típikal déi lúk láik jír?", "es": "Sí. ¿Cómo es un día típico aquí?", "ipa": "/jɛs. wət dɪz ə ˈtɪpɪkəl deɪ lʊk laɪk hir?/"}]}, {"id": "doctor", "title": "En el médico", "icon": "🩺", "level": "A2", "roles": ["Doctora", "Paciente"], "lines": [{"id": "d_doctor_0", "s": "A", "en": "Hi, what brings you in today?", "pr": "jái, uát bríngz yu in tudéi?", "es": "Hola, ¿qué te trae hoy por aquí?", "ipa": "/haɪ, wət brɪŋz ju ɪn təˈdeɪ?/"}, {"id": "d_doctor_1", "s": "B", "en": "I've had a sore throat and a headache for three days.", "pr": "aiv jád a sór thróut en a jédeik fer thríi déiz.", "es": "Llevo tres días con dolor de garganta y de cabeza.", "ipa": "/aɪv hæd ə sɔr θroʊt ənd ə ˈhɛˌdeɪk fər θri deɪz./"}, {"id": "d_doctor_2", "s": "A", "en": "Any fever or coughing?", "pr": "éni fíiver or kófin?", "es": "¿Fiebre o tos?", "ipa": "/ˈɛni ˈfivər ər ˈkɑfɪŋ?/"}, {"id": "d_doctor_3", "s": "B", "en": "A little fever last night, but not much coughing.", "pr": "a lírel fíiver lás náit, bat nát mách kófin.", "es": "Un poco de fiebre anoche, pero no mucha tos.", "ipa": "/ə ˈlɪtəl ˈfivər læst naɪt, bət nɑt məʧ ˈkɑfɪŋ./"}, {"id": "d_doctor_4", "s": "A", "en": "Okay, let me take a look. Open your mouth and say ah.", "pr": "oukéi, lémi téik a lúk. óupen yor máuth en séi áa.", "es": "Bien, déjame revisar. Abre la boca y di 'aaa'.", "ipa": "/ˌoʊˈkeɪ, lɛt mi teɪk ə lʊk. ˈoʊpən jʊr maʊθ ənd seɪ ɑ./"}, {"id": "d_doctor_5", "s": "B", "en": "Is it something serious?", "pr": "íz it sámthing sírias?", "es": "¿Es algo grave?", "ipa": "/ɪz ɪt ˈsəmθɪŋ ˈsɪriəs?/"}, {"id": "d_doctor_6", "s": "A", "en": "It looks like a mild infection. I'm going to prescribe some antibiotics.", "pr": "it lúks láik a máild infékshen. aim gána priskráib sam antibaiátiks.", "es": "Parece una infección leve. Te voy a recetar antibióticos.", "ipa": "/ɪt lʊks laɪk ə maɪld ˌɪnˈfɛkʃən. əm goʊɪŋ tɪ prəˈskraɪb səm ˌæntibaɪˈɑtɪks./"}, {"id": "d_doctor_7", "s": "B", "en": "How often should I take them?", "pr": "jáu ófen shúdai téik dhem?", "es": "¿Cada cuánto los tomo?", "ipa": "/haʊ ˈɔfən ʃʊd aɪ teɪk ðɛm?/"}, {"id": "d_doctor_8", "s": "A", "en": "Twice a day with food, for seven days.", "pr": "tuáis a déi uidh fúud, fer séven déiz.", "es": "Dos veces al día con comida, durante siete días.", "ipa": "/twaɪs ə deɪ wɪθ fud, fər ˈsɛvən deɪz./"}, {"id": "d_doctor_9", "s": "B", "en": "Got it. Thank you, doctor.", "pr": "gádit. thénk yu, dákter.", "es": "Entendido. Gracias, doctora.", "ipa": "/gɑt ɪt. θæŋk ju, ˈdɔktər./"}]}, {"id": "smalltalk", "title": "Charla con un vecino", "icon": "🌦️", "level": "A2", "roles": ["Vecino", "Vecino 2"], "lines": [{"id": "d_smalltalk_0", "s": "A", "en": "Hey! Crazy weather today, huh?", "pr": "jéi! kréizi uédher tudéi, já?", "es": "¡Hola! Qué loco está el clima hoy, ¿eh?", "ipa": "/heɪ! ˈkreɪzi ˈwɛðər təˈdeɪ, hə?/"}, {"id": "d_smalltalk_1", "s": "B", "en": "I know, right? It was sunny this morning and now it's pouring.", "pr": "ai nóu, ráit? it uaz sáni dhis mórnin en náu its pórin.", "es": "¿Verdad? Esta mañana hacía sol y ahora está diluviando.", "ipa": "/aɪ noʊ, raɪt? ɪt wɑz ˈsəni ðɪs ˈmɔrnɪŋ ənd naʊ ɪts ˈpɔrɪŋ./"}, {"id": "d_smalltalk_2", "s": "A", "en": "Did you do anything fun this weekend?", "pr": "díyu dú énithing fán dhis uíikend?", "es": "¿Hiciste algo divertido este fin de semana?", "ipa": "/dɪd ju du ˈɛniˌθɪŋ fən ðɪs ˈwiˌkɪnd?/"}, {"id": "d_smalltalk_3", "s": "B", "en": "Not really, I just stayed home and binge-watched a show.", "pr": "nát ríli, ai yast stéid jóum en bínch-uácht a shóu.", "es": "No mucho, me quedé en casa y vi una serie de corrido.", "ipa": "/nɑt ˈrɪli, aɪ ʤɪst steɪd hoʊm ənd … ə ʃoʊ./"}, {"id": "d_smalltalk_4", "s": "A", "en": "Oh nice, what were you watching?", "pr": "óu náis, uát uér yu uáchin?", "es": "Qué bien, ¿qué estabas viendo?", "ipa": "/oʊ nis, wət wər ju ˈwɑʧɪŋ?/"}, {"id": "d_smalltalk_5", "s": "B", "en": "A crime series. It's really good, you should check it out.", "pr": "a kráim síriz. its ríli gúd, yu shud chékidáut.", "es": "Una serie policiaca. Está muy buena, deberías verla.", "ipa": "/ə kraɪm ˈsɪriz. ɪts ˈrɪli gʊd, ju ʃʊd ʧɛk ɪt aʊt./"}, {"id": "d_smalltalk_6", "s": "A", "en": "I'll have to look it up. Anyway, I gotta run. See you around!", "pr": "ail jáv tu lúkidáp. éniuei, ai gára rán. síi yu aráund!", "es": "Tendré que buscarla. Bueno, me tengo que ir. ¡Nos vemos!", "ipa": "/aɪl hæv tɪ lʊk ɪt əp. ˈɛniˌweɪ, aɪ ˈgɑtə rən. si ju əraʊnd!/"}, {"id": "d_smalltalk_7", "s": "B", "en": "Take care!", "pr": "téik kér!", "es": "¡Cuídate!", "ipa": "/teɪk kɛr!/"}]}, {"id": "phone", "title": "Llamada para una cita", "icon": "📞", "level": "B1", "roles": ["Recepcionista", "Paciente"], "lines": [{"id": "d_phone_0", "s": "A", "en": "Thank you for calling Bright Smile Dental, this is Karen. How can I help you?", "pr": "thénk yu fer kólin bráit smáil déntal, dhis iz kéren. jáu ken ai jélp yu?", "es": "Gracias por llamar a Bright Smile Dental, habla Karen. ¿En qué le ayudo?", "ipa": "/θæŋk ju fər ˈkɔlɪŋ braɪt smaɪl ˈdɛntəl, ðɪs ɪz ˈkɛrən. haʊ kən aɪ hɛlp ju?/"}, {"id": "d_phone_1", "s": "B", "en": "Hi, I'd like to make an appointment for a cleaning.", "pr": "jái, aid láik tu méik an apóintment fer a klíinin.", "es": "Hola, quisiera hacer una cita para una limpieza.", "ipa": "/haɪ, aɪd laɪk tɪ meɪk ən əˈpɔɪntmənt fər ə ˈklinɪŋ./"}, {"id": "d_phone_2", "s": "A", "en": "Sure. Are you a new patient?", "pr": "shur. ar yu a nú péishent?", "es": "Claro. ¿Es paciente nuevo?", "ipa": "/ʃʊr. ər ju ə nu ˈpeɪʃənt?/"}, {"id": "d_phone_3", "s": "B", "en": "Yes, it's my first time.", "pr": "yés, its mai férst táim.", "es": "Sí, es mi primera vez.", "ipa": "/jɛs, ɪts maɪ fərst taɪm./"}, {"id": "d_phone_4", "s": "A", "en": "We have an opening next Tuesday at ten thirty. Does that work?", "pr": "uí jáv an óupenin nékst túzdei at tén thérdi. daz dhat uérk?", "es": "Tenemos un espacio el próximo martes a las diez y media. ¿Le funciona?", "ipa": "/wi hæv ən ˈoʊpənɪŋ nɛkst ˈtuzˌdeɪ æt tɛn ˈθərˌdi. dɪz ðət wərk?/"}, {"id": "d_phone_5", "s": "B", "en": "Could we do something in the afternoon instead?", "pr": "kúd ui dú sámthing in dhi afternúun instéd?", "es": "¿Podría ser mejor en la tarde?", "ipa": "/kʊd wi du ˈsəmθɪŋ ɪn ðə ˌæftərˈnun ˌɪnˈstɛd?/"}, {"id": "d_phone_6", "s": "A", "en": "Let me check. How about Thursday at three fifteen?", "pr": "lémi chék. jáu abáut thérzdei at thríi fiftíin?", "es": "Déjeme ver. ¿Qué tal el jueves a las tres y cuarto?", "ipa": "/lɛt mi ʧɛk. haʊ əˈbaʊt ˈθərzˌdeɪ æt θri ˈfɪfˈtin?/"}, {"id": "d_phone_7", "s": "B", "en": "That works for me.", "pr": "dhat uérks fer mi.", "es": "Me funciona.", "ipa": "/ðət wərks fər mi./"}, {"id": "d_phone_8", "s": "A", "en": "Great. Can I get your name and phone number?", "pr": "gréit. ken ai guét yor néim en fóun námber?", "es": "Perfecto. ¿Me da su nombre y teléfono?", "ipa": "/greɪt. kən aɪ gɪt jʊr neɪm ənd foʊn ˈnəmbər?/"}, {"id": "d_phone_9", "s": "B", "en": "Sure, let me spell my last name for you.", "pr": "shur, lémi spél mai lást néim fer yu.", "es": "Claro, le deletreo mi apellido.", "ipa": "/ʃʊr, lɛt mi spɛl maɪ læst neɪm fər ju./"}]}, {"id": "directions", "title": "Pedir direcciones", "icon": "🗺️", "level": "A2", "roles": ["Turista", "Peatón"], "lines": [{"id": "d_directions_0", "s": "A", "en": "Excuse me, do you know how to get to the subway station?", "pr": "ekskiúz mi, du yu nóu jáu tu guét tu dha sábuei stéishen?", "es": "Disculpe, ¿sabe cómo llegar a la estación del metro?", "ipa": "/ɪkˈskjuz mi, du ju noʊ haʊ tɪ gɪt tɪ ðə ˈsəbˌweɪ ˈsteɪʃən?/"}, {"id": "d_directions_1", "s": "B", "en": "Yeah, go straight for two blocks, then turn left at the light.", "pr": "yéa, góu stréit fer tú bláks, dhen térn léft at dha láit.", "es": "Sí, siga derecho dos cuadras y luego gire a la izquierda en el semáforo.", "ipa": "/jæ, goʊ streɪt fər tu blɑks, ðɛn tərn lɛft æt ðə laɪt./"}, {"id": "d_directions_2", "s": "A", "en": "Is it far from here?", "pr": "íz it fár fram jír?", "es": "¿Está lejos de aquí?", "ipa": "/ɪz ɪt fɑr frəm hir?/"}, {"id": "d_directions_3", "s": "B", "en": "Not really, it's about a five-minute walk.", "pr": "nát ríli, its abáuda fáiv-mínit uók.", "es": "No mucho, como a cinco minutos caminando.", "ipa": "/nɑt ˈrɪli, ɪts əˈbaʊt ə … wɔk./"}, {"id": "d_directions_4", "s": "A", "en": "Should I take the bus instead?", "pr": "shúdai téik dha bás instéd?", "es": "¿Mejor tomo el autobús?", "ipa": "/ʃʊd aɪ teɪk ðə bəs ˌɪnˈstɛd?/"}, {"id": "d_directions_5", "s": "B", "en": "Nah, walking is faster this time of day. Traffic is crazy.", "pr": "náa, uókin iz fáster dhis táim av déi. tráfik iz kréizi.", "es": "No, caminando es más rápido a esta hora. El tráfico está terrible.", "ipa": "/nɑ, ˈwɔkɪŋ ɪz ˈfæstər ðɪs taɪm əv deɪ. ˈtræfɪk ɪz ˈkreɪzi./"}, {"id": "d_directions_6", "s": "A", "en": "Got it. Straight, two blocks, then left.", "pr": "gádit. stréit, tú bláks, dhen léft.", "es": "Entendido. Derecho, dos cuadras y luego a la izquierda.", "ipa": "/gɑt ɪt. streɪt, tu blɑks, ðɛn lɛft./"}, {"id": "d_directions_7", "s": "B", "en": "Exactly. You can't miss it. It's right across from the bank.", "pr": "igzáktli. yu kánt mís it. its ráit akrós fram dha bénk.", "es": "Exacto. No tiene pérdida. Está justo enfrente del banco.", "ipa": "/ɪgˈzæktli. ju kænt mɪs ɪt. ɪts raɪt əˈkrɔs frəm ðə bæŋk./"}, {"id": "d_directions_8", "s": "A", "en": "Thanks a lot!", "pr": "thénks a lát!", "es": "¡Muchas gracias!", "ipa": "/θæŋks ə lɔt!/"}, {"id": "d_directions_9", "s": "B", "en": "No problem. Good luck!", "pr": "nóu prábelem. gúd lák!", "es": "De nada. ¡Suerte!", "ipa": "/noʊ ˈprɑbləm. gʊd lək!/"}]}, {"id": "restaurant", "title": "En el restaurante", "icon": "🍽️", "level": "A2", "roles": ["Mesero", "Cliente"], "lines": [{"id": "d_restaurant_0", "s": "A", "en": "Hi, welcome in! How many in your party?", "pr": "jái, uélkam in! jáu méni in yor pári?", "es": "¡Hola, bienvenidos! ¿Cuántas personas son?", "ipa": "/haɪ, ˈwɛlkəm ɪn! haʊ ˈmɛni ɪn jʊr ˈpɑrti?/"}, {"id": "d_restaurant_1", "s": "B", "en": "Just two, please.", "pr": "yast tú, plíiz.", "es": "Solo dos, por favor.", "ipa": "/ʤɪst tu, pliz./"}, {"id": "d_restaurant_2", "s": "A", "en": "Right this way. Can I start you off with something to drink?", "pr": "ráit dhis uéi. ken ai stárt yu óf uidh sámthin tu drínk?", "es": "Por aquí. ¿Les traigo algo de tomar para empezar?", "ipa": "/raɪt ðɪs weɪ. kən aɪ stɑrt ju ɔf wɪθ ˈsəmθɪŋ tɪ drɪŋk?/"}, {"id": "d_restaurant_3", "s": "B", "en": "Could we get two iced teas, please?", "pr": "kúd ui guét tú áist tíiz, plíiz?", "es": "¿Nos trae dos tés helados, por favor?", "ipa": "/kʊd wi gɪt tu aɪst tiz, pliz?/"}, {"id": "d_restaurant_4", "s": "A", "en": "Are you ready to order, or do you need a few more minutes?", "pr": "ar yu rédi tu órder, or du yu níid a fiú mor mínits?", "es": "¿Están listos para ordenar o necesitan unos minutos más?", "ipa": "/ər ju ˈrɛdi tɪ ˈɔrdər, ər du ju nid ə fju mɔr ˈmɪnəts?/"}, {"id": "d_restaurant_5", "s": "B", "en": "I think we're ready. I'll have the grilled chicken with a side salad.", "pr": "ai thínk uír rédi. ail jáv dha gríld chíken uidh a sáid sálad.", "es": "Creo que estamos listos. Yo quiero el pollo a la parrilla con ensalada.", "ipa": "/aɪ θɪŋk wɪr ˈrɛdi. aɪl hæv ðə grɪld ˈʧɪkən wɪθ ə saɪd ˈsæləd./"}, {"id": "d_restaurant_6", "s": "A", "en": "How would you like the dressing? We have ranch or vinaigrette.", "pr": "jáu uúd yu láik dha drésin? ui jáv rénch or vinegrét.", "es": "¿Qué aderezo prefiere? Tenemos ranch o vinagreta.", "ipa": "/haʊ wʊd ju laɪk ðə ˈdrɛsɪŋ? wi hæv rænʧ ər …./"}, {"id": "d_restaurant_7", "s": "B", "en": "Ranch on the side, please.", "pr": "rénch on dha sáid, plíiz.", "es": "Ranch aparte, por favor.", "ipa": "/rænʧ ɔn ðə saɪd, pliz./"}, {"id": "d_restaurant_8", "s": "A", "en": "How is everything tasting?", "pr": "jáu iz évrithing téistin?", "es": "¿Qué tal está todo?", "ipa": "/haʊ ɪz ˈɛvriˌθɪŋ ˈteɪstɪŋ?/"}, {"id": "d_restaurant_9", "s": "B", "en": "Everything is delicious. Could we get the check when you have a chance?", "pr": "évrithing iz dilíshas. kúd ui guét dha chék uén yu jáv a chéns?", "es": "Todo está delicioso. ¿Nos trae la cuenta cuando pueda?", "ipa": "/ˈɛvriˌθɪŋ ɪz dɪˈlɪʃəs. kʊd wi gɪt ðə ʧɛk wɪn ju hæv ə ʧæns?/"}]}, {"id": "meeting", "title": "Reunión de trabajo", "icon": "🧑‍💻", "level": "B1", "roles": ["Jefa", "Empleado"], "lines": [{"id": "d_meeting_0", "s": "A", "en": "Okay, let's get started. Thanks everyone for joining.", "pr": "oukéi, lets guét stárded. thénks évriuan fer yóinin.", "es": "Bien, empecemos. Gracias a todos por unirse.", "ipa": "/ˌoʊˈkeɪ, lɛts gɪt ˈstɑrtɪd. θæŋks ˈɛvriˌwən fər ˈʤɔɪnɪŋ./"}, {"id": "d_meeting_1", "s": "B", "en": "Before we dive in, can I give a quick update on the project?", "pr": "bifór ui dáiv in, ken ai guív a kuík ápdeit on dha prályekt?", "es": "Antes de entrar en materia, ¿puedo dar una actualización rápida del proyecto?", "ipa": "/ˌbiˈfɔr wi daɪv ɪn, kən aɪ gɪv ə kwɪk ˈəpˌdeɪt ɔn ðə ˈprɑʤɛkt?/"}, {"id": "d_meeting_2", "s": "A", "en": "Sure, go ahead.", "pr": "shur, góu ajéd.", "es": "Claro, adelante.", "ipa": "/ʃʊr, goʊ əˈhɛd./"}, {"id": "d_meeting_3", "s": "B", "en": "We're a little behind schedule, but we should wrap it up by Friday.", "pr": "uír a lírel bijáind skéyul, bat ui shud répidáp bai fráidei.", "es": "Vamos un poco atrasados, pero deberíamos terminar para el viernes.", "ipa": "/wɪr ə ˈlɪtəl bɪˈhaɪnd ˈskɛʤʊl, bət wi ʃʊd ræp ɪt əp baɪ ˈfraɪˌdeɪ./"}, {"id": "d_meeting_4", "s": "A", "en": "What's slowing us down?", "pr": "uáts slóuin as dáun?", "es": "¿Qué nos está frenando?", "ipa": "/wəts sloʊɪŋ ˈjuˈɛs daʊn?/"}, {"id": "d_meeting_5", "s": "B", "en": "We're waiting on feedback from the client.", "pr": "uír uéitin on fíidbek fram dha kláient.", "es": "Estamos esperando comentarios del cliente.", "ipa": "/wɪr ˈweɪtɪŋ ɔn ˈfidˌbæk frəm ðə klaɪənt./"}, {"id": "d_meeting_6", "s": "A", "en": "Okay. Can you follow up with them today?", "pr": "oukéi. ken yu fálou áp uidh dhem tudéi?", "es": "Bien. ¿Puedes darles seguimiento hoy?", "ipa": "/ˌoʊˈkeɪ. kən ju ˈfɑloʊ əp wɪθ ðɛm təˈdeɪ?/"}, {"id": "d_meeting_7", "s": "B", "en": "Absolutely. I'll send them an email after this meeting.", "pr": "ábsolútli. ail sénd dhem an íimeil áfter dhis míitin.", "es": "Por supuesto. Les mando un correo después de esta reunión.", "ipa": "/ˌæbsəˈlutli. aɪl sɛnd ðɛm ən iˈmeɪl ˈæftər ðɪs ˈmitɪŋ./"}, {"id": "d_meeting_8", "s": "A", "en": "Great. Let's circle back on this next week.", "pr": "gréit. lets sérkel bák on dhis nékst uíik.", "es": "Genial. Retomemos esto la próxima semana.", "ipa": "/greɪt. lɛts ˈsərkəl bæk ɔn ðɪs nɛkst wik./"}, {"id": "d_meeting_9", "s": "B", "en": "Sounds good.", "pr": "sáundz gúd.", "es": "Me parece bien.", "ipa": "/saʊnz gʊd./"}]}, {"id": "shopping", "title": "De compras", "icon": "🛍️", "level": "A2", "roles": ["Vendedora", "Cliente"], "lines": [{"id": "d_shopping_0", "s": "A", "en": "Hi! Are you finding everything okay?", "pr": "jái! ar yu fáindin évrithin oukéi?", "es": "¡Hola! ¿Encuentra todo bien?", "ipa": "/haɪ! ər ju ˈfaɪndɪŋ ˈɛvriˌθɪŋ ˌoʊˈkeɪ?/"}, {"id": "d_shopping_1", "s": "B", "en": "Actually, I'm looking for this jacket in a medium.", "pr": "ákchuali, aim lúkin fer dhis yáket in a mídiam.", "es": "De hecho, busco esta chaqueta en talla mediana.", "ipa": "/ˈæˌkʧuəli, əm ˈlʊkɪŋ fər ðɪs ˈʤækɪt ɪn ə ˈmidiəm./"}, {"id": "d_shopping_2", "s": "A", "en": "Let me check in the back for you.", "pr": "lémi chék in dha bák fer yu.", "es": "Déjeme revisar en la bodega.", "ipa": "/lɛt mi ʧɛk ɪn ðə bæk fər ju./"}, {"id": "d_shopping_3", "s": "B", "en": "Thanks. Also, is this on sale?", "pr": "thénks. ólsou, íz dhis on séil?", "es": "Gracias. Además, ¿esto está en oferta?", "ipa": "/θæŋks. ˈɔlsoʊ, ɪz ðɪs ɔn seɪl?/"}, {"id": "d_shopping_4", "s": "A", "en": "Yes, everything on this rack is thirty percent off.", "pr": "yés, évrithing on dhis rák iz thérdi persént óf.", "es": "Sí, todo en este perchero tiene treinta por ciento de descuento.", "ipa": "/jɛs, ˈɛvriˌθɪŋ ɔn ðɪs ræk ɪz ˈθərˌdi pərˈsɛnt ɔf./"}, {"id": "d_shopping_5", "s": "B", "en": "Nice! Can I try it on?", "pr": "náis! ken ai trái it ón?", "es": "¡Qué bien! ¿Me lo puedo probar?", "ipa": "/nis! kən aɪ traɪ ɪt ɔn?/"}, {"id": "d_shopping_6", "s": "A", "en": "Of course. The fitting rooms are right over there.", "pr": "av kórs. dha fírin rúumz ar ráit óuver dhér.", "es": "Claro. Los probadores están por allá.", "ipa": "/əv kɔrs. ðə ˈfɪtɪŋ rumz ər raɪt ˈoʊvər ðɛr./"}, {"id": "d_shopping_7", "s": "B", "en": "It fits perfectly. I'll take it.", "pr": "it fíts pérfektli. ail téik it.", "es": "Me queda perfecto. Me lo llevo.", "ipa": "/ɪt fɪts ˈpərfəktli. aɪl teɪk ɪt./"}, {"id": "d_shopping_8", "s": "A", "en": "Great choice. Would you like a bag?", "pr": "gréit chóis. uúd yu láik a bág?", "es": "Excelente elección. ¿Quiere una bolsa?", "ipa": "/greɪt ʧɔɪs. wʊd ju laɪk ə bæg?/"}, {"id": "d_shopping_9", "s": "B", "en": "No thanks, I brought my own.", "pr": "nóu thénks, ai brót mai óun.", "es": "No, gracias, traje la mía.", "ipa": "/noʊ θæŋks, aɪ brɔt maɪ oʊn./"}]}, {"id": "friends", "title": "Haciendo amigos", "icon": "🤝", "level": "A2", "roles": ["Alex", "Yonathan"], "lines": [{"id": "d_friends_0", "s": "A", "en": "Hey, I don't think we've met. I'm Alex.", "pr": "jéi, ai dóunt thínk uív mét. aim áleks.", "es": "Hola, creo que no nos conocemos. Soy Alex.", "ipa": "/heɪ, aɪ doʊnt θɪŋk wiv mɛt. əm ˈæləks./"}, {"id": "d_friends_1", "s": "B", "en": "Nice to meet you, Alex. I'm Yonathan.", "pr": "náis tu míit yu, áleks. aim yónathan.", "es": "Mucho gusto, Alex. Soy Yonathan.", "ipa": "/nis tɪ mit ju, ˈæləks. əm …./"}, {"id": "d_friends_2", "s": "A", "en": "So how do you know Sarah?", "pr": "sóu jáu díyu nóu séra?", "es": "¿Y de dónde conoces a Sarah?", "ipa": "/soʊ haʊ du ju noʊ ˈsɛrə?/"}, {"id": "d_friends_3", "s": "B", "en": "We work together. What about you?", "pr": "ui uérk tuguédher. uát abáut yu?", "es": "Trabajamos juntos. ¿Y tú?", "ipa": "/wi wərk təˈgɛðər. wət əˈbaʊt ju?/"}, {"id": "d_friends_4", "s": "A", "en": "We went to college together. So what do you do for fun?", "pr": "ui uént tu káley tuguédher. sóu uát díyu dú fer fán?", "es": "Fuimos juntos a la universidad. ¿Y qué haces para divertirte?", "ipa": "/wi wɛnt tɪ ˈkɑlɪʤ təˈgɛðər. soʊ wət du ju du fər fən?/"}, {"id": "d_friends_5", "s": "B", "en": "I'm really into soccer and hiking. How about you?", "pr": "aim ríli íntu sáker en jáikin. jáu abáut yu?", "es": "Me encanta el fútbol y el senderismo. ¿Y tú?", "ipa": "/əm ˈrɪli ˈɪntu ˈsɑkər ənd ˈhaɪkɪŋ. haʊ əˈbaʊt ju?/"}, {"id": "d_friends_6", "s": "A", "en": "No way, I love hiking too! We should go sometime.", "pr": "nóu uéi, ai láv jáikin túu! ui shud góu sámtaim.", "es": "¡No puede ser, a mí también me encanta el senderismo! Deberíamos ir algún día.", "ipa": "/noʊ weɪ, aɪ ləv ˈhaɪkɪŋ tu! wi ʃʊd goʊ ˈsəmˌtaɪm./"}, {"id": "d_friends_7", "s": "B", "en": "Definitely. Let's exchange numbers.", "pr": "défenitli. lets ekschéinch námberz.", "es": "Definitivamente. Intercambiemos números.", "ipa": "/ˈdɛfənətli. lɛts ɪksˈʧeɪnʤ ˈnəmbərz./"}, {"id": "d_friends_8", "s": "A", "en": "Sounds like a plan. I'll text you this week.", "pr": "sáundz láik a plán. ail tékst yu dhis uíik.", "es": "Trato hecho. Te escribo esta semana.", "ipa": "/saʊnz laɪk ə plæn. aɪl tɛkst ju ðɪs wik./"}, {"id": "d_friends_9", "s": "B", "en": "Awesome. Talk to you soon!", "pr": "ósam. tók tu yu súun!", "es": "Genial. ¡Hablamos pronto!", "ipa": "/ˈɔsəm. tɔk tɪ ju sun!/"}]}], "idioms": [{"id": "i_0", "en": "break the ice", "pr": "bréik dhi áis", "es": "romper el hielo", "ipa": "/breɪk ðə aɪs/", "ex": {"id": "ix_0", "en": "He told a joke to break the ice.", "pr": "ji tóuld a yóuk tu bréik dhi áis.", "es": "Ejemplo de: break the ice (romper el hielo)", "ipa": "/hi toʊld ə ʤoʊk tɪ breɪk ðə aɪs./"}}, {"id": "i_1", "en": "hit the road", "pr": "jít dha róud", "es": "irse, ponerse en camino", "ipa": "/hɪt ðə roʊd/", "ex": {"id": "ix_1", "en": "It's late, we should hit the road.", "pr": "its léit, ui shud jít dha róud.", "es": "Ejemplo de: hit the road (irse, ponerse en camino)", "ipa": "/ɪts leɪt, wi ʃʊd hɪt ðə roʊd./"}}, {"id": "i_2", "en": "piece of cake", "pr": "píisa kéik", "es": "pan comido, muy fácil", "ipa": "/pis əv keɪk/", "ex": {"id": "ix_2", "en": "The test was a piece of cake.", "pr": "dha tést uaz a píisa kéik.", "es": "Ejemplo de: piece of cake (pan comido, muy fácil)", "ipa": "/ðə tɛst wɑz ə pis əv keɪk./"}}, {"id": "i_3", "en": "under the weather", "pr": "ánder dha uédher", "es": "sentirse un poco enfermo", "ipa": "/ˈəndər ðə ˈwɛðər/", "ex": {"id": "ix_3", "en": "I'm feeling a little under the weather.", "pr": "aim fíilin a lírel ánder dha uédher.", "es": "Ejemplo de: under the weather (sentirse un poco enfermo)", "ipa": "/əm ˈfilɪŋ ə ˈlɪtəl ˈəndər ðə ˈwɛðər./"}}, {"id": "i_4", "en": "call it a day", "pr": "kólida déi", "es": "dar por terminado (el trabajo del día)", "ipa": "/kɔl ɪt ə deɪ/", "ex": {"id": "ix_4", "en": "We're tired. Let's call it a day.", "pr": "uír táierd. lets kólida déi.", "es": "Ejemplo de: call it a day (dar por terminado (el trabajo del día))", "ipa": "/wɪr taɪərd. lɛts kɔl ɪt ə deɪ./"}}, {"id": "i_5", "en": "hang out", "pr": "jáng áut", "es": "pasar el rato, salir", "ipa": "/hæŋ aʊt/", "ex": {"id": "ix_5", "en": "Do you want to hang out this weekend?", "pr": "du yu uána jáng áut dhis uíikend?", "es": "Ejemplo de: hang out (pasar el rato, salir)", "ipa": "/du ju wɔnt tɪ hæŋ aʊt ðɪs ˈwiˌkɪnd?/"}}, {"id": "i_6", "en": "figure out", "pr": "fíguier áut", "es": "averiguar, resolver, entender", "ipa": "/ˈfɪgjər aʊt/", "ex": {"id": "ix_6", "en": "I can't figure out this problem.", "pr": "ai ként fíguier áut dhis prábelem.", "es": "Ejemplo de: figure out (averiguar, resolver, entender)", "ipa": "/aɪ kænt ˈfɪgjər aʊt ðɪs ˈprɑbləm./"}}, {"id": "i_7", "en": "get the hang of it", "pr": "guét dha jáng av it", "es": "agarrarle la onda / el truco", "ipa": "/gɪt ðə hæŋ əv ɪt/", "ex": {"id": "ix_7", "en": "Don't worry, you'll get the hang of it.", "pr": "dóunt uéri, yul guét dha jáng av it.", "es": "Ejemplo de: get the hang of it (agarrarle la onda / el truco)", "ipa": "/doʊnt ˈwəri, jul gɪt ðə hæŋ əv ɪt./"}}, {"id": "i_8", "en": "no big deal", "pr": "nóu bíg díil", "es": "no es para tanto", "ipa": "/noʊ bɪg dil/", "ex": {"id": "ix_8", "en": "Don't worry, it's no big deal.", "pr": "dóunt uéri, its nóu bíg díil.", "es": "Ejemplo de: no big deal (no es para tanto)", "ipa": "/doʊnt ˈwəri, ɪts noʊ bɪg dil./"}}, {"id": "i_9", "en": "my bad", "pr": "mái bád", "es": "mi culpa (informal)", "ipa": "/maɪ bæd/", "ex": {"id": "ix_9", "en": "Oops, my bad. I'll fix it.", "pr": "úps, mái bád. ail fíks it.", "es": "Ejemplo de: my bad (mi culpa (informal))", "ipa": "/ups, maɪ bæd. aɪl fɪks ɪt./"}}, {"id": "i_10", "en": "I'm down", "pr": "aim dáun", "es": "me apunto", "ipa": "/əm daʊn/", "ex": {"id": "ix_10", "en": "Pizza tonight? I'm down.", "pr": "píitsa tunáit   r.onresult=e=>{if(!first)first=Date.now();last=Date.now();interim='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)finals.push(x[0].transcript.trim());else interim+=x[0].transcript}onUpdate&&onUpdate(txt())};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){on=false;micError(e.error)}};

/* ---------- Text normalization & scoring ---------- */
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n2w(n){n=+n;if(n<20)return NUM[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+NUM[n%10]:'');if(n<1000)return NUM[Math.floor(n/100)]+' hundred'+(n%100?' '+n2w(n%100):'');return String(n)}
const HOMO={two:'to',too:'to',four:'for',write:'right',their:'there',hear:'here',buy:'by',bye:'by',know:'no',sea:'see',meat:'meet',weak:'week',won:'one',eight:'ate',eye:'i',ok:'okay',hi:'hi',hey:'hi',yeah:'yes',yep:'yes',ya:'you',your:'your',youre:'your',wanna:'want',gonna:'going',gotta:'got',its:'it',whats:'what',thats:'that',blueberry:'blueberry',coworkers:'coworkers',alright:'all'};
const NAMES=new Set(['yonathan','alex','sarah','karen']);
function norm(s){s=String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/(\d+)%/g,'$1 percent').replace(/\$(\d+)\.(\d\d)/g,'$1 $2').replace(/(\d+):(\d\d)/g,'$1 $2')
 .replace(/\b(can)'t\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would').replace(/'s\b/g,' is')
 .replace(/\bcannot\b/g,'can not').replace(/\bgonna\b/g,'going to').replace(/\bwanna\b/g,'want to').replace(/\bgotta\b/g,'got to').replace(/\bkinda\b/g,'kind of').replace(/\bok\b/g,'okay').replace(/\be-?mail\b/g,'email')
 .replace(/\d+/g,m=>n2w(m)).replace(/[-–—]/g,' ').replace(/[^a-z' ]/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();return s?s.split(' '):[]}
function canon(w){return HOMO[w]||w}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array(n+1).fill(0).map((_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function wsim(a,b){if(canon(a)===canon(b))return 1;return 1-lev(a,b)/Math.max(a.length,b.length)}
/* word alignment: returns per-target status ok/mid/bad + extras */
function align(target,hyp){const T=target,H=hyp,m=T.length,n=H.length;const D=[...Array(m+1)].map(()=>Array(n+1).fill(0));const B=[...Array(m+1)].map(()=>Array(n+1).fill(''));
 for(let i=0;i<=m;i++){D[i][0]=i;B[i][0]='d'}for(let j=0;j<=n;j++){D[0][j]=j;B[0][j]='i'}
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const s=wsim(T[i-1],H[j-1]);const sc=s===1?0:(s>=0.6?0.6:1);const o=[[D[i-1][j-1]+sc,'s'],[D[i-1][j]+1,'d'],[D[i][j-1]+1,'i']].sort((a,b)=>a[0]-b[0])[0];D[i][j]=o[0];B[i][j]=o[1]}
 const st=Array(m).fill('bad'),heard=Array(m).fill('');let extra=[],i=m,j=n;
 while(i>0||j>0){const b=i>0&&j>0?B[i][j]:(i>0?'d':'i');if(b==='s'){const s=wsim(T[i-1],H[j-1]);st[i-1]=s===1||NAMES.has(T[i-1])?'ok':(s>=0.6?'mid':'bad');heard[i-1]=H[j-1];i--;j--}else if(b==='d'){st[i-1]=NAMES.has(T[i-1])?'ok':'bad';i--}else{extra.push(H[j-1]);j--}}
 return{st,heard,extra}}
function scoreAttempt(target,alts){const T=norm(target);let best=null;
 for(const a of (alts||[])){const H=norm(a.t);const al=align(T,H);const ok=al.st.filter(s=>s==='ok').length,mid=al.st.filter(s=>s==='mid').length;const acc=T.length?(ok+0.5*mid)/T.length:0;
  const conf=a.c>0?a.c:acc;let sc=Math.round(100*(0.85*acc+0.15*conf))-Math.min(12,al.extra.length*3);sc=Math.max(0,Math.min(100,sc));
  if(!best||sc>best.score)best={score:sc,acc,conf:a.c,T,H,heardText:a.t,...al}}
 return best||{score:0,acc:0,T,H:[],st:T.map(()=>'bad'),heard:[],extra:[],heardText:''}}

/* ---------- Spanish-speaker sound pitfalls ---------- */
const SOUNDS={
 th:{n:'TH (think / this)',tip:'Saca la punta de la lengua entre los dientes. "think" no es "tink" ni "sink"; "this" no es "dis". Sorda en think/thanks, vibrante en this/the/they.'},
 s:{n:'S + consonante (school, speak)',tip:'¡No agregues "e" al inicio! Di "sss-pík", no "es-pík". Truco: empieza alargando la s: "ssschool".'},
 v:{n:'V vs B (very / berry)',tip:'En inglés la V se hace con los dientes de arriba sobre el labio de abajo, y vibra. La B junta los dos labios. En español suenan igual; en inglés no.'},
 ed:{n:'Terminación -ED',tip:'-ed suena /t/ tras sonidos sordos (worked = uérkt), /d/ tras sonoros (played = pléid) y /ɪd/ solo tras t o d (wanted). Nunca digas "work-ed".'},
 final:{n:'Consonantes finales',tip:'El español casi no termina en consonantes como -st, -nd, -ks, -lt, -k, -d. Pronuncia la última: "last" no "las", "world" no "worl", "card" no "car".'},
 i:{n:'i corta vs ii larga (ship / sheep)',tip:'La i corta /ɪ/ (it, live, ship) es relajada, casi entre "i" y "e". La ii larga /iː/ (eat, leave, sheep) es tensa: sonríe y alárgala.'},
 sh:{n:'SH vs CH (she / chair)',tip:'SH es un soplido continuo ("shhh", como pedir silencio). CH es explosivo. No los mezcles: "share" ≠ "chair".'},
 z:{n:'Z / S sonora (is, was, rise)',tip:'Muchas "s" en inglés zumban como abeja /z/: is, was, easy, music, rise. Pon la mano en la garganta: debe vibrar.'},
 h:{n:'H inglesa (hello, house)',tip:'La H inglesa es solo aire suave, como empañar un vidrio. No es la "j" fuerte del español. Y nunca la omitas: "hear" ≠ "ear".'},
 r:{n:'R inglesa',tip:'La lengua no toca el paladar: se curva hacia atrás y los labios se redondean un poco. Nunca la hagas vibrar como "rr".'},
 schwa:{n:'Schwa /ə/ y acento',tip:'Las sílabas sin acento se reducen a un sonido neutro "uh" (about = əbáut, problem = prábləm). No pronuncies todas las vocales completas; marca fuerte la sílaba acentuada.'},
 dy:{n:'J / DG (job, just)',tip:'"job", "just", "change" llevan /dʒ/, como una "ch" con voz (dy). "yes", "yet" llevan una y suave. "jet" ≠ "yet".'},
 w:{n:'W (would, work)',tip:'Redondea los labios como para una "u" rápida y suéltalos: would = "uud", work = "uérk". No agregues "g" (no "güud").'},
 ae:{n:'Vocal æ (cat, thanks, bad)',tip:'Abre bastante la boca y estira los labios: es un sonido entre "a" y "e". "bad" no es "bed" ni "bod".'},
 u:{n:'u corta vs uu larga (full / fool)',tip:'La u corta /ʊ/ (full, good, book) es relajada y breve. La uu larga /uː/ (fool, food) es tensa y redondeada.'},
};
const EDX=new Set(['need','red','bed','feed','seed','speed','bleed','shed','fred','ted','wed','led','fled','sled','bred','breed','greed','weed','indeed','proceed','succeed','exceed','hundred']);
function soundsOf(w){const o=[];w=w.toLowerCase();
 if(/th/.test(w))o.push('th');if(/^s[ptkcmnlqw]/.test(w))o.push('s');if(/v/.test(w))o.push('v');
 if(/[a-z]{2}ed$/.test(w)&&!EDX.has(w))o.push('ed');
 if(/(st|nd|ld|lt|nt|ks|ts|ps|ft|kt|sk|rd|rk|rt|ct|pt)$|[^aeiouy]{0}[kdtpbg]$/.test(w)&&w.length>2)o.push('final');
 if(/ee|ea|ie(?!w)/.test(w)||/[^aeiou]i[bcdfgklmnpstvxz](?!e)/.test(w)&&!/igh/.test(w))o.push('i');
 if(/sh|ch|tion|tch/.test(w))o.push('sh');if(/[aeiou]s[aeiou]|z|^(is|was|has|his|as|does|these|those|because|always|easy|music|rise)$/.test(w))o.push('z');
 if(/^h|^wh(o|ole)/.test(w))o.push('h');if(/^j|dge|^ju|ge$/.test(w))o.push('dy');if(/^w|qu/.test(w)&&!/^wh?o/.test(w))o.push('w');
 if(/r/.test(w))o.push('r');if((w.match(/[aeiouy]+/g)||[]).length>=3)o.push('schwa');
 return o}
function recordSounds(T,st){for(let i=0;i<T.length;i++){for(const k of soundsOf(T[i])){const x=S.sounds[k]||(S.sounds[k]={att:0,fail:0});x.att++;if(st[i]!=='ok')x.fail++}}}

/* ---------- Feedback text ---------- */
const PRAISE=['¡Excelente! Así suena alguien fluido.','¡Perfecto! Tu pronunciación fue clarísima.','¡Brutal! Eso sonó muy natural.','¡Muy bien! Un nativo te entendería sin problema.'];
const GOOD=['Muy bien, vas fuerte. Pule los detalles en rojo.','Bien hecho. Casi perfecto: revisa las palabras marcadas.','¡Bien! Se entendió casi todo.'];
const MID=['Vas por buen camino, pero siendo honesto: varias palabras no se entendieron.','Regular. Se entendió la idea, pero hay que limpiar la pronunciación.'];
const LOW=['Siendo honesto: esto todavía no se entiende bien. Escúchalo en lento y repítelo por partes. Es normal al principio.','No salió esta vez, pero cada intento entrena tu boca. Escucha, imita el ritmo y vuelve a intentarlo.'];
const MOTIV=['Los errores son datos, no fracasos.','La fluidez es un hábito: 15 minutos diarios valen más que 2 horas el domingo.','Tu cerebro está creando nuevas rutas. Repite sin miedo.','Cada día que practicas, tu acento mejora un poco. Confía en el proceso.','Habla aunque te equivoques: así es como se aprende de verdad.','Hoy mejor que ayer. Mañana mejor que hoy.'];
function feedback(r){const bad=r.T.filter((w,i)=>r.st[i]!=='ok');let head=r.score>=90?pick(PRAISE):r.score>=75?pick(GOOD):r.score>=50?pick(MID):pick(LOW);
 const keys={};bad.forEach(w=>soundsOf(w).forEach(k=>keys[k]=(keys[k]||0)+1));
 const pr=['th','s','v','ed','final','i','sh','z','h','dy','w','ae','r','schwa'];const top=Object.keys(keys).sort((a,b)=>(keys[b]-keys[a])||(pr.indexOf(a)-pr.indexOf(b))).slice(0,2);
 let li=[];if(bad.length)li.push(`<li>Palabras a mejorar: <b>${bad.map(esc).join(', ')}</b></li>`);
 r.T.forEach((w,i)=>{if(r.st[i]==='mid'&&r.heard[i])li.push(`<li>Dijiste algo como <i>"${esc(r.heard[i])}"</i> en lugar de <b>"${esc(w)}"</b>.</li>`)});
 if(r.extra.length)li.push(`<li>Escuché palabras de más: <i>${r.extra.map(esc).join(', ')}</i></li>`);
 top.forEach(k=>li.push(`<li>🔧 <b>${SOUNDS[k].n}:</b> ${SOUNDS[k].tip}</li>`));
 if(r.score<75)li.push(`<li>💪 ${pick(MOTIV)}</li>`);
 const sy=r.score>=90?pick(SAYS.great):r.score>=75?pick(SAYS.ok):r.score>=50?pick(SAYS.almost)+' Repite las palabras en rojo.':'Escúchalo otra vez, más despacito, y repite.';
 return{head,html:`<b>${head}</b><ul>${li.join('')}</ul>`,say:sy,bad}}

function itemHTML(it,o={}){return `<div class="en">${esc(it.en)}</div><div class="pr">🗣️ ${it.pr?prHTML(it.pr):'<span class="mut small">(el subtítulo de pronunciación aparece tras tu primer intento)</span>'}</div>${it.ipa?`<div class="ipa ${S.settings.ipa?'':'hide'} ipaTog">${esc(it.ipa)}</div>`:''}<div class="es ${S.settings.es?'':'hide'} esTog">${esc(it.es||'')}</div>`}
function practiceCard(it,o={}){const id='c'+(++cardSeq);CARDS[id]={it,o};
 return `<div class="card pc ${o.cls||''}" id="${id}">${o.head||''}${o.hideText?`<div class="hidden-wrap"><div class="es">${esc(it.es)}</div><div class="mut small">🧠 Recuerdo activo: ¿cómo se dice en inglés? Dilo en voz alta y luego revisa.</div><div class="reveal hide">${itemHTML(it)}</div></div>`:itemHTML(it)}
 <div class="row"><button class="sm" data-act="play" data-id="${id}">🔊 Escuchar</button><button class="sm" data-act="slow" data-id="${id}">🐢 Lento</button><button class="mic sm" data-act="rec" data-id="${id}">🎤 ${o.hideText?'Decirlo':'Repetir'}</button>${o.hideText?`<button class="sm" data-act="reveal" data-id="${id}">👁️ Ver</button>`:''}${o.noSrs?'':`<button class="sm" data-act="srs" data-id="${id}" title="Añadir a repaso">＋ Repaso</button>`}<button class="sm" data-act="selfrec" data-id="${id}" title="Grábate y compárate con el modelo">⏺️ Grabarme</button>${S.best[it.id]!=null?`<span class="small mut">Mejor: ${S.best[it.id]}</span>`:''}</div>
 <div class="live small mut"></div><div class="res"></div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const c=CARDS[b.dataset.id];if(!c)return;const card=document.getElementById(b.dataset.id);const it=c.it;
 const a=b.dataset.act;
 if(a==='play')return speak(it.en,{pitch:c.o.pitch||1});
 if(a==='rec'&&LOOP){LOOP.stop=true;AZ.stop();stopAudio()}
 if(a==='slow')return speakSlow(it.en);
 if(a==='reveal'){card.querySelector('.reveal').classList.remove('hide');return}
 if(a==='srs'){srsAdd(it);b.textContent='✓ En repaso';b.disabled=true;return}
 if(a==='selfrec')return selfRecord(it,b);
 if(a==='rec'){if(REC.active){stopListening();return}b.dataset.busy='1';const r=await attempt(it,card,c.o);b.dataset.busy='';b.classList.remove('on');if(c.o.onDone)c.o.onDone(r)}});
function liveRender(target,txt){const r=scoreAttempt(target,[{t:txt,c:0}]);return r.T.map((w,i)=>{return `<span class="w ${r.st[i]==='ok'?'ok':(r.heard[i]?'mid':'')}">${esc(w)}</span>`}).join(' ')}
async function attempt(it,card,o={}){
 if(AZ.cfg()&&MIC.supported())return azAttempt(it,card,o);
 const res=card.querySelector('.res'),live=card.querySelector('.live');
 if(!SRC){res.classList.add('show');res.innerHTML=`<div class="fb">Tu navegador no tiene reconocimiento de voz. Pronúncialo en voz alta y califícate con honestidad:</div><div class="row">${[['😖 Mal',40],['😐 Regular',65],['🙂 Bien',82],['😎 Perfecto',95]].map(([l,s])=>`<button class="sm selfg" data-s="${s}">${l}</button>`).join('')}</div>`;
  return new Promise(r=>res.querySelectorAll('.selfg').forEach(bb=>bb.onclick=()=>{const sc=+bb.dataset.s;const rr={score:sc,T:norm(it.en),st:norm(it.en).map(()=>sc>=80?'ok':'bad'),heard:[],extra:[],self:true};record(it,rr,o);res.innerHTML=`<div class="score">${sc}</div><div class="fb">Autoevaluación guardada.</div>`;r(rr)}))}
 live.innerHTML='🎧 Escuchando… habla ahora';$('#liveHeard').innerHTML='🎧 Escuchando…';
 const out=await listenOnce((t,fin)=>{const h=liveRender(it.en,t);live.innerHTML='Oigo: <span class="words">'+h+'</span>';$('#liveHeard').innerHTML='<span class="words">'+h+'</span>'});
 if(!out||!out.alts.length){live.innerHTML=out&&out.err&&out.err!=='no-speech'?'':'No te escuché. Toca 🎤 e intenta de nuevo.';$('#liveHeard').textContent='';return null}
 const r=scoreAttempt(it.en,out.alts);const f=feedback(r);
 const col=r.score>=90?'var(--ok)':r.score>=75?'#84cc16':r.score>=50?'var(--mid)':'var(--bad)';
 live.innerHTML='';res.classList.add('show');
 res.innerHTML=`<div class="row"><span class="score" style="color:${col}">${r.score}</span><span class="small mut">/100 · precisión de palabras ${Math.round(r.acc*100)}%${r.conf>0?` · confianza ${Math.round(r.conf*100)}%`:''}</span></div>
 <div class="words">${r.T.map((w,i)=>`<span class="w ${r.st[i]}" title="${r.heard[i]?'oí: '+esc(r.heard[i]):'no se oyó'}">${esc(w)}</span>`).join('')}${r.extra.map(w=>`<span class="w extra">${esc(w)}</span>`).join('')}</div>
 <div class="small mut">Entendí: "${esc(r.heardText)}"</div><div class="fb">${f.html}</div>
 ${f.bad.length?`<div class="row">${f.bad.slice(0,4).map(w=>`<button class="sm" onclick="speakSlow('${esc(w).replace(/'/g,'')}')">🔊 ${esc(w)}</button>`).join('')}</div>`:''}`;
 $('#liveHeard').innerHTML=`<span class="words">${r.T.map((w,i)=>`<span class="w ${r.st[i]}">${esc(w)}</span>`).join('')}</span>`;
 record(it,r,o);
 const m=r.score>=85?'happy':r.score<55?'concern':null;
 $('#bubbleText').innerHTML=`<b>${r.score}/100.</b> ${esc(f.head)}`;if(m)mood(m);
 if(!o.quiet){if(S.settings.coachEs)await speak(f.say,{lang:'es'});if(f.bad.length&&r.score<90)await speakSlow(f.bad.slice(0,2).join(', '))}
 return r}
function record(it,r,o={}){sessAdd(it,r.score);const t=today();t.att++;t.sum+=r.score;if(o.kind==='line')t.lines++;
 S.best[it.id]=Math.max(S.best[it.id]||0,r.score);if(r.score>=85)S.mastered[it.id]=1;
 S.hist=S.hist||[];S.hist.push([Date.now(),r.score]);if(S.hist.length>2000)S.hist.splice(0,500);
 if(!r.self)recordSounds(r.T,r.st);
 if(r.score<80&&!o.noAutoSrs)srsAdd(it,true);
 addXP(2+(r.score>=90?8:r.score>=80?5:0));save()}

/* ---------- Current practice session (for the recap) ---------- */
const SESSION={t0:Date.now(),items:{},phon:{},cors:[],xp0:null,done:false};
function sessAdd(it,score){if(!it||!it.en)return;const x=SESSION.items[it.en]||(SESSION.items[it.en]={en:it.en,es:it.es||'',best:0,n:0});x.n++;x.best=Math.max(x.best,score||0);SESSION.done=false;if(SESSION.xp0==null)SESSION.xp0=S.xp}
/* ---------- Self recording (MediaRecorder) ---------- */
async function selfRecord(it,btn){if(!navigator.mediaDevices||!window.MediaRecorder){coachSay('Tu navegador no permite grabar audio aquí.');return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);const ch=[];mr.ondataavailable=e=>ch.push(e.data);
  btn.textContent='⏹️ Grabando…';btn.disabled=true;mr.start();const secs=Math.min(12,Math.max(3,it.en.split(' ').length*0.6+2));await sleep(secs*1000);mr.stop();
  await new Promise(r=>mr.onstop=r);st.getTracks().forEach(t=>t.stop());const url=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}));
  btn.textContent='⏺️ Grabarme';btn.disabled=false;await coachSay('Escucha: primero tú, luego el modelo. ¿Notas la diferencia en ritmo y sonidos?');
  const au=new Audio(url);await new Promise(r=>{au.onended=r;au.onerror=r;au.play().catch(r)});await sleep(300);await speak(it.en)}
 catch(e){btn.textContent='⏺️ Grabarme';btn.disabled=false;micError('not-allowed')}}

/* ---------- Spaced repetition (SM-2) ---------- */
function srsAdd(it,auto){if(S.srs[it.id])return;S.srs[it.id]={id:it.id,en:it.en,pr:it.pr,es:it.es,ipa:it.ipa||'',ef:2.5,n:0,int:0,due:Date.now()+(auto?10*60000:0),lapses:0};save();updateHeader()}
function srsDue(){const now=Date.now();return Object.values(S.srs).filter(x=>x.due<=now).sort((a,b)=>a.due-b.due)}
function srsGrade(id,score){const x=S.srs[id];if(!x)return;const q=score>=92?5:score>=82?4:score>=68?3:score>=50?2:1;
 if(q<3){x.n=0;x.int=0;x.lapses++;x.due=Date.now()+10*60000}else{x.n++;x.int=x.n===1?1:x.n===2?3:Math.round(x.int*x.ef);x.due=Date.now()+x.int*DAY}
 x.ef=Math.max(1.3,x.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));today().rev++;save();updateHeader();return x}

/* ---------- Free speech analysis ---------- */
const FILLERS=['um','uh','er','ah','like','you know','i mean','kind of','sort of','basically','actually','so yeah'];
const GRAMMAR=[
 [/\bi have (\w+ )?years( old)?\b/,'Para la edad: "I am 30 (years old)", no "I have 30 years".'],
 [/\b(he|she|it) (have|do|go|want|like|need|work|live|say|know|think)\b/,'Tercera persona: he/she/it + verbo con -s ("she works", "he has", "it goes").'],
 [/\b(he|she|it) do not\b/,'Con he/she/it usa "doesn\'t": "she doesn\'t like…".'],
 [/\bi am agree\b/,'Se dice "I agree", no "I am agree".'],
 [/\bexplain me\b/,'Se dice "explain it to me" o "can you explain…", no "explain me".'],
 [/\bdepends? of\b/,'Se dice "depend on", no "depend of".'],
 [/\bmore (better|worse|easier|bigger|faster|cheaper)\b/,'No uses "more" con comparativos: "better", no "more better".'],
 [/\bpeople is\b|\bpeoples\b/,'"People" ya es plural: "people are".'],
 [/\bthe (life|nature|society|love|money) is\b/,'Para hablar en general no uses "the": "life is…", "money is…".'],
 [/\bmake (a party|homework|my homework|a photo|a picture|a question)\b/,'Collocations: "have a party", "do homework", "take a photo", "ask a question".'],
 [/\bi have (hungry|thirsty|cold|hot|fear|sleep)\b/,'Se usa "be": "I\'m hungry / thirsty / cold / scared / sleepy".'],
 [/\bsince (one|two|three|four|five|six|seven|eight|nine|ten|a) (year|years|month|months|week|weeks|day|days)\b/,'Para duración usa "for": "for five years". "Since" es para un punto de inicio: "since 2020".'],
 [/\bdid (not )?(went|saw|ate|came|had|made|took|got|was|did|bought|said)\b/,'Después de "did" el verbo va en forma base: "did you go?", no "did you went?".'],
 [/\bwhen i will\b/,'Después de "when" para el futuro se usa presente: "when I get there", no "when I will get".'],
 [/\bsay me\b/,'Se dice "tell me", no "say me".'],
 [/\blisten (music|the radio|the song)\b/,'Se dice "listen TO music".'],
 [/\barrive to\b/,'Se dice "arrive at" (lugar) o "arrive in" (ciudad), no "arrive to".'],
 [/\bmarried with\b/,'Se dice "married to".'],
 [/\bdiscuss about\b/,'"Discuss" no lleva "about": "discuss the plan".'],
 [/\bis very (\w+) for me\b/,'Más natural: "It\'s really hard for me" / "I find it…"'],
 [/\bi am (\w+ing) since\b/,'Con "since/for" usa presente perfecto: "I have been working since…".'],
 [/\bassist (to|the) (class|meeting|school)\b/,'Falso amigo: "attend a class/meeting" (asistir), "assist" es ayudar.'],
 [/\bactually\b/,'Ojo: "actually" significa "en realidad", no "actualmente" (= currently / nowadays).'],
];
function analyzeSpeech(text,ms){const raw=' '+text.toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ')+' ';const W=norm(text);const n=W.length;
 const min=Math.max(ms||0,1000)/60000;const wpm=n?Math.min(220,Math.round(n/min)):0;let fill=0;const fl={};FILLERS.forEach(f=>{const m=raw.split(' '+f+' ').length-1;if(m){fill+=m;fl[f]=m}});
 const uniq=new Set(W).size;const ttr=n?uniq/n:0;const gram=GRAMMAR.filter(([re])=>re.test(raw)).map(g=>g[1]);
 const chunks=DATA.idioms.filter(x=>raw.includes(' '+x.en.toLowerCase().replace(/[^a-z' ]/g,'')+' ')).map(x=>x.en);
 let sc=0;sc+=Math.min(wpm,140)/140*35;sc+=Math.min(n,70)/70*30;sc+=Math.min(1,ttr/0.6)*15;sc+=Math.min(10,chunks.length*5);sc+=10;sc-=Math.min(15,fill*2);sc-=Math.min(15,gram.filter(g=>!/actually/.test(g)).length*5);if(n<5)sc=Math.min(sc,15);sc=Math.max(0,Math.min(100,Math.round(sc)));
 const fb=[];
 if(n<15)fb.push('📏 Respuesta muy corta. Intenta hablar al menos 30–40 segundos: da una razón y un ejemplo.');else if(n<40)fb.push('📏 Buena base. Para sonar fluido, extiende: "because…", "for example…", "the thing is…".');else fb.push('📏 ¡Buena extensión! Hablaste bastante.');
 if(wpm&&wpm<80)fb.push(`🐢 Velocidad: ${wpm} palabras/min. Es lento (un nativo conversa a ~120–160). No traduzcas palabra por palabra: usa frases hechas y la técnica 4/3/2.`);else if(wpm<110)fb.push(`🚶 Velocidad: ${wpm} palabras/min. Aceptable; apunta a 110+ uniendo palabras ("gonna", "wanna", "lemme").`);else fb.push(`🚀 Velocidad: ${wpm} palabras/min. ¡Ritmo natural!`);
 if(fill>2)fb.push(`🤐 Muletillas: ${Object.entries(fl).map(([k,v])=>`"${k}"×${v}`).join(', ')}. Mejor haz pausas cortas en silencio o usa "Let me think…".`);
 if(ttr<0.45&&n>25)fb.push('🔁 Repites mucho las mismas palabras. Prueba sinónimos: good → great / awesome / pretty nice.');
 gram.forEach(g=>fb.push('✏️ '+g));
 if(chunks.length)fb.push(`⭐ ¡Usaste expresiones naturales: ${chunks.join(', ')}!`);else fb.push('💡 Intenta meter un modismo de la sección Modismos (ej: "to be honest", "kind of", "I\'m down").');
 return{n,wpm,fill,ttr,gram,chunks,score:sc,fb}}

/* r = respelling token (estilo español), ex = ejemplos, es = parecido en español, how = boca/lengua, err = error típico de hispanohablantes */
const PH={
 'i':{r:'ii',ex:'see, eat, sheep',es:'una "i" larga y tensa',how:'Sonríe estirando los labios, lengua alta y adelante. Alárgala un poco: "siii".',err:'Si la haces corta suena como /ɪ/: "sheep" se oye "ship", "leave" se oye "live".',pair:['sheep','ship']},
 'ɪ':{r:'i',ex:'sit, it, ship',es:'entre "i" y "e", corta y relajada',how:'Boca relajada, casi sin sonreír; lengua un poco más baja que en "i". Muy corta.',err:'Los hispanohablantes la hacen "i" española tensa: "ship" suena "sheep", "live" suena "leave".',pair:['ship','sheep']},
 'eɪ':{r:'ei',ex:'say, day, late',es:'como "ei" de "rey"',how:'Empieza en "e" y desliza la lengua hacia "i" dentro de la misma vocal.',err:'Hacerla "e" pura: "late" suena "let".',pair:['late','let']},
 'ɛ':{r:'e',ex:'bed, red, said',es:'como la "e" de "perro", un poco más abierta',how:'Boca medio abierta, lengua al medio. Corta.',err:'Confundirla con /æ/ o con /eɪ/: "bed" vs "bad", "pen" vs "pain".',pair:['bed','bad']},
 'æ':{r:'æ',ex:'cat, bad, thanks',es:'no existe en español: entre "a" y "e"',how:'Abre bastante la boca (como para "a") pero estira los labios y empuja la lengua hacia adelante como para "e".',err:'Decir una "a" española: "bad" suena "bod"; o una "e": "bad" suena "bed".',pair:['bad','bed']},
 'ɑ':{r:'a',ex:'hot, father, stop',es:'una "a" muy abierta y atrás',how:'Abre mucho la boca, lengua baja y relajada, como cuando el doctor dice "di aaa".',err:'Leer la letra "o" como "o" española: "hot" suena "jot" con o; en inglés americano es "jat".',pair:['hot','hat']},
 'ɔ':{r:'o',ex:'thought, law, talk',es:'una "o" abierta',how:'Labios un poco redondeados, boca abierta. (Muchos estadounidenses la dicen casi como /ɑ/.)',err:'Cerrarla demasiado como "ou": "law" suena "low".',pair:['caught','coat']},
 'ʊ':{r:'u',ex:'book, good, full',es:'una "u" corta y relajada',how:'Labios apenas redondeados, lengua relajada; muy corta, casi como una "u" floja.',err:'Hacerla "u" larga española: "full" suena "fool", "look" suena "luke".',pair:['full','fool']},

 'u':{r:'uu',ex:'food, you, blue',es:'una "u" larga y tensa',how:'Labios muy redondeados y adelantados, lengua alta atrás; alárgala: "fuuud".',err:'Hacerla corta o abrirla: "pool" suena "pull".',pair:['fool','full']},
 'ʌ':{r:'a',ex:'cup, love, but',es:'una "a" corta y relajada, como un "ah" de sorpresa',how:'Boca medio abierta y relajada, lengua en el centro. Muy breve.',err:'Leer la letra: "love" como "lov", "cup" como "cop", "but" como "bot".',pair:['cup','cop']},
 'aɪ':{r:'ai',ex:'my, time, I',es:'como "ai" de "aire"',how:'Empieza en "a" y desliza hacia "i".',err:'Leer la "i" escrita como "i": "time" suena "tim".',pair:['time','Tim']},
 'aʊ':{r:'au',ex:'now, house, out',es:'como "au" de "auto"',how:'Empieza en "a" y redondea los labios hacia "u".',err:'Pronunciar "ou" como "o" o "u": "house" suena "jous".',pair:['now','no']},
 'ɔɪ':{r:'oi',ex:'boy, choice, enjoy',es:'como "oi" de "hoy"',how:'Empieza en "o" abierta y desliza hacia "i".',err:'Suele salir bien; cuida no partirla en dos sílabas.',pair:['boy','buy']},
 'ju':{r:'iu',ex:'you, use, music',es:'como "iu" de "ciudad"',how:'Una "y" rápida seguida de "u" larga.',err:'Omitir la "y": "music" suena "músic", "use" suena "us".',pair:['use','ooze']},
 'ə':{r:'a',ex:'about, banana, the',es:'vocal neutra "uh", muy débil',how:'Boca relajada, sin fuerza; es la vocal de las sílabas SIN acento. Casi se traga.',err:'Pronunciar todas las vocales completas: "banana" como "ba-na-na" en vez de "bə-NÆ-nə". Le quita ritmo inglés.',pair:null},

 'aɪɹ':{r:'air',ex:'fire, hire, tired',es:'"ai" + r inglesa',how:'"ai" y luego la r curvada.',err:'r vibrante; partirlo en 3 sílabas.',pair:['fire','far']},

 'j':{r:'y',ex:'yes, you, year',es:'una "i" rápida, suave (no "ll" fuerte)',how:'La lengua se acerca al paladar sin tocarlo, muy suave.',err:'Hacerla fuerte como "ll/ye" rioplatense o como /dʒ/: "yes" suena "jes"; "year" suena "ear" si la omites.',pair:['yet','jet']},

  if(/response_format|json/i.test(t)){delete b2.response_format;retry=true}if(/reasoning/i.test(t)){delete b2.reasoning_effort;retry=true}if(/max_tokens/i.test(t)&&b2.max_tokens){delete b2.max_tokens;b2.max_completion_tokens=maxTokens;retry=true}if(/temperature/i.test(t)){delete b2.temperature;retry=true}

 'ɔ':['law','es una o abierta, con la boca bastante abierta'],

 'f':['fine','es una f normal, con los dientes de arriba tocando el labio de abajo'],

 s=s.replace(/\b([A-ZÁÉÍÓÚÑ]{2,})\b/g,(m)=>m==='OK'||m==='TV'?m:m.toLowerCase());

 s=s.replace(/\s+([,.;:!?])/g,'$1').replace(/([,;:])\s*(?=[,;:.!?])/g,'').replace(/,{2,}/g,',').replace(/^[\s,.;:]+/,'').replace(/\s+/g,' ').trim();

/* split Spanish speech so that quoted English words/phrases are read by the English voice */
function ttsSegments(t,lang='es'){const s=ttsClean(t,lang);if(lang!=='es')return s?[{lang:'en',text:s.replace(/["“”«»]/g,'')}]:[];
 const out=[];const re=/["“”]([^"“”]{1,80})["“”]/g;let last=0,m;
 const isEn=x=>(x==='I'||x.length>=2&&/[aeiouy]/i.test(x)&&!x.split(/[\s,.!?]+/).some(w=>ES_ONLY.has(w.toLowerCase())))&&/^[A-Za-z][A-Za-z' ,.!?\-]*$/.test(x)&&!x.split(/\s+/).every(w=>ES_WORDS.has(w.toLowerCase()))&&(x==='I'||!/^(?:[aeiou]|sh+|a+|s+i+)$/i.test(x.trim()));
 while((m=re.exec(s))){const pre=s.slice(last,m.index);if(isEn(m[1].trim())){if(pre.trim())out.push({lang:'es',text:pre.trim()});out.push({lang:'en',text:m[1].trim()})}else{out.push({lang:'es',text:(pre+m[1]).trim()})}last=re.lastIndex}
 const rest=s.slice(last).trim();if(rest)out.push({lang:'es',text:rest});
 const merged=[];for(const x of out){x.text=x.text.replace(/["“”«»]/g,'').trim();if(!x.text||/^[,.;:!?\s]+$/.test(x.text))continue;const p=merged[merged.length-1];if(p&&p.lang===x.lang)p.text+=' '+x.text;else merged.push(x)}
 return merged}

{id:'be',lvl:'A1',t:'Verbo "to be" (ser / estar)',sum:'El verbo to be significa ser o estar. Se dice I am, you are, he is, she is, it is, we are, they are. En inglés siempre necesitas el sujeto: no se dice is good, se dice it is good.',

{id:'pron',lvl:'A1',t:'Pronombres (I/me/my/mine)',sum:'Hay pronombres de sujeto: I, you, he, she, it, we, they. De objeto, después del verbo: me, you, him, her, it, us, them. Y posesivos: my, your, his, her, our, their.',

{id:'art',lvl:'A1',t:'Artículos a / an / the',sum:'A y an significan un o una. Usa a antes de sonido de consonante y an antes de sonido de vocal. The es el o la, para algo específico. Para hablar en general no uses the: life is beautiful.',

{id:'spron',lvl:'A1',t:'Pronunciación de la -s final (/s/, /z/, /ɪz/)',sum:'La s final de plurales y de la tercera persona tiene tres sonidos. Suena s después de sonidos sordos como p, t, k, f: works, cats. Suena z, como abeja, después de sonidos con voz y vocales: plays, dogs. Y suena iz después de s, z, sh, ch, y dy: watches, buses.',
 pts:['<b>/s/</b> tras p, t, k, f, θ: works (uérks), cats (kæts), stops.','<b>/z/</b> (zumbido) tras vocales y sonidos sonoros b, d, g, l, m, n, r, v: plays (pléiz), dogs (dogz), lives (livz).','<b>/ɪz/</b> (una sílaba más) tras s, z, sh, ch, dʒ: watches (uáchiz), buses (básiz), changes (chéindyiz).','Lo mismo para posesivos: Tom\'s (tamz), Mike\'s (máiks).'],

{id:'cont',lvl:'A1',t:'Presente continuo (estoy haciendo)',sum:'El presente continuo es para lo que pasa ahora mismo o planes cercanos. Se forma con am, is o are más el verbo con ing: I am working, she is eating. La terminación ing se dice como "ing" con la n por la nariz, sin pronunciar una g fuerte.',

{id:'qn',lvl:'A2',t:'Preguntas y negativos',sum:'Para preguntar en inglés casi siempre necesitas un auxiliar antes del sujeto: do, does, did, is, are, can, will. Por ejemplo: Where do you live? Para negar, el not va con el auxiliar: I don\'t know, she can\'t come.',

{id:'ptime',lvl:'A1',t:'Preposiciones de tiempo: in / on / at',sum:'Para el tiempo: at es para horas exactas, at seven. On es para días y fechas, on Monday. In es para meses, años, estaciones y partes del día: in July, in the morning. Pero se dice at night.',

{id:'pplace',lvl:'A1',t:'Preposiciones de lugar: in / on / at',sum:'Para lugares: in es dentro de algo, in the car, in Mexico. On es sobre una superficie, on the table, y también on the bus. At es un punto o lugar específico: at home, at work, at the door.',

{id:'past',lvl:'A2',t:'Pasado simple · -ed y did / didn\'t',sum:'El pasado simple es para acciones terminadas: yesterday I worked. Los verbos regulares terminan en ed. Para preguntar usa did, did you work?, y para negar didn\'t, I didn\'t work. Después de did y didn\'t el verbo vuelve a su forma base.',

{id:'edpron',lvl:'A2',t:'Pronunciación de -ed (/t/, /d/, /ɪd/)',sum:'La terminación ed casi nunca se dice "ed". Suena t después de sonidos sordos: worked se dice uérkt. Suena d después de sonidos con voz: played se dice pléid. Y solo suena id después de t o d: wanted, needed.',

{id:'pcont',lvl:'A2',t:'Pasado continuo (estaba haciendo)',sum:'El pasado continuo describe algo que estaba pasando en un momento del pasado. Se forma con was o were más el verbo con ing: I was sleeping. Muchas veces se interrumpe con un pasado simple: I was sleeping when you called.',

 quiz:[['I ___ dinner when he arrived.',['cooked','was cooking','am cooking'],1,'Acción en progreso interrumpida: was cooking.'],['They ___ playing.',['was','were','are'],1,'They + were.']]},
{id:'irreg',lvl:'A2',t:'Los 80 verbos irregulares más comunes',sum:'Los verbos más usados del inglés son irregulares: go, went, gone. Apréndelos en grupos de cinco, en voz alta y con su pronunciación. Abajo tienes la tabla completa con audio.',
 pts:['Columna 1 = base (presente), 2 = pasado simple, 3 = participio (para have + participio).','Apréndelos por grupos que suenan parecido: sing-sang-sung, ring-rang-rung, drink-drank-drunk.','Toca 🔊 en cada fila y repite los tres en voz alta.'],
 ex:[['I went to the store.','ai uént tu dha stor.','Fui a la tienda.'],['She told me the truth.','shi tóuld mi dha truuth.','Ella me dijo la verdad.'],['We bought a new car.','uí bot a nuu kar.','Compramos un carro nuevo.'],['I have seen that movie.','ai jæv síin dhat múuvi.','He visto esa película.'],['He forgot my name.','ji forgát mai néim.','Él olvidó mi nombre.']],
 quiz:[['Past of "buy":',['buyed','bought','brought'],1,'buy → bought → bought (bot).'],['Past of "think":',['thinked','thought','taught'],1,'think → thought (thot).'],['Participle of "go":',['went','gone','goed'],1,'go → went → gone.']]},
{id:'fut',lvl:'A2',t:'Futuro: will y going to',sum:'Para el futuro tienes dos formas. Going to es para planes que ya decidiste: I\'m going to travel. Will es para decisiones en el momento, promesas y predicciones: I\'ll help you. Al hablar rápido, going to suena "góna".',
 pts:['<b>going to</b> = plan/intención: "I\'m <b>going to</b> study tonight" (hablado: "gonna" = góna).','<b>will</b> = decisión al momento, promesa, oferta: "I\'<b>ll</b> call you", "I <b>won\'t</b> (uóunt) tell anyone".','Predicción con evidencia → going to: "Look at the clouds! It\'s going to rain".','Después de will: verbo base: ❌ "I will to go" → ✅ "I will go".','Con when/if usa presente: ✅ "When I <b>get</b> home, I\'ll call you" (no "when I will get").'],
 ex:[['I\'m going to travel next month.','aim góuing tu trável nekst manth.','Voy a viajar el próximo mes.'],['I\'ll help you.','ail jelp yu.','Te ayudo.'],['It\'s going to rain.','its góna réin.','Va a llover.'],['I won\'t forget.','ai uóunt forgét.','No lo olvidaré.'],['When I get home, I\'ll call you.','uén ai guet jóum, ail kol yu.','Cuando llegue a casa, te llamo.']],
 quiz:[['The phone is ringing. — I ___ get it!',['\'ll','am going to','will to'],0,'Decisión al momento: I\'ll.'],['When I ___ there, I\'ll text you.',['will get','get','got'],1,'Después de when va presente.'],['I ___ visit my mom this weekend (ya lo planeé).',['will','am going to','going'],1,'Plan decidido: going to.']]},
{id:'comp',lvl:'A2',t:'Comparativos y superlativos',sum:'Para comparar: palabras cortas llevan er y than, bigger than. Palabras largas usan more, more expensive than. Para el máximo: the biggest, the most expensive. Irregulares: good, better, the best. Bad, worse, the worst.',
 pts:['Cortas: tall → <b>taller than</b> → <b>the tallest</b>; big → bigger (dobla la consonante).','Terminadas en -y: easy → <b>easier</b> → the easiest.','Largas: <b>more</b> interesting <b>than</b> → <b>the most</b> interesting.','Irregulares: good → <b>better</b> → <b>the best</b>; bad → <b>worse</b> (uérs) → <b>the worst</b>; far → farther.','❌ "more better" → ✅ "better". Igualdad: "as tall <b>as</b>".','than se dice "dhan" (débil: "dhen").'],
 ex:[['My brother is taller than me.','mai bráder iz tóler dhan mi.','Mi hermano es más alto que yo.'],['This is the best pizza in town.','dhis iz dha best píitsa in táun.','Esta es la mejor pizza del pueblo.'],['English is easier than I thought.','ínglish iz íizier dhan ai thot.','El inglés es más fácil de lo que pensaba.'],['It\'s more expensive than before.','its mor ikspénsiv dhan bifór.','Es más caro que antes.'],['Today is worse than yesterday.','tudéi iz uérs dhan iésterdei.','Hoy está peor que ayer.']],
 quiz:[['This car is ___ than mine.',['more fast','faster','fastest'],1,'Palabra corta: faster than.'],['She is the ___ student.',['better','best','most good'],1,'Superlativo de good: the best.'],['It\'s ___ than I expected.',['more better','better','gooder'],1,'Nunca "more better".']]},
{id:'modal',lvl:'B1',t:'Modales: can, could, should, must, would, might',sum:'Los modales cambian el sentido del verbo. Can es poder, could es podría o pude, should es debería, must es deber obligatorio, would es el condicional o para pedir con cortesía, y might es quizás. Después de un modal el verbo va en forma base, sin to y sin s.',
 pts:['<b>can</b> (kæn) = poder/saber · <b>can\'t</b> (kænt) = no poder.','<b>could</b> (kud, la l es muda) = podría / pude / petición cortés: "Could you help me?"','<b>should</b> (shud) = debería (consejo): "You should rest".','<b>must</b> = obligación fuerte o deducción: "You must wear a seatbelt".','<b>would</b> (uud) = -ría: "I would like…" = "I\'d like…" (me gustaría).','<b>might</b> (máit) = quizás: "It might rain".','Reglas: modal + base. ❌ "She cans", "I must to go" → ✅ "She can", "I must go".'],
 ex:[['Can you speak slowly?','kæn yu spíik slóuli?','¿Puedes hablar despacio?'],['Could you help me, please?','kud yu jelp mi, plíiz?','¿Podrías ayudarme, por favor?'],['You should drink more water.','yu shud drink mor uóter.','Deberías tomar más agua.'],['I\'d like a coffee, please.','aid láik a kófi, plíiz.','Me gustaría un café, por favor.'],['It might rain later.','it máit réin léiter.','Quizás llueva más tarde.'],['You must wear a seatbelt.','yu mast uér a síitbelt.','Debes usar el cinturón.']],
 quiz:[['You ___ see a doctor (consejo).',['should','might','can'],0,'Consejo = should.'],['She ___ swim very well.',['cans','can','can to'],1,'Modal sin -s y sin to.'],['___ you open the window, please?',['Must','Could','Should'],1,'Petición cortés: Could you…?']]},
{id:'pperf',lvl:'B1',t:'Presente perfecto (have + participio)',sum:'El presente perfecto conecta el pasado con el presente. Se forma con have o has más el participio: I have lived here for five years. Se usa para experiencias, con ever y never, y con for y since. Si dices cuándo pasó, como yesterday, usa pasado simple.',
 pts:['have/has + participio: I <b>have worked</b>, she <b>has been</b>, they <b>have seen</b>.','Experiencias: "<b>Have you ever been</b> to New York?" "I\'ve <b>never</b> tried sushi".','Duración hasta hoy: <b>for</b> + tiempo (for five years) · <b>since</b> + punto de inicio (since 2020).','❌ "I live here since 2020" → ✅ "I <b>have lived</b> here since 2020".','Con tiempo terminado usa pasado: ❌ "I have seen him yesterday" → ✅ "I saw him yesterday".','just / already / yet: "I\'ve <b>just</b> arrived", "Have you finished <b>yet</b>?"'],
 ex:[['I have lived here for five years.','ai jæv livd jíer for fáiv yíerz.','Vivo aquí desde hace cinco años.'],['Have you ever been to New York?','jæv yu éver bin tu nuu york?','¿Alguna vez has estado en Nueva York?'],['She has never tried sushi.','shi jæz néver tráid súushi.','Ella nunca ha probado el sushi.'],['I\'ve just finished.','aiv dyast fínisht.','Acabo de terminar.'],['We have known each other since 2015.','uí jæv nóun íich ádher sins tuénti fiftíin.','Nos conocemos desde 2015.']],
 quiz:[['I ___ here since 2019.',['live','have lived','lived'],1,'Desde un punto hasta hoy: have lived.'],['She has worked here ___ ten years.',['since','for','from'],1,'Duración: for.'],['I ___ him yesterday.',['have seen','saw','seen'],1,'Tiempo terminado (yesterday): pasado simple.']]},
{id:'prep2',lvl:'B1',t:'Preposiciones: to / for, of / from, by / with, about',sum:'Algunas preposiciones confunden mucho. To indica dirección o destino, go to work. For es para, o durante un tiempo, for two hours. Of es de, como parte o pertenencia, a cup of coffee. From es de origen, I\'m from Mexico. By es por o junto a, by car. With es con. About es sobre o acerca de.',
 pts:['<b>to</b> = a/hacia (destino): go <b>to</b> work, talk <b>to</b> me. <b>for</b> = para/por (propósito, beneficiario, duración): a gift <b>for</b> you, <b>for</b> two hours.','❌ "I came here for study" → ✅ "I came here <b>to</b> study" (para + verbo = <b>to</b>).','<b>of</b> = de (parte, contenido): a cup <b>of</b> coffee, the end <b>of</b> the movie. <b>from</b> = de (origen, desde): I\'m <b>from</b> Mexico, <b>from</b> 9 <b>to</b> 5.','<b>by</b> = en (medio de transporte), por (autor), junto a, para (fecha límite): <b>by</b> car, <b>by</b> Friday, a book <b>by</b> Coelho. <b>with</b> = con: <b>with</b> my friends.','<b>about</b> = sobre/acerca de: talk <b>about</b>, think <b>about</b>, a movie <b>about</b> love.'],
 ex:[['I came here to study.','ai kéim jíer tu stádi.','Vine aquí a estudiar.'],['This gift is for you.','dhis guift iz for yu.','Este regalo es para ti.'],['I\'m from Mexico.','aim from méksikou.','Soy de México.'],['I go to work by car.','ai góu tu uérk bai kar.','Voy al trabajo en carro.'],['Let\'s talk about it.','lets tok abáut it.','Hablemos de eso.'],['I need it by Friday.','ai níid it bai fráidei.','Lo necesito para el viernes.']],
 quiz:[['I went there ___ buy food.',['for','to','for to'],1,'Para + verbo = to.'],['We traveled ___ bus.',['with','in','by'],2,'Medio de transporte: by bus.'],['What is the movie ___?',['of','about','from'],1,'Tema: about.']]},
{id:'prep3',lvl:'B1',t:'Verbo + preposición y adjetivo + preposición',sum:'Muchos verbos y adjetivos van con una preposición fija que no siempre coincide con el español. Por ejemplo: depend on, no depend of. Listen to music. Wait for. Married to. Interested in. Good at. Afraid of. Apréndelas como bloques.',
 pts:['Verbo + prep: <b>depend on</b> · <b>listen to</b> · <b>wait for</b> · <b>look for</b> (buscar) · <b>look at</b> (mirar) · <b>ask for</b> (pedir) · <b>pay for</b> · <b>think about/of</b> · <b>dream about</b> · <b>arrive at/in</b> · <b>belong to</b> · <b>agree with</b> · <b>apply for</b> · <b>talk to</b>.','Sin preposición (falsos amigos): <b>discuss</b> (no "discuss about"), <b>call</b> someone (no "call to"), <b>enter</b> a room, <b>marry</b> someone.','Adjetivo + prep: <b>interested in</b> · <b>good at</b> · <b>bad at</b> · <b>afraid of</b> · <b>tired of</b> · <b>proud of</b> · <b>married to</b> · <b>different from</b> · <b>similar to</b> · <b>angry with/at</b> · <b>excited about</b> · <b>worried about</b> · <b>responsible for</b> · <b>famous for</b>.','Después de preposición, verbo con -ing: "I\'m good at <b>cooking</b>", "Thanks for <b>helping</b>".'],
 ex:[['It depends on the weather.','it dipéndz on dha uéder.','Depende del clima.'],['I\'m listening to music.','aim lísening tu miúzik.','Estoy escuchando música.'],['We\'re waiting for the bus.','uír uéiting for dha bas.','Estamos esperando el autobús.'],['She is married to a doctor.','shi iz mérid tu a dákter.','Ella está casada con un doctor.'],['I\'m interested in history.','aim íntrestid in jístori.','Me interesa la historia.'],['He\'s really good at cooking.','jiz ríli gud at kúking.','Él es muy bueno cocinando.']],
 quiz:[['It depends ___ you.',['of','on','from'],1,'depend on.'],['I\'m afraid ___ dogs.',['to','of','from'],1,'afraid of.'],['Let\'s discuss ___ the plan.',['about','—','of'],1,'discuss no lleva preposición.']]},
{id:'phrasal',lvl:'B1',t:'Phrasal verbs esenciales',sum:'Los phrasal verbs son verbo más partícula, y cambian el significado: get up es levantarse, give up es rendirse, find out es descubrir. Los nativos los usan todo el tiempo, así que apréndelos con ejemplos.',
 pts:['<b>get up</b> levantarse · <b>wake up</b> despertar · <b>give up</b> rendirse/dejar · <b>find out</b> enterarse · <b>look for</b> buscar · <b>look after</b> cuidar · <b>turn on/off</b> encender/apagar · <b>pick up</b> recoger/contestar · <b>come back</b> regresar · <b>go out</b> salir · <b>figure out</b> descifrar · <b>run out of</b> quedarse sin · <b>hang out</b> pasar el rato · <b>show up</b> aparecer · <b>work out</b> hacer ejercicio / resolverse · <b>take off</b> despegar/quitarse · <b>put on</b> ponerse · <b>call back</b> devolver la llamada.','Con objeto: "Turn <b>it</b> off" (el pronombre va en medio).','La partícula suele llevar el acento: "get ÚP", "find ÁUT".'],
 ex:[['I get up at six.','ai guet áp at siks.','Me levanto a las seis.'],['Don\'t give up!','dóunt guiv áp!','¡No te rindas!'],['I found out the truth.','ai fáund áut dha truuth.','Me enteré de la verdad.'],['Can you pick me up?','kæn yu pik mi áp?','¿Puedes recogerme?'],['We ran out of milk.','uí ræn áut av milk.','Se nos acabó la leche.'],['Please turn it off.','plíiz tern it óf.','Por favor, apágalo.']],
 quiz:[['"Rendirse" =',['give up','give in to','get up'],0,'give up.'],['I\'m ___ my keys (buscando).',['looking after','looking for','looking at'],1,'look for = buscar.'],['Turn ___ off.',['off it','it','it off'],2,'El pronombre va en medio: turn it off.']]},
{id:'cond',lvl:'B2',t:'Condicionales (0, 1, 2, 3)',sum:'Los condicionales usan if. Tipo cero, verdades: if you heat ice, it melts. Tipo uno, futuro real: if it rains, I will stay home. Tipo dos, situaciones imaginarias: if I had money, I would travel. Tipo tres, el pasado que no pasó: if I had studied, I would have passed.',
 pts:['<b>0</b>: if + presente, presente → "If you heat ice, it melts".','<b>1</b>: if + presente, will + base → "If it <b>rains</b>, I\'<b>ll</b> stay home" (¡no "if it will rain"!).','<b>2</b>: if + pasado, would + base → "If I <b>had</b> money, I <b>would</b> travel". Con be: "If I <b>were</b> you…".','<b>3</b>: if + had + participio, would have + participio → "If I <b>had studied</b>, I <b>would have passed</b>" (hablado: "would\'ve" = uúdav).','unless = a menos que: "I won\'t go unless you come".'],
 ex:[['If it rains, I\'ll stay home.','if it réinz, ail stéi jóum.','Si llueve, me quedo en casa.'],['If I had more time, I would learn guitar.','if ai jæd mor táim, ai uud lern guitár.','Si tuviera más tiempo, aprendería guitarra.'],['If I were you, I would call her.','if ai uér yu, ai uud kol jer.','Yo que tú, la llamaría.'],['If I had studied, I would have passed.','if ai jæd stádid, ai uúdav pæst.','Si hubiera estudiado, habría pasado.'],['If you heat ice, it melts.','if yu jíit áis, it melts.','Si calientas el hielo, se derrite.']],
 quiz:[['If it ___ tomorrow, we\'ll cancel.',['will rain','rains','rained'],1,'Condicional 1: if + presente.'],['If I ___ rich, I would buy a house.',['am','were','will be'],1,'Condicional 2: if + pasado (were).'],['If she had called, I ___ answered.',['would','would have','will have'],1,'Condicional 3: would have + participio.']]}
];
