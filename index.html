main{max-width:980px;margin:0 auto;padding:.8rem}
.view{display:none}.view.act{display:block}
h2{margin:.3rem 0 .7rem;font-size:1.3rem}h3{margin:.6rem 0 .4rem;font-size:1.05rem}

/* avatar */
#avatar .mouth{transform-origin:60px 84px;transition:transform .08s}
#avatar.talking .mouth{animation:talk .22s infinite alternate}
@keyframes talk{0%{transform:scaleY(.25)}100%{transform:scaleY(1.15)}}

#avatar .eye{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#avatar .ring{opacity:0}
#avatar.listening .ring{animation:ring 1.2s infinite}
@keyframes ring{0%{opacity:.8;transform:scale(.85)}100%{opacity:0;transform:scale(1.25)}}
#avatar .ring{transform-origin:60px 60px}
#avatar .smile{opacity:0;transition:opacity .3s}
#avatar.happy .smile{opacity:1}#avatar.happy .mouth{opacity:0}
#avatar .brow{transition:transform .3s}
#avatar.concern .brow.l{transform:rotate(12deg) translateY(2px);transform-origin:44px 40px}

.big2{font-size:1.6rem;font-weight:800}.daily-hero{border:2px solid var(--acc)}.sp-es{margin:.3rem 0;font-size:1.02rem}.seg-en{background:#0f172a;border-radius:10px;padding:.45rem .6rem;margin:.35rem 0}.fbx.practice{border:2px solid var(--pur)}.recap ul{margin:.2rem 0 .5rem;padding-left:1.2rem}.modal.start{z-index:60;background:#0f172af2}.modal.start .card{max-width:420px}

/* ========================= v12: Duolingo-like bright, chunky, 3D-lite ========================= */
:root{
  --bg:#FFF7ED;

 ¡Muchas gracias!", "ipa": "/ˈpərˌfɪkt. θæŋks soʊ məʧ!/"}, {"id": "d_cafe_10", "s": "A", "en": "You got it. Have a good one!", "pr": "yu gádit. jáva gúd uan!", "es": "Con gusto. ¡Que te vaya bien!", "ipa": "/ju gɑt ɪt. hæv ə gʊd wən!/"}]}, {"id": "interview", "title": "Entrevista de trabajo", "icon": "💼", "level": "B1", "roles": ["Entrevistadora", "Candidato"], "lines": [{"id": "d_interview_0", "s": "A", "en": "Thanks for coming in today. So, tell me a little about yourself.", "pr": "thénks fer kámin in tudéi. sóu, tél mi a lírel abáut yorsélf.", "es": "Gracias por venir hoy. Cuéntame un poco sobre ti.", "ipa": "/θæŋks fər ˈkəmɪŋ ɪn təˈdeɪ. soʊ, tɛl mi ə ˈlɪtəl əˈbaʊt ˈjɔrsɛlf./"}, {"id": "d_interview_1", "s": "B", "en": "Sure. I've been working in customer service for about five years.", "pr": "shur. aiv bin uérkin in kástamer sérvis fer abáut fáiv yírz.", "es": "Claro. Llevo unos cinco años trabajando en servicio al cliente.", "ipa": "/ʃʊr. aɪv bɪn ˈwərkɪŋ ɪn ˈkəstəmər ˈsərvɪs fər əˈbaʊt faɪv jɪrz./"}, {"id": "d_interview_2", "s": "A", "en": "What would you say is your biggest strength?", "pr": "uát uúdyu séi iz yor bíguest strénkth?", "es": "¿Cuál dirías que es tu mayor fortaleza?", "ipa": "/wət wʊd ju seɪ ɪz jʊr ˈbɪgəst strɛŋθ?/"}, {"id": "d_interview_3", "s": "B", "en": "I'm a fast learner, and I'm really good at solving problems under pressure.", "pr": "aim a fást lérner, en aim ríli gúdet sálvin prábelemz ánder présher.", "es": "Aprendo rápido y soy muy bueno resolviendo problemas bajo presión.", "ipa": "/əm ə fæst ˈlərnər, ənd əm ˈrɪli gʊd æt ˈsɑlvɪŋ ˈprɑbləmz ˈəndər ˈprɛʃər./"}, {"id": "d_interview_4", "s": "A", "en": "Can you give me an example?", "pr": "ken yu guív mi en igzámpel?", "es": "¿Me puedes dar un ejemplo?", "ipa": "/kən ju gɪv mi ən ɪgˈzæmpəl?/"}, {"id": "d_interview_5", "s": "B", "en": "Last year, our system crashed during a holiday sale, and I helped the team keep customers happy.", "pr": "lást yír, áur sístem krásht dúrin a jálidei séil, en ai jélpt dha tíim kíip kástamerz jápi.", "es": "El año pasado el sistema falló durante una venta de temporada y ayudé al equipo a mantener contentos a los clientes.", "ipa": "/læst jɪr, ɑr ˈsɪstəm kræʃt ˈdʊrɪŋ ə ˈhɑlɪˌdeɪ seɪl, ənd aɪ hɛlpt ðə tim kip ˈkəstəmərz ˈhæpi./"}, {"id": "d_interview_6", "s": "A", "en": "Where do you see yourself in five years?", "pr": "uér du yu síi yorsélf in fáiv yírz?", "es": "¿Dónde te ves en cinco años?", "ipa": "/wɛr du ju si ˈjɔrsɛlf ɪn faɪv jɪrz?/"}, {"id": "d_interview_7", "s": "B", "en": "I'd like to grow into a team lead role.", "pr": "aid láik tu gróu íntu a tíim líid róul.", "es": "Me gustaría crecer hasta un puesto de líder de equipo.", "ipa": "/aɪd laɪk tɪ groʊ ˈɪntu ə tim lɛd roʊl./"}, {"id": "d_interview_8", "s": "A", "en": "Great. Do you have any questions for me?", "pr": "gréit. du yu jáv éni kuéschenz fer mi?", "es": "Genial. ¿Tienes alguna pregunta para mí?", "ipa": "/greɪt. du ju hæv ˈɛni kˈwɛsʧənz fər mi?/"}, {"id": "d_interview_9", "s": "B", "en": "Yes. What does a typical day look like here?", "pr": "yés. uát daz a típikal déi lúk láik jír?", "es": "Sí. ¿Cómo es un día típico aquí?", "ipa": "/jɛs. wət dɪz ə ˈtɪpɪkəl deɪ lʊk laɪk hir?/"}]}, {"id": "doctor", "title": "En el médico", "icon": "🩺", "level": "A2", "roles": ["Doctora", "Paciente"], "lines": [{"id": "d_doctor_0", "s": "A", "en": "Hi, what brings you in today?", "pr": "jái, uát bríngz yu in tudéi?", "es": "Hola, ¿qué te trae hoy por aquí?", "ipa": "/haɪ, wət brɪŋz ju ɪn təˈdeɪ?/"}, {"id": "d_doctor_1", "s": "B", "en": "I've had a sore throat and a headache for three days.", "pr": "aiv jád a sór thróut en a jédeik fer thríi déiz.", "es": "Llevo tres días con dolor de garganta y de cabeza.", "ipa": "/aɪv hæd ə sɔr θroʊt ənd ə ˈhɛˌdeɪk fər θri deɪz./"}, {"id": "d_doctor_2", "s": "A", "en": "Any fever or coughing?", "pr": "éni fíiver or kófin?", "es": "¿Fiebre o tos?", "ipa": "/ˈɛni ˈfivər ər ˈkɑfɪŋ?/"}, {"id": "d_doctor_3", "s": "B", "en": "A little fever last night, but not much coughing.", "pr": "a lírel fíiver lás náit, bat nát mách kófin.", "es": "Un poco de fiebre anoche, pero no mucha tos.", "ipa": "/ə ˈlɪtəl ˈfivər læst naɪt, bət nɑt məʧ ˈkɑfɪŋ./"}, {"id": "d_doctor_4", "s": "A", "en": "Okay, let me take a look. Open your mouth and say ah.", "pr": "oukéi, lémi téik a lúk. óupen yor máuth en séi áa.", "es": "Bien, déjame revisar. Abre la boca y di 'aaa'.", "ipa": "/ˌoʊˈkeɪ, lɛt mi teɪk ə lʊk. ˈoʊpən jʊr maʊθ ənd seɪ ɑ./"}, {"id": "d_doctor_5", "s": "B", "en": "Is it something serious?", "pr": "íz it sámthing sírias?", "es": "¿Es algo grave?", "ipa": "/ɪz ɪt ˈsəmθɪŋ ˈsɪriəs?/"}, {"id": "d_doctor_6", "s": "A", "en": "It looks like a mild infection. I'm going to prescribe some antibiotics.", "pr": "it lúks láik a máild infékshen. aim gána priskráib sam antibaiátiks.", "es": "Parece una infección leve. Te voy a recetar antibióticos.", "ipa": "/ɪt lʊks laɪk ə maɪld ˌɪnˈfɛkʃən. əm goʊɪŋ tɪ prəˈskraɪb səm ˌæntibaɪˈɑtɪks./"}, {"id": "d_doctor_7", "s": "B", "en": "How often should I take them?", "pr": "jáu ófen shúdai téik dhem?", "es": "¿Cada cuánto los tomo?", "ipa": "/haʊ ˈɔfən ʃʊd aɪ teɪk ðɛm?/"}, {"id": "d_doctor_8", "s": "A", "en": "Twice a day with food, for seven days.", "pr": "tuáis a déi uidh fúud, fer séven déiz.", "es": "Dos veces al día con comida, durante siete días.", "ipa": "/twaɪs ə deɪ wɪθ fud, fər ˈsɛvən deɪz./"}, {"id": "d_doctor_9", "s": "B", "en": "Got it. Thank you, doctor.", "pr": "gádit. thénk yu, dákter.", "es": "Entendido. Gracias, doctora.", "ipa": "/gɑt ɪt. θæŋk ju, ˈdɔktər./"}]}, {"id": "smalltalk", "title": "Charla con un vecino", "icon": "🌦️", "level": "A2", "roles": ["Vecino", "Vecino 2"], "lines": [{"id": "d_smalltalk_0", "s": "A", "en": "Hey! Crazy weather today, huh?", "pr": "jéi! kréizi uédher tudéi, já?", "es": "¡Hola! Qué loco está el clima hoy, ¿eh?", "ipa": "/heɪ! ˈkreɪzi ˈwɛðər təˈdeɪ, hə?/"}, {"id": "d_smalltalk_1", "s": "B", "en": "I know, right? It was sunny this morning and now it's pouring.", "pr": "ai nóu, ráit? it uaz sáni dhis mórnin en náu its pórin.", "es": "¿Verdad? Esta mañana hacía sol y ahora está diluviando.", "ipa": "/aɪ noʊ, raɪt? ɪt wɑz ˈsəni ðɪs ˈmɔrnɪŋ ənd naʊ ɪts ˈpɔrɪŋ./"}, {"id": "d_smalltalk_2", "s": "A", "en": "Did you do anything fun this weekend?", "pr": "díyu dú énithing fán dhis uíikend?", "es": "¿Hiciste algo divertido este fin de semana?", "ipa": "/dɪd ju du ˈɛniˌθɪŋ fən ðɪs ˈwiˌkɪnd?/"}, {"id": "d_smalltalk_3", "s": "B", "en": "Not really, I just stayed home and binge-watched a show.", "pr": "nát ríli, ai yast stéid jóum en bínch-uácht a shóu.", "es": "No mucho, me quedé en casa y vi una serie de corrido.", "ipa": "/nɑt ˈrɪli, aɪ ʤɪst steɪd hoʊm ənd … ə ʃoʊ./"}, {"id": "d_smalltalk_4", "s": "A", "en": "Oh nice, what were you watching?", "pr": "óu náis, uát uér yu uáchin?", "es": "Qué bien, ¿qué estabas viendo?", "ipa": "/oʊ nis, wət wər ju ˈwɑʧɪŋ?/"}, {"id": "d_smalltalk_5", "s": "B", "en": "A crime series. It's really good, you should check it out.", "pr": "a kráim síriz. its ríli gúd, yu shud chékidáut.", "es": "Una serie policiaca. Está muy buena, deberías verla.", "ipa": "/ə kraɪm ˈsɪriz. ɪts ˈrɪli gʊd, ju ʃʊd ʧɛk ɪt aʊt./"}, {"id": "d_smalltalk_6", "s": "A", "en": "I'll have to look it up. Anyway, I gotta run. See you around!", "pr": "ail jáv tu lúkidáp. éniuei, ai gára rán. síi yu aráund!", "es": "Tendré que buscarla. Bueno, me tengo que ir. ¡Nos vemos!", "ipa": "/aɪl hæv tɪ lʊk ɪt əp. ˈɛniˌweɪ, aɪ ˈgɑtə rən. si ju əraʊnd!/"}, {"id": "d_smalltalk_7", "s": "B", "en": "Take care!", "pr": "téik kér!", "es": "¡Cuídate!", "ipa": "/teɪk kɛr!/"}]}, {"id": "phone", "title": "Llamada para una cita", "icon": "📞", "level": "B1", "roles": ["Recepcionista", "Paciente"], "lines": [{"id": "d_phone_0", "s": "A", "en": "Thank you for calling Bright Smile Dental, this is Karen. How can I help you?", "pr": "thénk yu fer kólin bráit smáil déntal, dhis iz kéren. jáu ken ai jélp yu?", "es": "Gracias por llamar a Bright Smile Dental, habla Karen. ¿En qué le ayudo?", "ipa": "/θæŋk ju fər ˈkɔlɪŋ braɪt smaɪl ˈdɛntəl, ðɪs ɪz ˈkɛrən. haʊ kən aɪ hɛlp ju?/"}, {"id": "d_phone_1", "s": "B", "en": "Hi, I'd like to make an appointment for a cleaning.", "pr": "jái, aid láik tu méik an apóintment fer a klíinin.", "es": "Hola, quisiera hacer una cita para una limpieza.", "ipa": "/haɪ, aɪd laɪk tɪ meɪk ən əˈpɔɪntmənt fər ə ˈklinɪŋ./"}, {"id": "d_phone_2", "s": "A", "en": "Sure. Are you a new patient?", "pr": "shur. ar yu a nú péishent?", "es": "Claro. ¿Es paciente nuevo?", "ipa": "/ʃʊr. ər ju ə nu ˈpeɪʃənt?/"}, {"id": "d_phone_3", "s": "B", "en": "Yes, it's my first time.", "pr": "yés, its mai férst táim.", "es": "Sí, es mi primera vez.", "ipa": "/jɛs, ɪts maɪ fərst taɪm./"}, {"id": "d_phone_4", "s": "A", "en": "We have an opening next Tuesday at ten thirty. Does that work?", "pr": "uí jáv an óupenin nékst túzdei at tén thérdi. daz dhat uérk?", "es": "Tenemos un espacio el próximo martes a las diez y media. ¿Le funciona?", "ipa": "/wi hæv ən ˈoʊpənɪŋ nɛkst ˈtuzˌdeɪ æt tɛn ˈθərˌdi. dɪz ðət wərk?/"}, {"id": "d_phone_5", "s": "B", "en": "Could we do something in the afternoon instead?", "pr": "kúd ui dú sámthing in dhi afternúun instéd?", "es": "¿Podría ser mejor en la tarde?", "ipa": "/kʊd wi du ˈsəmθɪŋ ɪn ðə ˌæftərˈnun ˌɪnˈstɛd?/"}, {"id": "d_phone_6", "s": "A", "en": "Let me check. How about Thursday at three fifteen?", "pr": "lémi chék. jáu abáut thérzdei at thríi fiftíin?", "es": "Déjeme ver. ¿Qué tal el jueves a las tres y cuarto?", "ipa": "/lɛt mi ʧɛk. haʊ əˈbaʊt ˈθərzˌdeɪ æt θri ˈfɪfˈtin?/"}, {"id": "d_phone_7", "s": "B", "en": "That works for me.", "pr": "dhat uérks fer mi.", "es": "Me funciona.", "ipa": "/ðət wərks fər mi./"}, {"id": "d_phone_8", "s": "A", "en": "Great. Can I get your name and phone number?", "pr": "gréit. ken ai guét yor néim en fóun námber?", "es": "Perfecto. ¿Me da su nombre y teléfono?", "ipa": "/greɪt. kən aɪ gɪt jʊr neɪm ənd foʊn ˈnəmbər?/"}, {"id": "d_phone_9", "s": "B", "en": "Sure, let me spell my last name for you.", "pr": "shur, lémi spél mai lást néim fer yu.", "es": "Claro, le deletreo mi apellido.", "ipa": "/ʃʊr, lɛt mi spɛl maɪ læst neɪm fər ju./"}]}, {"id": "directions", "title": "Pedir direcciones", "icon": "🗺️", "level": "A2", "roles": ["Turista", "Peatón"], "lines": [{"id": "d_directions_0", "s": "A", "en": "Excuse me, do you know how to get to the subway station?", "pr": "ekskiúz mi, du yu nóu jáu tu guét tu dha sábuei stéishen?", "es": "Disculpe, ¿sabe cómo llegar a la estación del metro?", "ipa": "/ɪkˈskjuz mi, du ju noʊ haʊ tɪ gɪt tɪ ðə ˈsəbˌweɪ ˈsteɪʃən?/"}, {"id": "d_directions_1", "s": "B", "en": "Yeah, go straight for two blocks, then turn left at the light.", "pr": "yéa, góu stréit fer tú bláks, dhen térn léft at dha láit.", "es": "Sí, siga derecho dos cuadras y luego gire a la izquierda en el semáforo.", "ipa": "/jæ, goʊ streɪt fər tu blɑks, ðɛn tərn lɛft æt ðə laɪt./"}, {"id": "d_directions_2", "s": "A", "en": "Is it far from here?", "pr": "íz it fár fram jír?", "es": "¿Está lejos de aquí?", "ipa": "/ɪz ɪt fɑr frəm hir?/"}, {"id": "d_directions_3", "s": "B", "en": "Not really, it's about a five-minute walk.", "pr": "nát ríli, its abáuda fáiv-mínit uók.", "es": "No mucho, como a cinco minutos caminando.", "ipa": "/nɑt ˈrɪli, ɪts əˈbaʊt ə … wɔk./"}, {"id": "d_directions_4", "s": "A", "en": "Should I take the bus instead?", "pr": "shúdai téik dha bás instéd?", "es": "¿Mejor tomo el autobús?", "ipa": "/ʃʊd aɪ teɪk ðə bəs ˌɪnˈstɛd?/"}, {"id": "d_directions_5", "s": "B", "en": "Nah, walking is faster this time of day. Traffic is crazy.", "pr": "náa, uókin iz fáster dhis táim av déi. tráfik iz kréizi.", "es": "No, caminando es más rápido a esta hora. El tráfico está terrible.", "ipa": "/nɑ, ˈwɔkɪŋ ɪz ˈfæstər ðɪs taɪm əv deɪ. ˈtræfɪk ɪz ˈkreɪzi./"}, {"id": "d_directions_6", "s": "A", "en": "Got it. Straight, two blocks, then left.", "pr": "gádit. stréit, tú bláks, dhen léft.", "es": "Entendido. Derecho, dos cuadras y luego a la izquierda.", "ipa": "/gɑt ɪt. streɪt, tu blɑks, ðɛn lɛft./"}, {"id": "d_directions_7", "s": "B", "en": "Exactly. You can't miss it. It's right across from the bank.", "pr": "igzáktli. yu kánt mís it. its ráit akrós fram dha bénk.", "es": "Exacto. No tiene pérdida. Está justo enfrente del banco.", "ipa": "/ɪgˈzæktli. ju kænt mɪs ɪt. ɪts raɪt əˈkrɔs frəm ðə bæŋk./"}, {"id": "d_directions_8", "s": "A", "en": "Thanks a lot!", "pr": "thénks a lát!", "es": "¡Muchas gracias!", "ipa": "/θæŋks ə lɔt!/"}, {"id": "d_directions_9", "s": "B", "en": "No problem. Good luck!", "pr": "nóu prábelem. gúd lák!", "es": "De nada. ¡Suerte!", "ipa": "/noʊ ˈprɑbləm. gʊd lək!/"}]}, {"id": "restaurant", "title": "En el restaurante", "icon": "🍽️", "level": "A2", "roles": ["Mesero", "Cliente"], "lines": [{"id": "d_restaurant_0", "s": "A", "en": "Hi, welcome in! How many in your party?", "pr": "jái, uélkam in! jáu méni in yor pári?", "es": "¡Hola, bienvenidos! ¿Cuántas personas son?", "ipa": "/haɪ, ˈwɛlkəm ɪn! haʊ ˈmɛni ɪn jʊr ˈpɑrti?/"}, {"id": "d_restaurant_1", "s": "B", "en": "Just two, please.", "pr": "yast tú, plíiz.", "es": "Solo dos, por favor.", "ipa": "/ʤɪst tu, pliz./"}, {"id": "d_restaurant_2", "s": "A", "en": "Right this way. Can I start you off with something to drink?", "pr": "ráit dhis uéi. ken ai stárt yu óf uidh sámthin tu drínk?", "es": "Por aquí. ¿Les traigo algo de tomar para empezar?", "ipa": "/raɪt ðɪs weɪ. kən aɪ stɑrt ju ɔf wɪθ ˈsəmθɪŋ tɪ drɪŋk?/"}, {"id": "d_restaurant_3", "s": "B", "en": "Could we get two iced teas, please?", "pr": "kúd ui guét tú áist tíiz, plíiz?", "es": "¿Nos trae dos tés helados, por favor?", "ipa": "/kʊd wi gɪt tu aɪst tiz, pliz?/"}, {"id": "d_restaurant_4", "s": "A", "en": "Are you ready to order, or do you need a few more minutes?", "pr": "ar yu rédi tu órder, or du yu níid a fiú mor mínits?", "es": "¿Están listos para ordenar o necesitan unos minutos más?", "ipa": "/ər ju ˈrɛdi tɪ ˈɔrdər, ər du ju nid ə fju mɔr ˈmɪnəts?/"}, {"id": "d_restaurant_5", "s": "B", "en": "I think we're ready. I'll have the grilled chicken with a side salad.", "pr": "ai thínk uír rédi. ail jáv dha gríld chíken uidh a sáid sálad.", "es": "Creo que estamos listos. Yo quiero el pollo a la parrilla con ensalada.", "ipa": "/aɪ θɪŋk wɪr ˈrɛdi. aɪl hæv ðə grɪld ˈʧɪkən wɪθ ə saɪd ˈsæləd./"}, {"id": "d_restaurant_6", "s": "A", "en": "How would you like the dressing? We have ranch or vinaigrette.", "pr": "jáu uúd yu láik dha drésin? ui jáv rénch or vinegrét.", "es": "¿Qué aderezo prefiere? Tenemos ranch o vinagreta.", "ipa": "/haʊ wʊd ju laɪk ðə ˈdrɛsɪŋ? wi hæv rænʧ ər …./"}, {"id": "d_restaurant_7", "s": "B", "en": "Ranch on the side, please.", "pr": "rénch on dha sáid, plíiz.", "es": "Ranch aparte, por favor.", "ipa": "/rænʧ ɔn ðə saɪd, pliz./"}, {"id": "d_restaurant_8", "s": "A", "en": "How is everything tasting?", "pr": "jáu iz évrithing téistin?", "es": "¿Qué tal está todo?", "ipa": "/haʊ ɪz ˈɛvriˌθɪŋ ˈteɪstɪŋ?/"}, {"id": "d_restaurant_9", "s": "B", "en": "Everything is delicious. Could we get the check when you have a chance?", "pr": "évrithing iz dilíshas. kúd ui guét dha chék uén yu jáv a chéns?", "es": "Todo está delicioso. ¿Nos trae la cuenta cuando pueda?", "ipa": "/ˈɛvriˌθɪŋ ɪz dɪˈlɪʃəs. kʊd wi gɪt ðə ʧɛk wɪn ju hæv ə ʧæns?/"}]}, {"id": "meeting", "title": "Reunión de trabajo", "icon": "🧑‍💻", "level": "B1", "roles": ["Jefa", "Empleado"], "lines": [{"id": "d_meeting_0", "s": "A", "en": "Okay, let's get started. Thanks everyone for joining.", "pr": "oukéi, lets guét stárded. thénks évriuan fer yóinin.", "es": "Bien, empecemos. Gracias a todos por unirse.", "ipa": "/ˌoʊˈkeɪ, lɛts gɪt ˈstɑrtɪd. θæŋks ˈɛvriˌwən fər ˈʤɔɪnɪŋ./"}, {"id": "d_meeting_1", "s": "B", "en": "Before we dive in, can I give a quick update on the project?", "pr": "bifór ui dáiv in, ken ai guív a kuík ápdeit on dha prályekt?", "es": "Antes de entrar en materia, ¿puedo dar una actualización rápida del proyecto?", "ipa": "/ˌbiˈfɔr wi daɪv ɪn, kən aɪ gɪv ə kwɪk ˈəpˌdeɪt ɔn ðə ˈprɑʤɛkt?/"}, {"id": "d_meeting_2", "s": "A", "en": "Sure, go ahead.", "pr": "shur, góu ajéd.", "es": "Claro, adelante.", "ipa": "/ʃʊr, goʊ əˈhɛd./"}, {"id": "d_meeting_3", "s": "B", "en": "We're a little behind schedule, but we should wrap it up by Friday.", "pr": "uír a lírel bijáind skéyul, bat ui shud répidáp bai fráidei.", "es": "Vamos un poco atrasados, pero deberíamos terminar para el viernes.", "ipa": "/wɪr ə ˈlɪtəl bɪˈhaɪnd ˈskɛʤʊl, bət wi ʃʊd ræp ɪt əp baɪ ˈfraɪˌdeɪ./"}, {"id": "d_meeting_4", "s": "A", "en": "What's slowing us down?", "pr": "uáts slóuin as dáun?", "es": "¿Qué nos está frenando?", "ipa": "/wəts sloʊɪŋ ˈjuˈɛs daʊn?/"}, {"id": "d_meeting_5", "s": "B", "en": "We're waiting on feedback from the client.", "pr": "uír uéitin on fíidbek fram dha kláient.", "es": "Estamos esperando comentarios del cliente.", "ipa": "/wɪr ˈweɪtɪŋ ɔn ˈfidˌbæk frəm ðə klaɪənt./"}, {"id": "d_meeting_6", "s": "A", "en": "Okay. Can you follow up with them today?", "pr": "oukéi. ken yu fálou áp uidh dhem tudéi?", "es": "Bien. ¿Puedes darles seguimiento hoy?", "ipa": "/ˌoʊˈkeɪ. kən ju ˈfɑloʊ əp wɪθ ðɛm təˈdeɪ?/"}, {"id": "d_meeting_7", "s": "B", "en": "Absolutely. I'll send them an email after this meeting.", "pr": "ábsolútli. ail sénd dhem an íimeil áfter dhis míitin.", "es": "Por supuesto. Les mando un correo después de esta reunión.", "ipa": "/ˌæbsəˈlutli. aɪl sɛnd ðɛm ən iˈmeɪl ˈæftər ðɪs ˈmitɪŋ./"}, {"id": "d_meeting_8", "s": "A", "en": "Great. Let's circle back on this next week.", "pr": "gréit. lets sérkel bák on dhis nékst uíik.", "es": "Genial. Retomemos esto la próxima semana.", "ipa": "/greɪt. lɛts ˈsərkəl bæk ɔn ðɪs nɛkst wik./"}, {"id": "d_meeting_9", "s": "B", "en": "Sounds good.", "pr": "sáundz gúd.", "es": "Me parece bien.", "ipa": "/saʊnz gʊd./"}]}, {"id": "shopping", "title": "De compras", "icon": "🛍️", "level": "A2", "roles": ["Vendedora", "Cliente"], "lines": [{"id": "d_shopping_0", "s": "A", "en": "Hi! Are you finding everything okay?", "pr": "jái! ar yu fáindin évrithin oukéi?", "es": "¡Hola! ¿Encuentra todo bien?", "ipa": "/haɪ! ər ju ˈfaɪndɪŋ ˈɛvriˌθɪŋ ˌoʊˈkeɪ?/"}, {"id": "d_shopping_1", "s": "B", "en": "Actually, I'm looking for this jacket in a medium.", "pr": "ákchuali, aim lúkin fer dhis yáket in a mídiam.", "es": "De hecho, busco esta chaqueta en talla mediana.", "ipa": "/ˈæˌkʧuəli, əm ˈlʊkɪŋ fər ðɪs ˈʤækɪt ɪn ə ˈmidiəm./"}, {"id": "d_shopping_2", "s": "A", "en": "Let me check in the back for you.", "pr": "lémi chék in dha bák fer yu.", "es": "Déjeme revisar en la bodega.", "ipa": "/lɛt mi ʧɛk ɪn ðə bæk fər ju./"}, {"id": "d_shopping_3", "s": "B", "en": "Thanks. Also, is this on sale?", "pr": "thénks. ólsou, íz dhis on séil?", "es": "Gracias. Además, ¿esto está en oferta?", "ipa": "/θæŋks. ˈɔlsoʊ, ɪz ðɪs ɔn seɪl?/"}, {"id": "d_shopping_4", "s": "A", "en": "Yes, everything on this rack is thirty percent off.", "pr": "yés, évrithing on dhis rák iz thérdi persént óf.", "es": "Sí, todo en este perchero tiene treinta por ciento de descuento.", "ipa": "/jɛs, ˈɛvriˌθɪŋ ɔn ðɪs ræk ɪz ˈθərˌdi pərˈsɛnt ɔf./"}, {"id": "d_shopping_5", "s": "B", "en": "Nice! Can I try it on?", "pr": "náis! ken ai trái it ón?", "es": "¡Qué bien! ¿Me lo puedo probar?", "ipa": "/nis! kən aɪ traɪ ɪt ɔn?/"}, {"id": "d_shopping_6", "s": "A", "en": "Of course. The fitting rooms are right over there.", "pr": "av kórs. dha fírin rúumz ar ráit óuver dhér.", "es": "Claro. Los probadores están por allá.", "ipa": "/əv kɔrs. ðə ˈfɪtɪŋ rumz ər raɪt ˈoʊvər ðɛr./"}, {"id": "d_shopping_7", "s": "B", "en": "It fits perfectly. I'll take it.", "pr": "it fíts pérfektli. ail téik it.", "es": "Me queda perfecto. Me lo llevo.", "ipa": "/ɪt fɪts ˈpərfəktli. aɪl teɪk ɪt./"}, {"id": "d_shopping_8", "s": "A", "en": "Great choice. Would you like a bag?", "pr": "gréit chóis. uúd yu láik a bág?", "es": "Excelente elección. ¿Quiere una bolsa?", "ipa": "/greɪt ʧɔɪs. wʊd ju laɪk ə bæg?/"}, {"id": "d_shopping_9", "s": "B", "en": "No thanks, I brought my own.", "pr": "nóu thénks, ai brót mai óun.", "es": "No, gracias, traje la mía.", "ipa": "/noʊ θæŋks, aɪ brɔt maɪ oʊn./"}]}, {"id": "friends", "title": "Haciendo amigos", "icon": "🤝", "level": "A2", "roles": ["Alex", "Yonathan"], "lines": [{"id": "d_friends_0", "s": "A", "en": "Hey, I don't think we've met. I'm Alex.", "pr": "jéi, ai dóunt thínk uív mét. aim áleks.", "es": "Hola, creo que no nos conocemos. Soy Alex.", "ipa": "/heɪ, aɪ doʊnt θɪŋk wiv mɛt. əm ˈæləks./"}, {"id": "d_friends_1", "s": "B", "en": "Nice to meet you, Alex. I'm Yonathan.", "pr": "náis tu míit yu, áleks. aim yónathan.", "es": "Mucho gusto, Alex. Soy Yonathan.", "ipa": "/nis tɪ mit ju, ˈæləks. əm …./"}, {"id": "d_friends_2", "s": "A", "en": "So how do you know Sarah?", "pr": "sóu jáu díyu nóu séra?", "es": "¿Y de dónde conoces a Sarah?", "ipa": "/soʊ haʊ du ju noʊ ˈsɛrə?/"}, {"id": "d_friends_3", "s": "B", "en": "We work together. What about you?", "pr": "ui uérk tuguédher. uát abáut yu?", "es": "Trabajamos juntos. ¿Y tú?", "ipa": "/wi wərk təˈgɛðər. wət əˈbaʊt ju?/"}, {"id": "d_friends_4", "s": "A", "en": "We went to college together. So what do you do for fun?", "pr": "ui uént tu káley tuguédher. sóu uát díyu dú fer fán?", "es": "Fuimos juntos a la universidad. ¿Y qué haces para divertirte?", "ipa": "/wi wɛnt tɪ ˈkɑlɪʤ təˈgɛðər. soʊ wət du ju du fər fən?/"}, {"id": "d_friends_5", "s": "B", "en": "I'm really into soccer and hiking. How about you?", "pr": "aim ríli íntu sáker en jáikin. jáu abáut yu?", "es": "Me encanta el fútbol y el senderismo. ¿Y tú?", "ipa": "/əm ˈrɪli ˈɪntu ˈsɑkər ənd ˈhaɪkɪŋ. haʊ əˈbaʊt ju?/"}, {"id": "d_friends_6", "s": "A", "en": "No way, I love hiking too! We should go sometime.", "pr": "nóu uéi, ai láv jáikin túu! ui shud góu sámtaim.", "es": "¡No puede ser, a mí también me encanta el senderismo! Deberíamos ir algún día.", "ipa": "/noʊ weɪ, aɪ ləv ˈhaɪkɪŋ tu! wi ʃʊd goʊ ˈsəmˌtaɪm./"}, {"id": "d_friends_7", "s": "B", "en": "Definitely. Let's exchange numbers.", "pr": "défenitli. lets ekschéinch námberz.", "es": "Definitivamente. Intercambiemos números.", "ipa": "/ˈdɛfənətli. lɛts ɪksˈʧeɪnʤ ˈnəmbərz./"}, {"id": "d_friends_8", "s": "A", "en": "Sounds like a plan. I'll text you this week.", "pr": "sáundz láik a plán. ail tékst yu dhis uíik.", "es": "Trato hecho. Te escribo esta semana.", "ipa": "/saʊnz laɪk ə plæn. aɪl tɛkst ju ðɪs wik./"}, {"id": "d_friends_9", "s": "B", "en": "Awesome. Talk to you soon!", "pr": "ósam. tók tu yu súun!", "es": "Genial. ¡Hablamos pronto!", "ipa": "/ˈɔsəm. tɔk tɪ ju sun!/"}]}], "idioms": [{"id": "i_0", "en": "break the ice", "pr": "bréik dhi áis", "es": "romper el hielo", "ipa": "/breɪk ðə aɪs/", "ex": {"id": "ix_0", "en": "He told a joke to break the ice.", "pr": "ji tóuld a yóuk tu bréik dhi áis.", "es": "Ejemplo de: break the ice (romper el hielo)", "ipa": "/hi toʊld ə ʤoʊk tɪ breɪk ðə aɪs./"}}, {"id": "i_1", "en": "hit the road", "pr": "jít dha róud", "es": "irse, ponerse en camino", "ipa": "/hɪt ðə roʊd/", "ex": {"id": "ix_1", "en": "It's late, we should hit the road.", "pr": "its léit, ui shud jít dha róud.", "es": "Ejemplo de: hit the road (irse, ponerse en camino)", "ipa": "/ɪts leɪt, wi ʃʊd hɪt ðə roʊd./"}}, {"id": "i_2", "en": "piece of cake", "pr": "píisa kéik", "es": "pan comido, muy fácil", "ipa": "/pis əv keɪk/", "ex": {"id": "ix_2", "en": "The test was a piece of cake.", "pr": "dha tést uaz a píisa kéik.", "es": "Ejemplo de: piece of cake (pan comido, muy fácil)", "ipa": "/ðə tɛst wɑz ə pis əv keɪk./"}}, {"id": "i_3", "en": "under the weather", "pr": "ánder dha uédher", "es": "sentirse un poco enfermo", "ipa": "/ˈəndər ðə ˈwɛðər/", "ex": {"id": "ix_3", "en": "I'm feeling a little under the weather.", "pr": "aim fíilin a lírel ánder dha uédher.", "es": "Ejemplo de: under the weather (sentirse un poco enfermo)", "ipa": "/əm ˈfilɪŋ ə ˈlɪtəl ˈəndər ðə ˈwɛðər./"}}, {"id": "i_4", "en": "call it a day", "pr": "kólida déi", "es": "dar por terminado (el trabajo del día)", "ipa": "/kɔl ɪt ə deɪ/", "ex": {"id": "ix_4", "en": "We're tired. Let's call it a day.", "pr": "uír táierd. lets kólida déi.", "es": "Ejemplo de: call it a day (dar por terminado (el trabajo del día))", "ipa": "/wɪr taɪərd. lɛts kɔl ɪt ə deɪ./"}}, {"id": "i_5", "en": "hang out", "pr": "jáng áut", "es": "pasar el rato, salir", "ipa": "/hæŋ aʊt/", "ex": {"id": "ix_5", "en": "Do you want to hang out this weekend?", "pr": "du yu uána jáng áut dhis uíikend?", "es": "Ejemplo de: hang out (pasar el rato, salir)", "ipa": "/du ju wɔnt tɪ hæŋ aʊt ðɪs ˈwiˌkɪnd?/"}}, {"id": "i_6", "en": "figure out", "pr": "fíguier áut", "es": "averiguar, resolver, entender", "ipa": "/ˈfɪgjər aʊt/", "ex": {"id": "ix_6", "en": "I can't figure out this problem.", "pr": "ai ként fíguier áut dhis prábelem.", "es": "Ejemplo de: figure out (averiguar, resolver, entender)", "ipa": "/aɪ kænt ˈfɪgjər aʊt ðɪs ˈprɑbləm./"}}, {"id": "i_7", "en": "get the hang of it", "pr": "guét dha jáng av it", "es": "agarrarle la onda / el truco", "ipa": "/gɪt ðə hæŋ əv ɪt/", "ex": {"id": "ix_7", "en": "Don't worry, you'll get the hang of it.", "pr": "dóunt uéri, yul guét dha jáng av it.", "es": "Ejemplo de: get the hang of it (agarrarle la onda / el truco)", "ipa": "/doʊnt ˈwəri, jul gɪt ðə hæŋ əv ɪt./"}}, {"id": "i_8", "en": "no big deal", "pr": "nóu bíg díil", "es": "no es para tanto", "ipa": "/noʊ bɪg dil/", "ex": {"id": "ix_8", "en": "Don't worry, it's no big deal.", "pr": "dóunt uéri, its nóu bíg díil.", "es": "Ejemplo de: no big deal (no es para tanto)", "ipa": "/doʊnt ˈwəri, ɪts noʊ bɪg dil./"}}, {"id": "i_9", "en": "my bad", "pr": "mái bád", "es": "mi culpa (informal)", "ipa": "/maɪ bæd/", "ex": {"id": "ix_9", "en": "Oops, my bad. I'll fix it.", "pr": "úps, mái bád. ail fíks it.", "es": "Ejemplo de: my bad (mi culpa (informal))", "ipa": "/ups, maɪ bæd. aɪl fɪks ɪt./"}}, {"id": "i_10", "en": "I'm down", "pr": "aim dáun", "es": "me apunto", "ipa": "/əm daʊn/", "ex": {"id": "ix_10", "en": "Pizza tonight? I'm down.", "pr": "píitsa tunáit? aim dáun.", "es": "Ejemplo de: I'm down (me apunto)", "ipa": "/ˈpitsə təˈnaɪt? əm daʊn./"}}, {"id": "i_11", "en": "sounds good", "pr": "sáundz gúd", "es": "suena bien, de acuerdo", "ipa": "/saʊnz gʊd/", "ex": {"id": "ix_11", "en": "Meet at six? Sounds good.", "pr": "míit at síks? sáundz gúd.", "es": "Ejemplo de: sounds good (suena bien, de acuerdo)", "ipa": "/mit æt sɪks? saʊnz gʊd./"}}, {"id": "i_12", "en": "catch up", "pr": "kéch áp", "es": "ponerse al día (con alguien)", "ipa": "/kæʧ əp/", "ex": {"id": "ix_12", "en": "Let's grab coffee and catch up.", "pr": "lets gréb kófi en kéch áp.", "es": "Ejemplo de: catch up (ponerse al día (con alguien))", "ipa": "/lɛts græb ˈkɔfi ənd kæʧ əp./"}}, {"id": "i_13", "en": "grab a bite", "pr": "gréb a báit", "es": "comer algo rápido", "ipa": "/græb ə baɪt/", "ex": {"id": "ix_13", "en": "Do you want to grab a bite after work?", "pr": "du yu uána gréb a báit áfter uérk?", "es": "Ejemplo de: grab a bite (comer algo rápido)", "ipa": "/du ju wɔnt tɪ græb ə baɪt ˈæftər wərk?/"}}, {"id": "i_14", "en": "running late", "pr": "ránin léit", "es": "ir tarde, retrasarse", "ipa": "/ˈrənɪŋ leɪt/", "ex": {"id": "ix_14", "en": "Sorry, I'm running late.", "pr": "sóri, aim ránin léit.", "es": "Ejemplo de: running late (ir tarde, retrasarse)", "ipa": "/ˈsɑri, əm ˈrənɪŋ leɪt./"}}, {"id": "i_15", "en": "on the same page", "pr": "on dha séim péich", "es": "estar en sintonía, de acuerdo", "ipa": "/ɔn ðə seɪm peɪʤ/", "ex": {"id": "ix_15", "en": "Let's make sure we're on the same page.", "pr": "lets méik shúr uír on dha séim péich.", "es": "Ejemplo de: on the same page (estar en sintonía, de acuerdo)", "ipa": "/lɛts meɪk ʃʊr wɪr ɔn ðə seɪm peɪʤ./"}}, {"id": "i_16", "en": "touch base", "pr": "tách béis", "es": "contactar brevemente", "ipa": "/təʧ beɪs/", "ex": {"id": "ix_16", "en": "I'll touch base with you tomorrow.", "pr": "ail tách béis uidh yu tumárou.", "es": "Ejemplo de: touch base (contactar brevemente)", "ipa": "/aɪl təʧ beɪs wɪθ ju təˈmɑˌroʊ./ /* ---------- Text normalization & scoring ---------- */
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n2w(n){n=+n;if(n<20)return NUM[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+NUM[n%10]:'');if(n<1000)return NUM[Math.floor(n/100)]+' hundred'+(n%100?' '+n2w(n%100):'');return String(n)}
const HOMO={two:'to',too:'to',four:'for',write:'right',their:'there',hear:'here',buy:'by',bye:'by',know:'no',sea:'see',meat:'meet',weak:'week',won:'one',eight:'ate',eye:'i',ok:'okay',hi:'hi',hey:'hi',yeah:'yes',yep:'yes',ya:'you',your:'your',youre:'your',wanna:'want',gonna:'going',gotta:'got',its:'it',whats:'what',thats:'that',blueberry:'blueberry',coworkers:'coworkers',alright:'all'};
const NAMES=new Set(['yonathan','alex','sarah','karen']);
function norm(s){s=String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/(\d+)%/g,'$1 percent').replace(/\$(\d+)\.(\d\d)/g,'$1 $2').replace(/(\d+):(\d\d)/g,'$1 $2')
 .replace(/\b(can)'t\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would').replace(/'s\b/g,' is')
 .replace(/\bcannot\b/g,'can not').replace(/\bgonna\b/g,'going to').replace(/\bwanna\b/g,'want to').replace(/\bgotta\b/g,'got to').replace(/\bkinda\b/g,'kind of').replace(/\bok\b/g,'okay').replace(/\be-?mail\b/g,'email')
 .replace(/\d+/g,m=>n2w(m)).replace(/[-–—]/g,' ').replace(/[^a-z' ]/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();return s?s.split(' '):[]}
function canon(w){return HOMO[w]||w}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array(n+1).fill(0).map((_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function wsim(a,b){if(canon(a)===canon(b))return 1;return 1-lev(a,b)/Math.max(a.length,b.length)}
/* word alignment: returns per-target status ok/mid/bad + extras */
function align(target,hyp){const T=target,H=hyp,m=T.length,n=H.length;const D=[...Array(m+1)].map(()=>Array(n+1).fill(0));const B=[...Array(m+1)].map(()=>Array(n+1).fill(''));
 for(let i=0;i<=m;i++){D[i][0]=i;B[i][0]='d'}for(let j=0;j<=n;j++){D[0][j]=j;B[0][j]='i'}
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const s=wsim(T[i-1],H[j-1]);const sc=s===1?0:(s>=0.6?0.6:1);const o=[[D[i-1][j-1]+sc,'s'],[D[i-1][j]+1,'d'],[D[i][j-1]+1,'i']].sort((a,b)=>a[0]-b[0])[0];D[i][j]=o[0];B[i][j]=o[1]}
 const st=Array(m).fill('bad'),heard=Array(m).fill('');let extra=[],i=m,j=n;
 while(i>0||j>0){const b=i>0&&j>0?B[i][j]:(i>0?'d':'i');if(b==='s'){const s=wsim(T[i-1],H[j-1]);st[i-1]=s===1||NAMES.has(T[i-1])?'ok':(s>=0.6?'mid':'bad');heard[i-1]=H[j-1];i--;j--}else if(b==='d'){st[i-1]=NAMES.has(T[i-1])?'ok':'bad';i--}else{extra.push(H[j-1]);j--}}
 return{st,heard,extra}}
function scoreAttempt(target,alts){const T=norm(target);let best=null;
 for(const a of (alts||[])){const H=norm(a.t);const al=align(T,H);const ok=al.st.filter(s=>s==='ok').length,mid=al.st.filter(s=>s==='mid').length;const acc=T.length?(ok+0.5*mid)/T.length:0;
  const conf=a.c>0?a.c:acc;let sc=Math.round(100*(0.85*acc+0.15*conf))-Math.min(12,al.extra.length*3);sc=Math.max(0,Math.min(100,sc));
  if(!best||sc>best.score)best={score:sc,acc,conf:a.c,T,H,heardText:a.t,...al}}

/* ---------- Spanish-speaker sound pitfalls ---------- */
const SOUNDS={
 th:{n:'TH (think / this)',tip:'Saca la punta de la lengua entre los dientes. "think" no es "tink" ni "sink"; "this" no es "dis". Sorda en think/thanks, vibrante en this/the/they.'},
 s:{n:'S + consonante (school, speak)',tip:'¡No agregues "e" al inicio! Di "sss-pík", no "es-pík". Truco: empieza alargando la s: "ssschool".'},
 v:{n:'V vs B (very / berry)',tip:'En inglés la V se hace con los dientes de arriba sobre el labio de abajo, y vibra. La B junta los dos labios. En español suenan igual; en inglés no.'},
 ed:{n:'Terminación -ED',tip:'-ed suena /t/ tras sonidos sordos (worked = uérkt), /d/ tras sonoros (played = pléid) y /ɪd/ solo tras t o d (wanted). Nunca digas "work-ed".'},
 final:{n:'Consonantes finales',tip:'El español casi no termina en consonantes como -st, -nd, -ks, -lt, -k, -d. Pronuncia la última: "last" no "las", "world" no "worl", "card" no "car".'},
 i:{n:'i corta vs ii larga (ship / sheep)',tip:'La i corta /ɪ/ (it, live, ship) es relajada, casi entre "i" y "e". La ii larga /iː/ (eat, leave, sheep) es tensa: sonríe y alárgala.'},
 sh:{n:'SH vs CH (she / chair)',tip:'SH es un soplido continuo ("shhh", como pedir silencio). CH es explosivo. No los mezcles: "share" ≠ "chair".'},
 z:{n:'Z / S sonora (is, was, rise)',tip:'Muchas "s" en inglés zumban como abeja /z/: is, was, easy, music, rise. Pon la mano en la garganta: debe vibrar.'},
 h:{n:'H inglesa (hello, house)',tip:'La H inglesa es solo aire suave, como empañar un vidrio. No es la "j" fuerte del español. Y nunca la omitas: "hear" ≠ "ear".'},
 r:{n:'R inglesa',tip:'La lengua no toca el paladar: se curva hacia atrás y los labios se redondean un poco. Nunca la hagas vibrar como "rr".'},
 schwa:{n:'Schwa /ə/ y acento',tip:'Las sílabas sin acento se reducen a un sonido neutro "uh" (about = əbáut, problem = prábləm). No pronuncies todas las vocales completas; marca fuerte la sílaba acentuada.'},
 dy:{n:'J / DG (job, just)',tip:'"job", "just", "change" llevan /dʒ/, como una "ch" con voz (dy). "yes", "yet" llevan una y suave. "jet" ≠ "yet".'},
 w:{n:'W (would, work)',tip:'Redondea los labios como para una "u" rápida y suéltalos: would = "uud", work = "uérk". No agregues "g" (no "güud").'},
 ae:{n:'Vocal æ (cat, thanks, bad)',tip:'Abre bastante la boca y estira los labios: es un sonido entre "a" y "e". "bad" no es "bed" ni "bod".'},
 u:{n:'u corta vs uu larga (full / fool)',tip:'La u corta /ʊ/ (full, good, book) es relajada y breve. La uu larga /uː/ (fool, food) es tensa y redondeada.'},
};
const EDX=new Set(['need','red','bed','feed','seed','speed','bleed','shed','fred','ted','wed','led','fled','sled','bred','breed','greed','weed','indeed','proceed','succeed','exceed','hundred']);
function soundsOf(w){const o=[];w=w.toLowerCase();
 if(/th/.test(w))o.push('th');if(/^s[ptkcmnlqw]/.test(w))o.push('s');if(/v/.test(w))o.push('v');
 if(/[a-z]{2}ed$/.test(w)&&!EDX.has(w))o.push('ed');
 if(/(st|nd|ld|lt|nt|ks|ts|ps|ft|kt|sk|rd|rk|rt|ct|pt)$|[^aeiouy]{0}[kdtpbg]$/.test(w)&&w.length>2)o.push('final');
 if(/ee|ea|ie(?!w)/.test(w)||/[^aeiou]i[bcdfgklmnpstvxz](?!e)/.test(w)&&!/igh/.test(w))o.push('i');
 if(/sh|ch|tion|tch/.test(w))o.push('sh');if(/[aeiou]s[aeiou]|z|^(is|was|has|his|as|does|these|those|because|always|easy|music|rise)$/.test(w))o.push('z');

const MOTIV=['Los errores son datos, no fracasos.','La fluidez es un hábito: 15 minutos diarios valen más que 2 horas el domingo.','Tu cerebro está creando nuevas rutas. Repite sin miedo.','Cada día que practicas, tu acento mejora un poco. Confía en el proceso.','Habla aunque te equivoques: así es como se aprende de verdad.','Hoy mejor que ayer. Mañana mejor que hoy.'];
function feedback(r){const bad=r.T.filter((w,i)=>r.st[i]!=='ok');let head=r.score>=90?pick(PRAISE):r.score>=75?pick(GOOD):r.score>=50?pick(MID):pick(LOW);
 const keys={};bad.forEach(w=>soundsOf(w).forEach(k=>keys[k]=(keys[k]||0)+1));
 const pr=['th','s','v','ed','final','i','sh','z','h','dy','w','ae','r','schwa'];const top=Object.keys(keys).sort((a,b)=>(keys[b]-keys[a])||(pr.indexOf(a)-pr.indexOf(b))).slice(0,2);
 let li=[];if(bad.length)li.push(`<li>Palabras a mejorar: <b>${bad.map(esc).join(', ')}</b></li>`);
 r.T.forEach((w,i)=>{if(r.st[i]==='mid'&&r.heard[i])li.push(`<li>Dijiste algo como <i>"${esc(r.heard[i])}"</i> en lugar de <b>"${esc(w)}"</b>.</li>`)});
 if(r.extra.length)li.push(`<li>Escuché palabras de más: <i>${r.extra.map(esc).join(', ')}</i></li>`);
 top.forEach(k=>li.push(`<li>🔧 <b>${SOUNDS[k].n}:</b> ${SOUNDS[k].tip}</li>`));
 if(r.score<75)li.push(`<li>💪 ${pick(MOTIV)}</li>`);
 const sy=r.score>=90?pick(SAYS.great):r.score>=75?pick(SAYS.ok):r.score>=50?pick(SAYS.almost)+' Repite las palabras en rojo.':'Escúchalo otra vez, más despacito, y repite.';
 return{head,html:`<b>${head}</b><ul>${li.join('')}</ul>`,say:sy,bad}}

function liveRender(target,txt){const r=scoreAttempt(target,[{t:txt,c:0}]);return r.T.map((w,i)=>{return `<span class="w ${r.st[i]==='ok'?'ok':(r.heard[i]?'mid':'')}">${esc(w)}</span>`}).join(' ')}
async function attempt(it,card,o={}){
 if(AZ.cfg()&&MIC.supported())return azAttempt(it,card,o);

  return new Promise(r=>res.querySelectorAll('.selfg').forEach(bb=>bb.onclick=()=>{const sc=+bb.dataset.s;const rr={score:sc,T:norm(it.en),st:norm(it.en).map(()=>sc>=80?'ok':'bad'),heard:[],extra:[],self:true};record(it,rr,o);res.innerHTML=`<div class="score">${sc}</div><div class="fb">Autoevaluación guardada.</div>`;r(rr)}))}

 if(!out||!out.alts.length){live.innerHTML=out&&out.err&&out.err!=='no-speech'?'':'No te escuché. Toca 🎤 e intenta de nuevo.';$('#liveHeard').textContent='';return null}
 const r=scoreAttempt(it.en,out.alts);const f=feedback(r);

 <div class="words">${r.T.map((w,i)=>`<span class="w ${r.st[i]}" title="${r.heard[i]?'oí: '+esc(r.heard[i]):'no se oyó'}">${esc(w)}</span>`).join('')}${r.extra.map(w=>`<span class="w extra">${esc(w)}</span>`).join('')}</div>
 <div class="small mut">Entendí: "${esc(r.heardText)}"</div><div class="fb">${f.html}</div>
 ${f.bad.length?`<div class="row">${f.bad.slice(0,4).map(w=>`<button class="sm" onclick="speakSlow('${esc(w).replace(/'/g,'')}')">🔊 ${esc(w)}</button>`).join('')}</div>`:''}`;
 $('#liveHeard').innerHTML=`<span class="words">${r.T.map((w,i)=>`<span class="w ${r.st[i]}">${esc(w)}</span>`).join('')}</span>`;

 const m=r.score>=85?'happy':r.score<55?'concern':null;
 $('#bubbleText').innerHTML=`<b>${r.score}/100.</b> ${esc(f.head)}`;if(m)mood(m);
 if(!o.quiet){if(S.settings.coachEs)await speak(f.say,{lang:'es'});if(f.bad.length&&r.score<90)await speakSlow(f.bad.slice(0,2).join(', '))}

function record(it,r,o={}){sessAdd(it,r.score);const t=today();t.att++;t.sum+=r.score;if(o.kind==='line')t.lines++;
 S.best[it.id]=Math.max(S.best[it.id]||0,r.score);if(r.score>=85)S.mastered[it.id]=1;
 S.hist=S.hist||[];S.hist.push([Date.now(),r.score]);if(S.hist.length>2000)S.hist.splice(0,500);

/* ---------- Self recording (MediaRecorder) ---------- */
async function selfRecord(it,btn){if(!navigator.mediaDevices||!window.MediaRecorder){coachSay('Tu navegador no permite grabar audio aquí.');return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);const ch=[];mr.ondataavailable=e=>ch.push(e.data);
  btn.textContent='⏹️ Grabando…';btn.disabled=true;mr.start();const secs=Math.min(12,Math.max(3,it.en.split(' ').length*0.6+2));await sleep(secs*1000);mr.stop();
  await new Promise(r=>mr.onstop=r);st.getTracks().forEach(t=>t.stop());const url=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}));
  btn.textContent='⏺️ Grabarme';btn.disabled=false;await coachSay('Escucha: primero tú, luego el modelo. ¿Notas la diferencia en ritmo y sonidos?');
  const au=new Audio(url);await new Promise(r=>{au.onended=r;au.onerror=r;au.play().catch(r)});await sleep(300);await speak(it.en)}
 catch(e){btn.textContent='⏺️ Grabarme';btn.disabled=false;micError('not-allowed')}}

/* ---------- Spaced repetition (SM-2) ---------- */
function srsAdd(it,auto){if(S.srs[it.id])return;S.srs[it.id]={id:it.id,en:it.en,pr:it.pr,es:it.es,ipa:it.ipa||'',ef:2.5,n:0,int:0,due:Date.now()+(auto?10*60000:0),lapses:0};save();updateHeader()}
function srsDue(){const now=Date.now();return Object.values(S.srs).filter(x=>x.due<=now).sort((a,b)=>a.due-b.due)}
function srsGrade(id,score){const x=S.srs[id];if(!x)return;const q=score>=92?5:score>=82?4:score>=68?3:score>=50?2:1;
 if(q<3){x.n=0;x.int=0;x.lapses++;x.due=Date.now()+10*60000}else{x.n++;x.int=x.n===1?1:x.n===2?3:Math.round(x.int*x.ef);x.due=Date.now()+x.int*DAY}
 x.ef=Math.max(1.3,x.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));today().rev++;save();updateHeader();return x}

/* ---------- Free speech analysis ---------- */
const FILLERS=['um','uh','er','ah','like','you know','i mean','kind of','sort of','basically','actually','so yeah'];
const GRAMMAR=[
 [/\bi have (\w+ )?years( old)?\b/,'Para la edad: "I am 30 (years old)", no "I have 30 years".'],
 [/\b(he|she|it) (have|do|go|want|like|need|work|live|say|know|think)\b/,'Tercera persona: he/she/it + verbo con -s ("she works", "he has", "it goes").'],
 [/\b(he|she|it) do not\b/,'Con he/she/it usa "doesn\'t": "she doesn\'t like…".'],
 [/\bi am agree\b/,'Se dice "I agree", no "I am agree".'],
 [/\bexplain me\b/,'Se dice "explain it to me" o "can you explain…", no "explain me".'],
 [/\bdepends? of\b/,'Se dice "depend on", no "depend of".'],
 [/\bmore (better|worse|easier|bigger|faster|cheaper)\b/,'No uses "more" con comparativos: "better", no "more better".'],
 [/\bpeople is\b|\bpeoples\b/,'"People" ya es plural: "people are".'],
 [/\bthe (life|nature|society|love|money) is\b/,'Para hablar en general no uses "the": "life is…", "money is…".'],
 [/\bmake (a party|homework|my homework|a photo|a picture|a question)\b/,'Collocations: "have a party", "do homework", "take a photo", "ask a question".'],
 [/\bi have (hungry|thirsty|cold|hot|fear|sleep)\b/,'Se usa "be": "I\'m hungry / thirsty / cold / scared / sleepy".'],
 [/\bsince (one|two|three|four|five|six|seven|eight|nine|ten|a) (year|years|month|months|week|weeks|day|days)\b/,'Para duración usa "for": "for five years". "Since" es para un punto de inicio: "since 2020".'],
 [/\bdid (not )?(went|saw|ate|came|had|made|took|got|was|did|bought|said)\b/,'Después de "did" el verbo va en forma base: "did you go?", no "did you went?".'],
 [/\bwhen i will\b/,'Después de "when" para el futuro se usa presente: "when I get there", no "when I will get".'],
 [/\bsay me\b/,'Se dice "tell me", no "say me".'],
 [/\blisten (music|the radio|the song)\b/,'Se dice "listen TO music".'],
 [/\barrive to\b/,'Se dice "arrive at" (lugar) o "arrive in" (ciudad), no "arrive to".'],
 [/\bmarried with\b/,'Se dice "married to".'],
 [/\bdiscuss about\b/,'"Discuss" no lleva "about": "discuss the plan".'],
 [/\bis very (\w+) for me\b/,'Más natural: "It\'s really hard for me" / "I find it…"'],
 [/\bi am (\w+ing) since\b/,'Con "since/for" usa presente perfecto: "I have been working since…".'],
 [/\bassist (to|the) (class|meeting|school)\b/,'Falso amigo: "attend a class/meeting" (asistir), "assist" es ayudar.'],
 [/\bactually\b/,'Ojo: "actually" significa "en realidad", no "actualmente" (= currently / nowadays).'],
];
function analyzeSpeech(text,ms){const raw=' '+text.toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ')+' ';const W=norm(text);const n=W.length;
 const min=Math.max(ms||0,1000)/60000;const wpm=n?Math.min(220,Math.round(n/min)):0;let fill=0;const fl={};FILLERS.forEach(f=>{const m=raw.split(' '+f+' ').length-1;if(m){fill+=m;fl[f]=m}});
 const uniq=new Set(W).size;const ttr=n?uniq/n:0;const gram=GRAMMAR.filter(([re])=>re.test(raw)).map(g=>g[1]);
 const chunks=DATA.idioms.filter(x=>raw.includes(' '+x.en.toLowerCase().replace(/[^a-z' ]/g,'')+' ')).map(x=>x.en);
 let sc=0;sc+=Math.min(wpm,140)/140*35;sc+=Math.min(n,70)/70*30;sc+=Math.min(1,ttr/0.6)*15;sc+=Math.min(10,chunks.length*5);sc+=10;sc-=Math.min(15,fill*2);sc-=Math.min(15,gram.filter(g=>!/actually/.test(g)).length*5);if(n<5)sc=Math.min(sc,15);sc=Math.max(0,Math.min(100,Math.round(sc)));
 const fb=[];
 if(n<15)fb.push('📏 Respuesta muy corta. Intenta hablar al menos 30–40 segundos: da una razón y un ejemplo.');else if(n<40)fb.push('📏 Buena base. Para sonar fluido, extiende: "because…", "for example…", "the thing is…".');else fb.push('📏 ¡Buena extensión! Hablaste bastante.');
 if(wpm&&wpm<80)fb.push(`🐢 Velocidad: ${wpm} palabras/min. Es lento (un nativo conversa a ~120–160). No traduzcas palabra por palabra: usa frases hechas y la técnica 4/3/2.`);else if(wpm<110)fb.push(`🚶 Velocidad: ${wpm} palabras/min. Aceptable; apunta a 110+ uniendo palabras ("gonna", "wanna", "lemme").`);else fb.push(`🚀 Velocidad: ${wpm} palabras/min. ¡Ritmo natural!`);
 if(fill>2)fb.push(`🤐 Muletillas: ${Object.entries(fl).map(([k,v])=>`"${k}"×${v}`).join(', ')}. Mejor haz pausas cortas en silencio o usa "Let me think…".`);
 if(ttr<0.45&&n>25)fb.push('🔁 Repites mucho las mismas palabras. Prueba sinónimos: good → great / awesome / pretty nice.');
 gram.forEach(g=>fb.push('✏️ '+g));
 if(chunks.length)fb.push(`⭐ ¡Usaste expresiones naturales: ${chunks.join(', ')}!`);else fb.push('💡 Intenta meter un modismo de la sección Modismos (ej: "to be honest", "kind of", "I\'m down").');
 return{n,wpm,fill,ttr,gram,chunks,score:sc,fb}}

 'ɑ':['hot','es una a bien abierta, como cuando el doctor te pide decir «aaa»'],
 'ɔ':['law','es una o abierta, con la boca bastante abierta'],
 'ʊ':['book','es una u cortita y floja, sin apretar los labios'],
 'oʊ':['go','es una o que se cierra hacia u, como «ou»'],

 'ʌ':['cup','es una a cortita y relajada, como si dijeras "a" sin ganas'],

 'ɔɪ':['boy','es como el «oi» de «hoy»'],

 'ə':['about','es una vocal muy suave y cortita, casi un murmullo, como una a relajada'],

 'ɛɹ':['hair','es una e que termina en r suave, como «jer»'],
 'ʊɹ':['tour','es una u corta que termina en r suave'],
 'aɪɹ':['fire','es como «ai» y luego una r suave, como «fáier»'],
 'aʊɹ':['hour','es como «au» y luego una r suave, como «áuer»'],
 'ɔɹ':['more','es una o seguida de una r suave, como «mor»'],

 'b':['boy','es una b de verdad: junta bien los dos labios'],
 't':['time','es una t con la lengua arriba de los dientes y un soplidito de aire; entre vocales suena casi como una r suave'],
 'd':['day','es una d con la lengua arriba de los dientes, no entre ellos'],
 'k':['cat','es una k con un soplido de aire al soltarla'],
 'g':['go','es una g fuerte, como en «gato»'],
 'm':['man','es una m normal, cerrando bien los labios'],
 'n':['no','es una n normal; al final de la palabra no la pierdas'],
 'ŋ':['sing','es una n que se hace atrás, en la garganta, como en «tengo»; no agregues una g al final'],
 'f':['fine','es una f normal, con los dientes de arriba tocando el labio de abajo'],
 'v':['very','no es una b: pon los dientes de arriba sobre el labio de abajo y haz vibrar, como una f con voz'],
 'θ':['think','se hace con la lengua entre los dientes, soplando suave, como una ce de España'],
 'ð':['this','se hace con la lengua entre los dientes, pero con voz, como una d muy suave que vibra'],
 's':['see','es una s normal, sin agregar una e antes'],
 'z':['zoo','es una s con voz, que zumba como una abeja'],
 'ʃ':['she','es como cuando pides silencio, «shhh»'],
 'ʒ':['vision','es como el «shhh» pero con voz, como la ll de Argentina'],

 'dʒ':['job','es como una ch pero con voz, como la y fuerte de «yo» en algunos países'],

 'ɹ':['red','no es la r española: la lengua no toca nada, se recoge un poco hacia atrás']};

/* split Spanish speech so that quoted English words/phrases are read by the English voice */
function ttsSegments(t,lang='es'){const s=ttsClean(t,lang);if(lang!=='es')return s?[{lang:'en',text:s.replace(/["“”«»]/g,'')}]:[];
 const out=[];const re=/["“”]([^"“”]{1,80})["“”]/g;let last=0,m;
 const isEn=x=>(x==='I'||x.length>=2&&/[aeiouy]/i.test(x)&&!x.split(/[\s,.!?]+/).some(w=>ES_ONLY.has(w.toLowerCase())))&&/^[A-Za-z][A-Za-z' ,.!?\-]*$/.test(x)&&!x.split(/\s+/).every(w=>ES_WORDS.has(w.toLowerCase()))&&(x==='I'||!/^(?:[aeiou]|sh+|a+|s+i+)$/i.test(x.trim()));
 while((m=re.exec(s))){const pre=s.slice(last,m.index);if(isEn(m[1].trim())){if(pre.trim())out.push({lang:'es',text:pre.trim()});out.push({lang:'en',text:m[1].trim()})}else{out.push({lang:'es',text:(pre+m[1]).trim()})}last=re.lastIndex}
 const rest=s.slice(last).trim();if(rest)out.push({lang:'es',text:rest});
 const merged=[];for(const x of out){x.text=x.text.replace(/["“”«»]/g,'').trim();if(!x.text||/^[,.;:!?\s]+$/.test(x.text))continue;const p=merged[merged.length-1];if(p&&p.lang===x.lang)p.text+=' '+x.text;else merged.push(x)}
 return merged}

 quiz:[['I am ___ teacher.',['—','a','an'],1,'Profesión con a/an: I\'m a teacher.'],['___ money is not everything.',['The','—','A'],1,'En general, sin the.'],['It\'s ___ honor.',['a','an','the'],1,'Honor empieza con sonido de vocal (h muda): an.']]},
{id:'pres',lvl:'A1',t:'Presente simple · do / does / don\'t / doesn\'t · tercera persona -s',sum:'El presente simple es para rutinas y verdades. Con he, she e it el verbo lleva s: she works. Para preguntas usa do o does, y para negar don\'t o doesn\'t. Ojo con la pronunciación: do se dice duu, does se dice das, y doesn\'t se dice dázant. Después de does o doesn\'t, el verbo va sin s.',
 pts:['I/you/we/they <b>work</b> · he/she/it <b>works</b> (uérks).','Pregunta: <b>Do</b> you work? (du yu) · <b>Does</b> she work? (daz shi) — el verbo pierde la -s.','Negativo: I <b>don\'t</b> (dóunt) like it · He <b>doesn\'t</b> (dázant) like it.','🔊 <b>do</b> /duː/ = "duu" · <b>does</b> /dʌz/ = "daz" (¡no "dous"!) · <b>don\'t</b> /doʊnt/ = "dóunt" · <b>doesn\'t</b> /ˈdʌzənt/ = "dázant".','Irregulares: have → <b>has</b> (jæz), go → <b>goes</b> (góuz), do → <b>does</b> (daz).','❌ "She don\'t like" → ✅ "She doesn\'t like". ❌ "Does he works?" → ✅ "Does he work?"'],
 ex:[['She works in a hospital.','shi uérks in a jóspital.','Ella trabaja en un hospital.'],['Do you speak English?','du yu spíik ínglish?','¿Hablas inglés?'],['Does he live here?','daz ji liv jíer?','¿Él vive aquí?'],['I don\'t drink coffee.','ai dóunt drink kófi.','No tomo café.'],['My brother doesn\'t eat meat.','mai bráder dázant íit míit.','Mi hermano no come carne.'],['He has two kids.','ji jæz tuu kidz.','Él tiene dos hijos.']],
 quiz:[['She ___ in Texas.',['live','lives','living'],1,'He/she/it + verbo con -s.'],['___ he like pizza?',['Do','Does','Is'],1,'Con he/she/it la pregunta usa does.'],['He doesn\'t ___ English.',['speaks','speak','speaking'],1,'Después de doesn\'t el verbo va sin -s.']]},
{id:'spron',lvl:'A1',t:'Pronunciación de la -s final (/s/, /z/, /ɪz/)',sum:'La s final de plurales y de la tercera persona tiene tres sonidos. Suena s después de sonidos sordos como p, t, k, f: works, cats. Suena z, como abeja, después de sonidos con voz y vocales: plays, dogs. Y suena iz después de s, z, sh, ch, y dy: watches, buses.',
 pts:['<b>/s/</b> tras p, t, k, f, θ: works (uérks), cats (kæts), stops.','<b>/z/</b> (zumbido) tras vocales y sonidos sonoros b, d, g, l, m, n, r, v: plays (pléiz), dogs (dogz), lives (livz).','<b>/ɪz/</b> (una sílaba más) tras s, z, sh, ch, dʒ: watches (uáchiz), buses (básiz), changes (chéindyiz).','Lo mismo para posesivos: Tom\'s (tamz), Mike\'s (máiks).'],
 ex:[['He works and plays.','ji uérks ænd pléiz.','Él trabaja y juega.'],['She watches the news.','shi uáchiz dha nuuz.','Ella ve las noticias.'],['My dogs love cats.','mai dogz lav kæts.','Mis perros aman a los gatos.'],['It changes every day.','it chéindyiz évri déi.','Cambia todos los días.']],
 quiz:[['¿Cómo suena la -s de "plays"?',['/s/','/z/','/ɪz/'],1,'Después de vocal suena /z/.'],['¿Y la de "watches"?',['/s/','/z/','/ɪz/'],2,'Después de ch se agrega una sílaba: /ɪz/.'],['¿Y la de "works"?',['/s/','/z/','/ɪz/'],0,'Después de k (sorda) suena /s/.']]},
{id:'cont',lvl:'A1',t:'Presente continuo (estoy haciendo)',sum:'El presente continuo es para lo que pasa ahora mismo o planes cercanos. Se forma con am, is o are más el verbo con ing: I am working, she is eating. La terminación ing se dice como "ing" con la n por la nariz, sin pronunciar una g fuerte.',
 pts:['am/is/are + verbo-<b>ing</b>: I\'m working, she\'s eating, they\'re playing.','Ahora mismo: "What <b>are you doing</b>?" · Planes: "I\'<b>m meeting</b> him tomorrow".','Rutina = presente simple; ahora = continuo: "I work every day, but today I\'m resting".','Pronunciación: -ing /ɪŋ/ → "in(g)" suave por la nariz.','Verbos de estado casi no van en -ing: know, like, want, need ("I want", no "I\'m wanting").'],
 ex:[['What are you doing?','uát ar yu dúuing?','¿Qué estás haciendo?'],['I\'m cooking dinner.','aim kúking díner.','Estoy haciendo la cena.'],['She\'s talking on the phone.','shiz tóking on dha fóun.','Ella está hablando por teléfono.'],['We\'re meeting tomorrow.','uír míiting tumárou.','Nos vemos mañana.'],['It\'s raining right now.','its réining ráit náu.','Está lloviendo ahora mismo.']],
 quiz:[['Listen! The baby ___.',['cries','is crying','cry'],1,'Ahora mismo → presente continuo.'],['I ___ the answer.',['am knowing','know','knowing'],1,'"Know" es verbo de estado: I know.'],['They ___ TV now.',['watch','are watching','is watching'],1,'They + are + -ing.']]},
{id:'qn',lvl:'A2',t:'Preguntas y negativos',sum:'Para preguntar en inglés casi siempre necesitas un auxiliar antes del sujeto: do, does, did, is, are, can, will. Por ejemplo: Where do you live? Para negar, el not va con el auxiliar: I don\'t know, she can\'t come.',
 pts:['Orden: (Wh-) + auxiliar + sujeto + verbo: "<b>Where do you</b> work?", "<b>What did she</b> say?"','Con be no hace falta do: "Where <b>are you</b>?"','Palabras Wh-: what (uát), where (uér), when (uén), why (uái), who (juu), how (jáu), how much / how many.','Negativo: auxiliar + not: don\'t, doesn\'t, didn\'t, isn\'t, can\'t (kænt), won\'t (uóunt).','❌ "Where you live?" → ✅ "Where do you live?"','Doble negación no: ❌ "I don\'t know nothing" → ✅ "I don\'t know anything".'],
 ex:[['Where do you live?','uér du yu liv?','¿Dónde vives?'],['What did she say?','uát did shi séi?','¿Qué dijo ella?'],['How much is it?','jáu mach iz it?','¿Cuánto cuesta?'],['I don\'t know anything.','ai dóunt nóu éniding.','No sé nada.'],['Why can\'t you come?','uái kænt yu kam?','¿Por qué no puedes venir?']],
 quiz:[['Where ___ you work?',['—','do','does'],1,'Falta el auxiliar: Where do you work?'],['She ___ come yesterday.',['didn\'t','doesn\'t','don\'t'],0,'Ayer → pasado → didn\'t.'],['I don\'t have ___.',['nothing','anything','no'],1,'Con negativo usa anything.']]},
{id:'ptime',lvl:'A1',t:'Preposiciones de tiempo: in / on / at',sum:'Para el tiempo: at es para horas exactas, at seven. On es para días y fechas, on Monday. In es para meses, años, estaciones y partes del día: in July, in the morning. Pero se dice at night.',
 pts:['<b>at</b> + hora: at 7:00, at noon, <b>at night</b>, at the weekend (británico).','<b>on</b> + día/fecha: on Monday, on May 5th, on my birthday, on the weekend (EE. UU.).','<b>in</b> + mes/año/estación/parte del día: in July, in 2026, in summer, in the morning.','<b>in</b> + periodo futuro: "I\'ll be back <b>in</b> ten minutes" (dentro de).','Sin preposición: today, tomorrow, yesterday, next week, last year, every day.'],
 ex:[['The meeting is at nine.','dha míiting iz at náin.','La reunión es a las nueve.'],['I was born in 1990.','ai uás born in náintiin náinti.','Nací en 1990.'],['See you on Monday.','síi yu on mándei.','Nos vemos el lunes.'],['I work in the morning.','ai uérk in dha mórning.','Trabajo en la mañana.'],['I\'ll call you in ten minutes.','ail kol yu in ten mínits.','Te llamo en diez minutos.']],
 quiz:[['My birthday is ___ June.',['on','in','at'],1,'Meses con in.'],['The class starts ___ 8:30.',['in','on','at'],2,'Horas con at.'],['See you ___ Friday.',['in','on','at'],1,'Días con on.']]},
{id:'pplace',lvl:'A1',t:'Preposiciones de lugar: in / on / at',sum:'Para lugares: in es dentro de algo, in the car, in Venezuela. On es sobre una superficie, on the table, y también on the bus. At es un punto o lugar específico: at home, at work, at the door.',
 pts:['<b>in</b> = dentro: in the box, in the car, in Texas, in the kitchen.','<b>on</b> = sobre una superficie: on the table, on the wall, on the floor; transporte grande: on the bus, on the plane.','<b>at</b> = punto o sitio de actividad: <b>at home</b>, at work, at school, at the airport, at the door.','Direcciones: <b>on</b> Main Street, <b>at</b> 25 Main Street.','En español todo es "en"; en inglés elige según la idea.'],
 ex:[['I\'m at home.','aim at jóum.','Estoy en casa.'],['The keys are on the table.','dha kíiz ar on dha téibal.','Las llaves están en la mesa.'],['She lives in Houston.','shi livz in jiúston.','Ella vive en Houston.'],['I\'m on the bus.','aim on dha bas.','Voy en el autobús.'],['Wait for me at the door.','uéit for mi at dha dor.','Espérame en la puerta.']],
 quiz:[['I\'m ___ work right now.',['in','on','at'],2,'Lugar de actividad: at work.'],['The picture is ___ the wall.',['in','on','at'],1,'Superficie: on the wall.'],['He lives ___ Chicago.',['in','on','at'],0,'Ciudades: in.']]},
{id:'past',lvl:'A2',t:'Pasado simple · -ed y did / didn\'t',sum:'El pasado simple es para acciones terminadas: yesterday I worked. Los verbos regulares terminan en ed. Para preguntar usa did, did you work?, y para negar didn\'t, I didn\'t work. Después de did y didn\'t el verbo vuelve a su forma base.',
 pts:['Regular: work → <b>worked</b>, play → <b>played</b>, study → <b>studied</b>.','Pregunta: <b>Did</b> you go? · Negativo: I <b>didn\'t</b> (dídant) go.','❌ "Did you went?" → ✅ "Did you go?" · ❌ "I didn\'t saw" → ✅ "I didn\'t see".','Muchos verbos comunes son irregulares (go → went): mira la tabla de verbos irregulares.','Marcadores: yesterday, last week, ago (two days ago), in 2020.'],
 ex:[['I worked yesterday.','ai uérkt iésterdei.','Trabajé ayer.'],['Did you call her?','did yu kol jer?','¿La llamaste?'],['We didn\'t go out.','uí dídant góu áut.','No salimos.'],['She studied a lot.','shi stádid a lat.','Ella estudió mucho.'],['They arrived two hours ago.','dhei aráivd tuu áuerz agóu.','Llegaron hace dos horas.']],
 quiz:[['Did you ___ the movie?',['saw','see','seen'],1,'Después de did: forma base.'],['I ___ TV last night.',['watch','watched','watching'],1,'Pasado regular: watched.'],['She ___ come to class.',['didn\'t','don\'t','wasn\'t'],0,'Negativo pasado: didn\'t + base.']]},
{id:'edpron',lvl:'A2',t:'Pronunciación de -ed (/t/, /d/, /ɪd/)',sum:'La terminación ed casi nunca se dice "ed". Suena t después de sonidos sordos: worked se dice uérkt. Suena d después de sonidos con voz: played se dice pléid. Y solo suena id después de t o d: wanted, needed.',
 pts:['<b>/t/</b> tras p, k, f, s, sh, ch, θ: worked (uérkt), stopped (stapt), watched (uácht), laughed (læft).','<b>/d/</b> tras vocales y sonidos sonoros: played (pléid), called (kold), lived (livd), opened (óupand).','<b>/ɪd/</b> (sílaba extra) SOLO tras t o d: wanted (uántid), needed (níidid), started (stártid).','Error típico: decir "work-ed", "play-ed". ¡No agregues sílaba!'],
 ex:[['I worked all day.','ai uérkt ol déi.','Trabajé todo el día.'],['We played soccer.','uí pléid sáker.','Jugamos fútbol.'],['She wanted to stay.','shi uántid tu stéi.','Ella quería quedarse.'],['He watched a movie.','ji uácht a múuvi.','Él vio una película.'],['They needed help.','dhei níidid jelp.','Necesitaban ayuda.']],
 quiz:[['"worked" suena…',['uérk-ed','uérkt','uérkid'],1,'Tras k suena /t/.'],['"wanted" suena…',['uántid','uánt','uántd'],0,'Tras t se agrega /ɪd/.'],['"played" suena…',['pléied','pléit','pléid'],2,'Tras vocal suena /d/.']]},
{id:'pcont',lvl:'A2',t:'Pasado continuo (estaba haciendo)',sum:'El pasado continuo describe algo que estaba pasando en un momento del pasado. Se forma con was o were más el verbo con ing: I was sleeping. Muchas veces se interrumpe con un pasado simple: I was sleeping when you called.',
 pts:['was/were + -ing: I <b>was</b> working, they <b>were</b> eating.','Acción interrumpida: "I <b>was cooking</b> when the phone <b>rang</b>".','Dos acciones a la vez: "<b>While</b> I was driving, she was sleeping".','Pronunciación: was = "uás" (débil: "uaz"), were = "uér".'],
 ex:[['I was sleeping when you called.','ai uás slíiping uén yu kold.','Estaba dormido cuando llamaste.'],['What were you doing?','uát uér yu dúuing?','¿Qué estabas haciendo?'],['It was raining all night.','it uás réining ol náit.','Estuvo lloviendo toda la noche.'],['We were watching TV.','uí uér uáching tiví.','Estábamos viendo la tele.']],
 quiz:[['I ___ dinner when he arrived.',['cooked','was cooking','am cooking'],1,'Acción en progreso interrumpida: was cooking.'],['They ___ playing.',['was','were','are'],1,'They + were.']]},
{id:'irreg',lvl:'A2',t:'Los 80 verbos irregulares más comunes',sum:'Los verbos más usados del inglés son irregulares: go, went, gone. Apréndelos en grupos de cinco, en voz alta y con su pronunciación. Abajo tienes la tabla completa con audio.',
 pts:['Columna 1 = base (presente), 2 = pasado simple, 3 = participio (para have + participio).','Apréndelos por grupos que suenan parecido: sing-sang-sung, ring-rang-rung, drink-drank-drunk.','Toca 🔊 en cada fila y repite los tres en voz alta.'],
 ex:[['I went to the store.','ai uént tu dha stor.','Fui a la tienda.'],['She told me the truth.','shi tóuld mi dha truuth.','Ella me dijo la verdad.'],['We bought a new car.','uí bot a nuu kar.','Compramos un carro nuevo.'],['I have seen that movie.','ai jæv síin dhat múuvi.','He visto esa película.'],['He forgot my name.','ji forgát mai néim.','Él olvidó mi nombre.']],
 quiz:[['Past of "buy":',['buyed','bought','brought'],1,'buy → bought → bought (bot).'],['Past of "think":',['thinked','thought','taught'],1,'think → thought (thot).'],['Participle of "go":',['went','gone','goed'],1,'go → went → gone.']]},
{id:'fut',lvl:'A2',t:'Futuro: will y going to',sum:'Para el futuro tienes dos formas. Going to es para planes que ya decidiste: I\'m going to travel. Will es para decisiones en el momento, promesas y predicciones: I\'ll help you. Al hablar rápido, going to suena "góna".',
 pts:['<b>going to</b> = plan/intención: "I\'m <b>going to</b> study tonight" (hablado: "gonna" = góna).','<b>will</b> = decisión al momento, promesa, oferta: "I\'<b>ll</b> call you", "I <b>won\'t</b> (uóunt) tell anyone".','Predicción con evidencia → going to: "Look at the clouds! It\'s going to rain".','Después de will: verbo base: ❌ "I will to go" → ✅ "I will go".','Con when/if usa presente: ✅ "When I <b>get</b> home, I\'ll call you" (no "when I will get").'],
 ex:[['I\'m going to travel next month.','aim góuing tu trável nekst manth.','Voy a viajar el próximo mes.'],['I\'ll help you.','ail jelp yu.','Te ayudo.'],['It\'s going to rain.','its góna réin.','Va a llover.'],['I won\'t forget.','ai uóunt forgét.','No lo olvidaré.'],['When I get home, I\'ll call you.','uén ai guet jóum, ail kol yu.','Cuando llegue a casa, te llamo.']],
 quiz:[['The phone is ringing. — I ___ get it!',['\'ll','am going to','will to'],0,'Decisión al momento: I\'ll.'],['When I ___ there, I\'ll text you.',['will get','get','got'],1,'Después de when va presente.'],['I ___ visit my mom this weekend (ya lo planeé).',['will','am going to','going'],1,'Plan decidido: going to.']]},
{id:'comp',lvl:'A2',t:'Comparativos y superlativos',sum:'Para comparar: palabras cortas llevan er y than, bigger than. Palabras largas usan more, more expensive than. Para el máximo: the biggest, the most expensive. Irregulares: good, better, the best. Bad, worse, the worst.',
 pts:['Cortas: tall → <b>taller than</b> → <b>the tallest</b>; big → bigger (dobla la consonante).','Terminadas en -y: easy → <b>easier</b> → the easiest.','Largas: <b>more</b> interesting <b>than</b> → <b>the most</b> interesting.','Irregulares: good → <b>better</b> → <b>the best</b>; bad → <b>worse</b> (uérs) → <b>the worst</b>; far → farther.','❌ "more better" → ✅ "better". Igualdad: "as tall <b>as</b>".','than se dice "dhan" (débil: "dhen").'],
 ex:[['My brother is taller than me.','mai bráder iz tóler dhan mi.','Mi hermano es más alto que yo.'],['This is the best pizza in town.','dhis iz dha best píitsa in táun.','Esta es la mejor pizza del pueblo.'],['English is easier than I thought.','ínglish iz íizier dhan ai thot.','El inglés es más fácil de lo que pensaba.'],['It\'s more expensive than before.','its mor ikspénsiv dhan bifór.','Es más caro que antes.'],['Today is worse than yesterday.','tudéi iz uérs dhan iésterdei.','Hoy está peor que ayer.']],
 quiz:[['This car is ___ than mine.',['more fast','faster','fastest'],1,'Palabra corta: faster than.'],['She is the ___ student.',['better','best','most good'],1,'Superlativo de good: the best.'],['It\'s ___ than I expected.',['more better','better','gooder'],1,'Nunca "more better".']]},
{id:'modal',lvl:'B1',t:'Modales: can, could, should, must, would, might',sum:'Los modales cambian el sentido del verbo. Can es poder, could es podría o pude, should es debería, must es deber obligatorio, would es el condicional o para pedir con cortesía, y might es quizás. Después de un modal el verbo va en forma base, sin to y sin s.',
 pts:['<b>can</b> (kæn) = poder/saber · <b>can\'t</b> (kænt) = no poder.','<b>could</b> (kud, la l es muda) = podría / pude / petición cortés: "Could you help me?"','<b>should</b> (shud) = debería (consejo): "You should rest".','<b>must</b> = obligación fuerte o deducción: "You must wear a seatbelt".','<b>would</b> (uud) = -ría: "I would like…" = "I\'d like…" (me gustaría).','<b>might</b> (máit) = quizás: "It might rain".','Reglas: modal + base. ❌ "She cans", "I must to go" → ✅ "She can", "I must go".'],
 ex:[['Can you speak slowly?','kæn yu spíik slóuli?','¿Puedes hablar despacio?'],['Could you help me, please?','kud yu jelp mi, plíiz?','¿Podrías ayudarme, por favor?'],['You should drink more water.','yu shud drink mor uóter.','Deberías tomar más agua.'],['I\'d like a coffee, please.','aid láik a kófi, plíiz.','Me gustaría un café, por favor.'],['It might rain later.','it máit réin léiter.','Quizás llueva más tarde.'],['You must wear a seatbelt.','yu mast uér a síitbelt.','Debes usar el cinturón.']],
 quiz:[['You ___ see a doctor (consejo).',['should','might','can'],0,'Consejo = should.'],['She ___ swim very well.',['cans','can','can to'],1,'Modal sin -s y sin to.'],['___ you open the window, please?',['Must','Could','Should'],1,'Petición cortés: Could you…?']]},
{id:'pperf',lvl:'B1',t:'Presente perfecto (have + participio)',sum:'El presente perfecto conecta el pasado con el presente. Se forma con have o has más el participio: I have lived here for five years. Se usa para experiencias, con ever y never, y con for y since. Si dices cuándo pasó, como yesterday, usa pasado simple.',
 pts:['have/has + participio: I <b>have worked</b>, she <b>has been</b>, they <b>have seen</b>.','Experiencias: "<b>Have you ever been</b> to New York?" "I\'ve <b>never</b> tried sushi".','Duración hasta hoy: <b>for</b> + tiempo (for five years) · <b>since</b> + punto de inicio (since 2020).','❌ "I live here since 2020" → ✅ "I <b>have lived</b> here since 2020".','Con tiempo terminado usa pasado: ❌ "I have seen him yesterday" → ✅ "I saw him yesterday".','just / already / yet: "I\'ve <b>just</b> arrived", "Have you finished <b>yet</b>?"'],
 ex:[['I have lived here for five years.','ai jæv livd jíer for fáiv yíerz.','Vivo aquí desde hace cinco años.'],['Have you ever been to New York?','jæv yu éver bin tu nuu york?','¿Alguna vez has estado en Nueva York?'],['She has never tried sushi.','shi jæz néver tráid súushi.','Ella nunca ha probado el sushi.'],['I\'ve just finished.','aiv dyast fínisht.','Acabo de terminar.'],['We have known each other since 2015.','uí jæv nóun íich ádher sins tuénti fiftíin.','Nos conocemos desde 2015.']],
 quiz:[['I ___ here since 2019.',['live','have lived','lived'],1,'Desde un punto hasta hoy: have lived.'],['She has worked here ___ ten years.',['since','for','from'],1,'Duración: for.'],['I ___ him yesterday.',['have seen','saw','seen'],1,'Tiempo terminado (yesterday): pasado simple.']]},
{id:'prep2',lvl:'B1',t:'Preposiciones: to / for, of / from, by / with, about',sum:'Algunas preposiciones confunden mucho. To indica dirección o destino, go to work. For es para, o durante un tiempo, for two hours. Of es de, como parte o pertenencia, a cup of coffee. From es de origen, I\'m from Venezuela. By es por o junto a, by car. With es con. About es sobre o acerca de.',
 pts:['<b>to</b> = a/hacia (destino): go <b>to</b> work, talk <b>to</b> me. <b>for</b> = para/por (propósito, beneficiario, duración): a gift <b>for</b> you, <b>for</b> two hours.','❌ "I came here for study" → ✅ "I came here <b>to</b> study" (para + verbo = <b>to</b>).','<b>of</b> = de (parte, contenido): a cup <b>of</b> coffee, the end <b>of</b> the movie. <b>from</b> = de (origen, desde): I\'m <b>from</b> Venezuela, <b>from</b> 9 <b>to</b> 5.','<b>by</b> = en (medio de transporte), por (autor), junto a, para (fecha límite): <b>by</b> car, <b>by</b> Friday, a book <b>by</b> Coelho. <b>with</b> = con: <b>with</b> my friends.','<b>about</b> = sobre/acerca de: talk <b>about</b>, think <b>about</b>, a movie <b>about</b> love.'],
 ex:[['I came here to study.','ai kéim jíer tu stádi.','Vine aquí a estudiar.'],['This gift is for you.','dhis guift iz for yu.','Este regalo es para ti.'],['I\'m from Venezuela.','aim from venesuéila.','Soy de Venezuela.'],['I go to work by car.','ai góu tu uérk bai kar.','Voy al trabajo en carro.'],['Let\'s talk about it.','lets tok abáut it.','Hablemos de eso.'],['I need it by Friday.','ai níid it bai fráidei.','Lo necesito para el viernes.']],
 quiz:[['I went there ___ buy food.',['for','to','for to'],1,'Para + verbo = to.'],['We traveled ___ bus.',['with','in','by'],2,'Medio de transporte: by bus.'],['What is the movie ___?',['of','about','from'],1,'Tema: about.']]},
{id:'prep3',lvl:'B1',t:'Verbo + preposición y adjetivo + preposición',sum:'Muchos verbos y adjetivos van con una preposición fija que no siempre coincide con el español. Por ejemplo: depend on, no depend of. Listen to music. Wait for. Married to. Interested in. Good at. Afraid of. Apréndelas como bloques.',
 pts:['Verbo + prep: <b>depend on</b> · <b>listen to</b> · <b>wait for</b> · <b>look for</b> (buscar) · <b>look at</b> (mirar) · <b>ask for</b> (pedir) · <b>pay for</b> · <b>think about/of</b> · <b>dream about</b> · <b>arrive at/in</b> · <b>belong to</b> · <b>agree with</b> · <b>apply for</b> · <b>talk to</b>.','Sin preposición (falsos amigos): <b>discuss</b> (no "discuss about"), <b>call</b> someone (no "call to"), <b>enter</b> a room, <b>marry</b> someone.','Adjetivo + prep: <b>interested in</b> · <b>good at</b> · <b>bad at</b> · <b>afraid of</b> · <b>tired of</b> · <b>proud of</b> · <b>married to</b> · <b>different from</b> · <b>similar to</b> · <b>angry with/at</b> · <b>excited about</b> · <b>worried about</b> · <b>responsible for</b> · <b>famous for</b>.','Después de preposición, verbo con -ing: "I\'m good at <b>cooking</b>", "Thanks for <b>helping</b>".'],
 ex:[['It depends on the weather.','it dipéndz on dha uéder.','Depende del clima.'],['I\'m listening to music.','aim lísening tu miúzik.','Estoy escuchando música.'],['We\'re waiting for the bus.','uír uéiting for dha bas.','Estamos esperando el autobús.'],['She is married to a doctor.','shi iz mérid tu a dákter.','Ella está casada con un doctor.'],['I\'m interested in history.','aim íntrestid in jístori.','Me interesa la historia.'],['He\'s really good at cooking.','jiz ríli gud at kúking.','Él es muy bueno cocinando.']],
 quiz:[['It depends ___ you.',['of','on','from'],1,'depend on.'],['I\'m afraid ___ dogs.',['to','of','from'],1,'afraid of.'],['Let\'s discuss ___ the plan.',['about','—','of'],1,'discuss no lleva preposición.']]},
{id:'phrasal',lvl:'B1',t:'Phrasal verbs esenciales',sum:'Los phrasal verbs son verbo más partícula, y cambian el significado: get up es levantarse, give up es rendirse, find out es descubrir. Los nativos los usan todo el tiempo, así que apréndelos con ejemplos.',
 pts:['<b>get up</b> levantarse · <b>wake up</b> despertar · <b>give up</b> rendirse/dejar · <b>find out</b> enterarse · <b>look for</b> buscar · <b>look after</b> cuidar · <b>turn on/off</b> encender/apagar · <b>pick up</b> recoger/contestar · <b>come back</b> regresar · <b>go out</b> salir · <b>figure out</b> descifrar · <b>run out of</b> quedarse sin · <b>hang out</b> pasar el rato · <b>show up</b> aparecer · <b>work out</b> hacer ejercicio / resolverse · <b>take off</b> despegar/quitarse · <b>put on</b> ponerse · <b>call back</b> devolver la llamada.','Con objeto: "Turn <b>it</b> off" (el pronombre va en medio).','La partícula suele llevar el acento: "get ÚP", "find ÁUT".'],
 ex:[['I get up at six.','ai guet áp at siks.','Me levanto a las seis.'],['Don\'t give up!','dóunt guiv áp!','¡No te rindas!'],['I found out the truth.','ai fáund áut dha truuth.','Me enteré de la verdad.'],['Can you pick me up?','kæn yu pik mi áp?','¿Puedes recogerme?'],['We ran out of milk.','uí ræn áut av milk.','Se nos acabó la leche.'],['Please turn it off.','plíiz tern it óf.','Por favor, apágalo.']],
 quiz:[['"Rendirse" =',['give up','give in to','get up'],0,'give up.'],['I\'m ___ my keys (buscando).',['looking after','looking for','looking at'],1,'look for = buscar.'],['Turn ___ off.',['off it','it','it off'],2,'El pronombre va en medio: turn it off.']]},
{id:'cond',lvl:'B2',t:'Condicionales (0, 1, 2, 3)',sum:'Los condicionales usan if. Tipo cero, verdades: if you heat ice, it melts. Tipo uno, futuro real: if it rains, I will stay home. Tipo dos, situaciones imaginarias: if I had money, I would travel. Tipo tres, el pasado que no pasó: if I had studied, I would have passed.',
 pts:['<b>0</b>: if + presente, presente → "If you heat ice, it melts".','<b>1</b>: if + presente, will + base → "If it <b>rains</b>, I\'<b>ll</b> stay home" (¡no "if it will rain"!).','<b>2</b>: if + pasado, would + base → "If I <b>had</b> money, I <b>would</b> travel". Con be: "If I <b>were</b> you…".','<b>3</b>: if + had + participio, would have + participio → "If I <b>had studied</b>, I <b>would have passed</b>" (hablado: "would\'ve" = uúdav).','unless = a menos que: "I won\'t go unless you come".'],
 ex:[['If it rains, I\'ll stay home.','if it réinz, ail stéi jóum.','Si llueve, me quedo en casa.'],['If I had more time, I would learn guitar.','if ai jæd mor táim, ai uud lern guitár.','Si tuviera más tiempo, aprendería guitarra.'],['If I were you, I would call her.','if ai uér yu, ai uud kol jer.','Yo que tú, la llamaría.'],['If I had studied, I would have passed.','if ai jæd stádid, ai uúdav pæst.','Si hubiera estudiado, habría pasado.'],['If you heat ice, it melts.','if yu jíit áis, it melts.','Si calientas el hielo, se derrite.']],
 quiz:[['If it ___ tomorrow, we\'ll cancel.',['will rain','rains','rained'],1,'Condicional 1: if + presente.'],['If I ___ rich, I would buy a house.',['am','were','will be'],1,'Condicional 2: if + pasado (were).'],['If she had called, I ___ answered.',['would','would have','will have'],1,'Condicional 3: would have + participio.']]}
];

function phSpans(word,phon){const L=String(word||'').toLowerCase(),n=L.length,m=(phon||[]).length;if(!n||!m)return[];
 const INF=1e9,C=[...Array(n+1)].map(()=>Array(m+1).fill(INF)),B=[...Array(n+1)].map(()=>Array(m+1).fill(null));C[0][0]=0;
 for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){const c=C[i][j];if(c>=INF)continue;
  if(i<n){const k=c+(L[i]==='e'&&i===n-1?0.3:/[^a-z]/.test(L[i])?0:1.2);if(k<C[i+1][j]){C[i+1][j]=k;B[i+1][j]=[i,j,0]}}

   for(const pt of gpPats(phon[j].p)){if(L.startsWith(pt,i)){const k2=c+(pt.length>1?0:0.1);if(k2<C[i+pt.length][j+1]){C[i+pt.length][j+1]=k2;B[i+pt.length][j+1]=[i,j,1]}}}
   if(i<n){const k3=c+2;if(k3<C[i+1][j+1]){C[i+1][j+1]=k3;B[i+1][j+1]=[i,j,1]}}}}
 const sp=Array(m).fill(null);let i=n,j=m;while(i>0||j>0){const b=B[i][j];if(!b)break;if(b[2]&&j>b[1])sp[b[1]]=[b[0],i];i=b[0];j=b[1]}return sp}

function wordHL(w,T){T=T||S.settings.threshold||80;const word=w.w||'';if(w.err==='Omission')return `<span class="hlw omit">${esc(word)}</span>`;
 const sp=phSpans(word,w.phon||[]);const bad=new Array(word.length).fill(0);(w.phon||[]).forEach((x,k)=>{const s=sp[k];if(!s)return;const lv=x.acc<60?2:x.acc<T?1:0;for(let q=s[0];q<s[1];q++)bad[q]=Math.max(bad[q],lv)});
 let h='',cur=-1;for(let q=0;q<word.length;q++){if(bad[q]!==cur){if(cur>0)h+='</b>';cur=bad[q];if(cur>0)h+=`<b class="${cur===2?'lbad':'lmid'}">`}h+=esc(word[q])}if(cur>0)h+='</b>';return `<span class="hlw">${h}</span>`}

/* ---- prosody coaching: one concrete tip ---- */
const FUNC=new Set('a an the to of in on at for and or but is am are was were be been do does did have has had i you he she it we they me him her us them my your his its our their this that these those can could will would should must might not with from by about as so if than then there here up out just very really'.split(' '));

function stressWord(ws){const c=ws.filter(w=>!FUNC.has(w.toLowerCase())&&w.length>1);return c[c.length-1]||ws[ws.length-1]}
function linkPair(ws){for(let i=0;i<ws.length-1;i++){const a=ws[i],b=ws[i+1];if(/[bcdfgklmnprstvxz]$/i.test(a)&&/^[aeiou]/i.test(b)&&a.length>1)return[a,b]}return null}
function reduction(t){const s=' '+t.toLowerCase()+' ';
 if(/ going to /.test(s))return['going to','casi como gonna, en plática informal'];if(/ want to /.test(s))return['want to','casi como wanna, en plática informal'];
 if(/ have to /.test(s))return['have to','casi como jafta'];if(/ to /.test(s))return['to','suavecito, casi ta'];if(/ and /.test(s))return['and','cortito, casi en'];if(/ of /.test(s))return['of','suavecito, casi a'];if(/ for /.test(s))return['for','cortito, casi fer'];return null}
function prosodyTip(r,text){if(!r||!r.words||!r.words.length)return null;const W=r.words.filter(w=>w.err!=='Insertion'&&w.w);if(W.length<2)return null;const ws=W.map(w=>/^i$/i.test(w.w)?'I':w.w);
 const t=String(text||ws.join(' ')).trim();const first=ws[0].toLowerCase();const isYN=YN.has(first)&&(/\?\s*$/.test(t)||!/[.!]$/.test(t));const isWH=WH.has(first);
 const p=r.pa||{};const chunkAt=i=>ws.slice(Math.max(0,i-2),Math.min(ws.length,i+3)).join(' ');const whole=ws.slice(0,8).join(' ');
 const br=W.findIndex((w,i)=>i>0&&(w.brk||[]).includes('UnexpectedBreak'));
 if(br>0)return{kind:'link',say:`Hiciste una pausita antes de "${ws[br]}". Júntala con la anterior, como si fuera una sola palabra: "${ws[br-1]} ${ws[br]}".`,html:`⏸️ Pausa de más antes de <b>${esc(ws[br])}</b>: júntala con <b>${esc(ws[br-1])}</b>.`,chunk:chunkAt(br)};

 if(mono||(p.pros!=null&&p.pros<65)){

  return{kind:'stress',say:`Tu voz sonó un poquito plana. ${isWH?'En preguntas con what, where o how, la voz baja al final.':'Al afirmar algo, la voz baja al final.'} Y dale fuerza a "${sw}". Escúchame:`,html:`🎵 Dale fuerza a <b>${esc(sw)}</b> y baja la voz al final.`,chunk:whole,mark:{word:sw,kind:'stress'}}}

  const lp=linkPair(ws);if(lp)return{kind:'link',say:`Junta "${lp[0]}" con "${lp[1]}", que suene como una sola palabra. Escúchame:`,html:`🔗 Junta <b>${esc(lp[0])} ${esc(lp[1])}</b>.`,chunk:chunkAt(ws.indexOf(lp[1]))};}
 const mb=W.findIndex(w=>(w.brk||[]).includes('MissingBreak'));if(mb>=0&&mb<ws.length-1)return{kind:'pause',say:`Haz una pausita natural después de "${ws[mb]}", como cuando respiras entre ideas.`,html:`↩️ Pausita después de <b>${esc(ws[mb])}</b>.`,chunk:whole};

function segScan(acc){const i=acc.indexOf('"segments"');if(i<0)return[];let s=acc.slice(i);const e=s.search(/"(practice|corrections|natural|vocab|pron_tips|encouragement_es)"\s*:/);if(e>0)s=s.slice(0,e);

 <b>✅ Lo que aprendiste</b>${li(r.aprendido)}<b>🔧 Lo que falta mejorar</b>${li(r.mejorar)}<b>📌 Tareas para mañana</b>${li(r.tareas)}`}

 /* auto-update: a new SW takes control (skipWaiting + clients.claim) -> reload once so the newest version shows */
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloaded)return;reloaded=true;location.reload()});
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{const up=()=>reg.update().catch(()=>{});up();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')up()})}).catch(e=>console.warn('SW',e)))}
